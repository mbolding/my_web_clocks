<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>À la recherche du temps perdu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Cormorant Garamond for the roman capitals and the numerals; EB Garamond
         for italics, because Cormorant's current italic misplaces the accents
         on è and ô (La Prisonnière, Le Côté de Guermantes). -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=EB+Garamond:ital@1&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f3eee3;
            --paper-deep: #e7dfcf;
            --ink: #2a231c;
            --ink-soft: #4a4037;
            --muted: #5f564b;
            --rule: #cfc4b0;
            --tea: #8a5a2b;
            --ribbon: #8c2f2f;
            --memory-wash: rgba(176, 128, 72, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background-color: var(--paper);
            background-image:
                radial-gradient(ellipse at 50% 35%, rgba(255, 252, 244, 0.85) 0%, rgba(255, 252, 244, 0) 60%),
                radial-gradient(ellipse at 50% 120%, var(--paper-deep) 0%, rgba(231, 223, 207, 0) 70%);
            color: var(--ink);
            font-family: 'Crimson Text', Georgia, serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Warm wash that rises when a memory surfaces */
        .wash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 40%, var(--memory-wash) 0%, rgba(176, 128, 72, 0.06) 55%, rgba(176, 128, 72, 0) 80%);
            opacity: 0;
            transition: opacity 2.4s ease;
        }

        body.remembering .wash {
            opacity: 1;
        }

        main {
            width: 100%;
            max-width: 960px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: clamp(16px, 3vh, 40px) clamp(16px, 4vw, 48px) clamp(14px, 2.4vh, 28px);
            position: relative;
        }

        .masthead {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(0.72rem, 1.6vw, 0.9rem);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--muted);
            padding-bottom: clamp(10px, 2vh, 18px);
            border-bottom: 1px solid var(--rule);
        }

        .masthead em {
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            text-transform: none;
            letter-spacing: 0.04em;
            font-size: 1.02em;
            color: var(--ink-soft);
        }

        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: clamp(14px, 3vh, 36px) 0 clamp(12px, 2.4vh, 26px);
        }

        .tome {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(0.78rem, 1.7vw, 0.95rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .vol-title {
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 400;
            font-size: clamp(1.5rem, 4.2vw, 2.4rem);
            line-height: 1.1;
            color: var(--ink);
            margin-top: 0.3em;
        }

        .vol-english {
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            color: var(--muted);
            margin-top: 0.25em;
        }

        .time {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: clamp(4.2rem, min(17vw, 15vh), 8.5rem);
            line-height: 1;
            letter-spacing: 0.01em;
            color: var(--ink);
            margin: clamp(10px, 2.4vh, 24px) 0 clamp(6px, 1.2vh, 12px);
            font-variant-numeric: lining-nums tabular-nums;
            transition: text-shadow 2.4s ease, color 2.4s ease;
        }

        .time .sec {
            font-size: 0.32em;
            color: var(--muted);
            margin-left: 0.12em;
            vertical-align: 0.15em;
        }

        body.remembering .time {
            color: #3a2a1c;
            text-shadow: 0.04em 0.03em 0 rgba(138, 90, 43, 0.22), -0.03em -0.02em 0 rgba(138, 90, 43, 0.12);
        }

        .date {
            font-style: italic;
            font-size: clamp(1rem, 2.4vw, 1.2rem);
            color: var(--ink-soft);
        }

        /* The two states (reading / remembering) share one grid cell, so the
           taller of the two sets the height and nothing ever overlaps. */
        .leaf {
            display: grid;
            width: 100%;
            max-width: 640px;
            margin-top: clamp(16px, 3vh, 30px);
        }

        .leaf > section {
            grid-area: 1 / 1;
            transition: opacity 1.6s ease, transform 1.6s ease;
        }

        .reading {
            opacity: 1;
        }

        .memory {
            opacity: 0;
            transform: translateY(6px);
            visibility: hidden;
        }

        body.remembering .reading {
            opacity: 0;
            transform: translateY(-6px);
            visibility: hidden;
            transition: opacity 1.6s ease, transform 1.6s ease, visibility 0s linear 1.6s;
        }

        body.remembering .memory {
            opacity: 1;
            transform: none;
            visibility: visible;
        }

        .memory {
            transition: opacity 1.6s ease, transform 1.6s ease, visibility 0s linear 1.6s;
        }

        body.remembering .memory {
            transition: opacity 1.6s ease, transform 1.6s ease, visibility 0s;
        }

        .setting {
            font-size: clamp(1.08rem, 2.5vw, 1.24rem);
            line-height: 1.55;
            color: var(--ink-soft);
        }

        .sensation {
            margin-top: 0.9em;
            font-size: clamp(0.92rem, 2vw, 1.02rem);
            color: var(--muted);
        }

        .sensation b {
            font-weight: 600;
            font-size: 0.74em;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--tea);
            margin-right: 0.5em;
            white-space: nowrap;
        }

        .memory .fr {
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-size: clamp(1.15rem, 2.9vw, 1.45rem);
            line-height: 1.3;
            color: var(--tea);
        }

        .memory .en {
            font-size: clamp(0.95rem, 2vw, 1.05rem);
            color: var(--muted);
            margin-top: 0.2em;
        }

        .memory .then {
            margin-top: 0.9em;
            font-size: clamp(1.08rem, 2.5vw, 1.28rem);
            line-height: 1.55;
            color: var(--ink-soft);
        }

        .memory .then strong {
            font-weight: 600;
            color: var(--ink);
        }

        .memory .trigger {
            margin-top: 0.5em;
            font-size: clamp(0.92rem, 2vw, 1.02rem);
            font-style: italic;
            color: var(--muted);
        }

        cite {
            font-style: normal;
            font-variant: small-caps;
            letter-spacing: 0.05em;
            color: var(--muted);
            white-space: nowrap;
        }

        .epigraph {
            margin-top: clamp(12px, 2.2vh, 24px);
            max-width: 600px;
            font-size: clamp(0.95rem, 2.1vw, 1.08rem);
            line-height: 1.5;
            color: var(--ink-soft);
        }

        .epigraph[hidden] {
            display: none;
        }

        .epigraph .fr {
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-size: 1.08em;
            color: var(--ink);
        }

        .madeleine {
            flex: none;
            background: none;
            border: 1px solid var(--rule);
            border-radius: 999px;
            padding: 0.3em 0.95em 0.3em 0.7em;
            font: inherit;
            font-size: clamp(0.85rem, 1.8vw, 0.95rem);
            color: var(--ink-soft);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.55em;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .madeleine:hover {
            border-color: var(--tea);
            background-color: rgba(138, 90, 43, 0.06);
        }

        .madeleine:focus-visible {
            outline: 2px solid var(--tea);
            outline-offset: 3px;
        }

        .madeleine svg {
            width: 1.5em;
            height: 1.1em;
            flex: none;
        }

        /* The shelf: seven volumes laid across the day */
        .shelf-wrap {
            border-top: 1px solid var(--rule);
            padding-top: clamp(12px, 2.2vh, 20px);
        }

        .shelf-caption {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1em;
            font-size: clamp(0.82rem, 1.8vw, 0.95rem);
            color: var(--muted);
            margin-bottom: 18px;
        }


        .shelf {
            position: relative;
            display: flex;
            gap: 3px;
            height: clamp(52px, 8vh, 76px);
        }

        .spine {
            position: relative;
            border-radius: 2px 2px 1px 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Crimson Text', Georgia, serif;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.9vw, 1rem);
            letter-spacing: 0.06em;
            color: #4a4037;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.06), rgba(255, 255, 255, 0.18) 30%, rgba(0, 0, 0, 0.04) 75%, rgba(0, 0, 0, 0.1)), #d9cdb5;
            overflow: hidden;
            transition: background-color 1s ease, color 1s ease;
        }

        .spine::before, .spine::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(90, 70, 40, 0.35);
        }

        .spine::before { top: 16%; }
        .spine::after { bottom: 16%; }

        .spine.read {
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.06), rgba(255, 255, 255, 0.14) 30%, rgba(0, 0, 0, 0.04) 75%, rgba(0, 0, 0, 0.1)), #c7b591;
        }

        .spine.current {
            color: #f6efe0;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.18), rgba(255, 255, 255, 0.1) 30%, rgba(0, 0, 0, 0.06) 75%, rgba(0, 0, 0, 0.22)), #6b4a2e;
        }

        .spine.current::before, .spine.current::after {
            background: rgba(230, 200, 140, 0.55);
        }

        .ribbon {
            position: absolute;
            top: -9px;
            bottom: -16px;
            width: 0;
            left: 0;
            pointer-events: none;
        }

        .ribbon.settled {
            transition: left 1s linear;
        }

        /* A ribbon bookmark: it peeks out above the books and hangs
           below them, so it never strikes through a volume number. */
        .ribbon::before {
            content: '';
            position: absolute;
            top: 0;
            height: 9px;
            left: -2px;
            width: 4px;
            border-radius: 2px 2px 0 0;
            background: var(--ribbon);
        }

        .ribbon::after {
            content: '';
            position: absolute;
            bottom: 0;
            height: 15px;
            left: -4px;
            width: 8px;
            background: var(--ribbon);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 70%, 0 100%);
        }

        .ticks {
            position: relative;
            height: 1.6em;
            margin-top: 18px;
            font-size: clamp(0.72rem, 1.6vw, 0.85rem);
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .ticks span {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
        }

        .ticks span:first-child { transform: none; }
        .ticks span:last-child { transform: translateX(-100%); }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        @media (max-width: 520px) {
            .masthead .sep { display: none; }
            .masthead em { display: block; margin-top: 0.3em; }
            .shelf-caption .within { display: none; }
            .shelf { gap: 2px; }
        }

        @media (max-height: 640px) and (min-width: 700px) {
            .time { font-size: clamp(3.5rem, 14vh, 7rem); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="wash" aria-hidden="true"></div>
    <main>
        <header class="masthead">
            Marcel Proust<span class="sep"> &nbsp;·&nbsp; </span><em>À la recherche du temps perdu</em>
        </header>

        <div class="stage">
            <div class="tome" id="tome">Tome I</div>
            <h1 class="vol-title" id="volTitle">Du côté de chez Swann</h1>
            <div class="vol-english" id="volEnglish">Swann's Way</div>

            <div class="time" id="time" role="timer" aria-live="off">00:00<span class="sec">00</span></div>
            <div class="date" id="date">&nbsp;</div>
            <div class="sr-only" aria-live="polite" id="srTime"></div>

            <div class="leaf">
                <section class="reading" id="reading">
                    <p class="setting" id="setting"></p>
                    <p class="sensation" id="sensation"></p>
                </section>
                <section class="memory" id="memory" aria-live="polite">
                    <p class="fr">Et tout d’un coup le souvenir m’est apparu.</p>
                    <p class="en">“And suddenly the memory returns.” <cite>Swann's Way</cite></p>
                    <p class="then" id="memThen"></p>
                    <p class="trigger" id="memTrigger"></p>
                </section>
            </div>

            <p class="epigraph" id="epigraph" hidden></p>

        </div>

        <footer class="shelf-wrap">
            <div class="shelf-caption">
                <span id="progress">Read so far</span>
                <button class="madeleine" id="madeleine" type="button" aria-label="Dip the madeleine in the tea and summon a memory">
                    <svg viewBox="0 0 30 22" aria-hidden="true">
                        <path d="M3 18 C2 9 8 2 15 2 C22 2 28 9 27 18 C22 20 8 20 3 18 Z" fill="#d9a865" stroke="#8a5a2b" stroke-width="1.2"/>
                        <path d="M15 4 V18 M10 5 L8 18 M20 5 L22 18 M6 9 L4 17 M24 9 L26 17" stroke="#8a5a2b" stroke-width="0.9" fill="none" stroke-linecap="round"/>
                    </svg>
                    <span id="madeleineLabel">Dip the madeleine</span>
                </button>
            </div>
            <div class="shelf" id="shelf" aria-hidden="true">
                <div class="ribbon" id="ribbon"></div>
            </div>
            <div class="ticks" id="ticks" aria-hidden="true"></div>
        </footer>
    </main>

    <script>
        // The novel laid across one day. It opens at night, with a man half
        // asleep, and closes at midnight on its last word, "Temps", which is
        // where the narrator resolves to write the book you have just read.
        // So the day loops back to its own beginning, as the novel does.
        // Hour spans are loosely weighted by the length of each volume.
        const volumes = [
            {
                start: 0, end: 4, numeral: 'I',
                title: 'Du côté de chez Swann',
                english: "Swann's Way",
                setting: 'Night at Combray. A boy lies awake for his mother’s kiss, and years later, the shape of a whole town rises out of a cup of tea. Then, before the narrator was born, Swann falls in love with Odette.',
                sensation: 'a crumb of madeleine softened in lime-flower tea'
            },
            {
                start: 4, end: 8, numeral: 'II',
                title: "À l'ombre des jeunes filles en fleurs",
                english: 'Within a Budding Grove',
                setting: 'First light at Balbec. The sea through the windows of the Grand Hotel, a little band of girls along the esplanade, and the painter Elstir in his studio, teaching the narrator how to see.',
                sensation: 'the salt air off the sea at Balbec'
            },
            {
                start: 8, end: 12, numeral: 'III',
                title: 'Le Côté de Guermantes',
                english: 'The Guermantes Way',
                setting: 'Morning in Paris. The family lodges in a wing of the Guermantes’ house, the Duchesse becomes a person rather than a name, the salons glitter and disappoint, and the grandmother dies.',
                sensation: 'a voice on the telephone, small and far away'
            },
            {
                start: 12, end: 15, numeral: 'IV',
                title: 'Sodome et Gomorrhe',
                english: 'Cities of the Plain',
                setting: 'Noon in a courtyard, where Charlus and Jupien meet. A second summer at Balbec, and bending to unbutton his boots, the narrator feels his grandmother’s loss for the first time.',
                sensation: 'stooping to take off a boot'
            },
            {
                start: 15, end: 18, numeral: 'V',
                title: 'La Prisonnière',
                english: 'The Captive',
                setting: 'An afternoon shut in the Paris flat. Albertine asleep, the street cries below the window, Vinteuil’s septet, and Bergotte dying before a little patch of yellow wall in a Vermeer.',
                sensation: 'the little phrase of Vinteuil’s music'
            },
            {
                start: 18, end: 20, numeral: 'VI',
                title: 'Albertine disparue',
                english: 'The Sweet Cheat Gone',
                setting: 'Evening, and Albertine has left. A telegram, a death, and then the slow work of forgetting her, which ends in Venice with his mother.',
                sensation: 'the light on the canals at Venice'
            },
            {
                start: 20, end: 24, numeral: 'VII',
                title: 'Le Temps retrouvé',
                english: 'Time Regained',
                setting: 'The war, and long years away. At a last party at the Guermantes’, every face has aged into a mask, and in the library the narrator understands at last what his book must be.',
                sensation: 'an uneven paving stone underfoot'
            }
        ];

        // What Le Temps retrouvé's own epiphanies, and the madeleine, offer to memory.
        const triggers = [
            'a crumb of madeleine softened in lime-flower tea',
            'an uneven paving stone underfoot',
            'a spoon knocking against a plate',
            'a stiff, starched napkin pressed to the lips',
            'the sound of water in a pipe',
            'the first page of an old copy of François le Champi',
            'the scent of hawthorn along a hedge',
            'the little phrase of Vinteuil’s music'
        ];

        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
            'August', 'September', 'October', 'November', 'December'];
        const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];

        const $ = id => document.getElementById(id);
        const els = {
            tome: $('tome'), volTitle: $('volTitle'), volEnglish: $('volEnglish'),
            time: $('time'), date: $('date'), srTime: $('srTime'),
            setting: $('setting'), sensation: $('sensation'),
            memThen: $('memThen'), memTrigger: $('memTrigger'),
            epigraph: $('epigraph'), progress: $('progress'),
            shelf: $('shelf'), ribbon: $('ribbon'), ticks: $('ticks'),
            madeleine: $('madeleine'), madeleineLabel: $('madeleineLabel')
        };

        const pad = n => String(n).padStart(2, '0');

        // Build the shelf once: each spine's width is its share of the day.
        const spines = volumes.map(v => {
            const s = document.createElement('div');
            s.className = 'spine';
            s.style.flex = `${v.end - v.start} 1 0`;
            s.textContent = v.numeral;
            s.title = `${v.title} (${pad(v.start)}:00 to ${pad(v.end % 24)}:00)`;
            els.shelf.insertBefore(s, els.ribbon);
            return s;
        });
        [0, 4, 8, 12, 15, 18, 20, 24].forEach(h => {
            const t = document.createElement('span');
            t.style.left = `${(h / 24) * 100}%`;
            t.textContent = h === 24 ? '24' : pad(h);
            els.ticks.appendChild(t);
        });

        function volumeIndexFor(hour) {
            for (let i = 0; i < volumes.length; i++) {
                if (hour >= volumes[i].start && hour < volumes[i].end) return i;
            }
            return volumes.length - 1;
        }

        function formatDate(d) {
            return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
        }

        // Small deterministic hash, so memories surface at unpredictable but
        // repeatable moments rather than on a visible schedule.
        function hash(n) {
            let x = (n ^ 0x5bd1e995) >>> 0;
            x = Math.imul(x ^ (x >>> 15), 0x2c1b3c6d) >>> 0;
            x = Math.imul(x ^ (x >>> 12), 0x297a2d39) >>> 0;
            return (x ^ (x >>> 15)) >>> 0;
        }

        // An earlier day at the very same minute.
        function pastMoment(now, seed) {
            const kind = seed % 4;
            const d = new Date(now.getTime());
            let note;
            if (kind === 0) {
                // A Sunday, as the madeleine was a Sunday-morning treat at Combray.
                const back = d.getDay() === 0 ? 7 : d.getDay();
                d.setDate(d.getDate() - back);
                note = 'as at Combray';
            } else if (kind === 1) {
                d.setDate(d.getDate() - 7);
                note = 'a week ago';
            } else {
                const years = kind === 2 ? 1 : 2 + (seed >>> 3) % 19;
                d.setFullYear(d.getFullYear() - years);
                // 29 February has no twin in an ordinary year.
                if (d.getDate() !== now.getDate()) d.setDate(0);
                note = years === 1 ? 'a year ago' : `${years} years ago`;
            }
            return { date: d, note };
        }

        // Memory state. A memory surfaces once in each six-minute stretch, at a
        // moment the hash chooses, and lingers for twenty-four seconds.
        const BLOCK = 360, LINGER = 24;
        let summonedUntil = 0, summonSeed = 0;
        let shownKey = null, lastVolume = -1, lastMinute = -1;

        function scheduledMemory(now) {
            const daySec = Math.floor(now.getTime() / 1000);
            const block = Math.floor(daySec / BLOCK);
            const seed = hash(block);
            const at = block * BLOCK + 30 + (seed % (BLOCK - 30 - LINGER));
            if (daySec >= at && daySec < at + LINGER) return { key: 'b' + block, seed };
            return null;
        }

        function activeMemory(now) {
            if (now.getTime() < summonedUntil) return { key: 's' + summonSeed, seed: summonSeed };
            return scheduledMemory(now);
        }

        function renderMemory(now, mem) {
            const past = pastMoment(now, mem.seed);
            const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
            const then = `The same <strong>${hm}</strong>, on <strong>${formatDate(past.date)}</strong>, ${past.note}.`;
            // Only touch the DOM when the words change, so screen readers hear it once.
            if (els.memThen.innerHTML !== then) els.memThen.innerHTML = then;
            const trig = `Summoned by ${triggers[(mem.seed >>> 5) % triggers.length]}.`;
            if (els.memTrigger.textContent !== trig) els.memTrigger.textContent = trig;
        }

        function renderVolume(i) {
            const v = volumes[i];
            els.tome.textContent = `Tome ${v.numeral} of VII`;
            els.volTitle.textContent = v.title;
            els.volEnglish.textContent = v.english;
            els.setting.textContent = v.setting;
            els.sensation.innerHTML = `<b>What may return</b>${v.sensation}`;
            spines.forEach((s, j) => {
                s.classList.toggle('current', j === i);
                s.classList.toggle('read', j < i);
            });
        }

        // Real lines only: the French text, and Scott Moncrieff's 1922 English.
        function renderEpigraph(now, i) {
            const h = now.getHours();
            let html = '';
            if (i === 0) {
                html = '<span class="fr">« Longtemps, je me suis couché de bonne heure. »</span><br>' +
                    '“For a long time I used to go to bed early.” <cite>Swann\'s Way</cite>';
            } else if (i === 6 && h === 23) {
                html = '<span class="fr">« … dans le Temps. »</span><br>' +
                    'The last words of the novel. At midnight it begins again. <cite>Le Temps retrouvé</cite>';
            } else if (i === 6) {
                html = '<span class="fr">« les vrais paradis sont les paradis qu’on a perdus »</span><br>' +
                    'the true paradises are the paradises we have lost <cite>Le Temps retrouvé</cite>';
            }
            els.epigraph.hidden = !html;
            if (html) els.epigraph.innerHTML = html;
        }

        function tick() {
            const now = new Date();
            const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();

            els.time.innerHTML = `${pad(h)}:${pad(m)}<span class="sec">${pad(s)}</span>`;

            const i = volumeIndexFor(h);
            if (i !== lastVolume) {
                renderVolume(i);
                lastVolume = i;
            }

            if (m !== lastMinute) {
                els.date.textContent = formatDate(now);
                els.srTime.textContent = `${pad(h)}:${pad(m)}, ${volumes[i].title}`;
                renderEpigraph(now, i);
                lastMinute = m;
            }

            // Position in the whole novel, by the second.
            const secOfDay = h * 3600 + m * 60 + s;
            const frac = secOfDay / 86400;
            els.ribbon.style.left = `${(frac * 100).toFixed(3)}%`;
            const v = volumes[i];
            const within = (secOfDay - v.start * 3600) / ((v.end - v.start) * 3600);
            els.progress.innerHTML =
                `${Math.floor(frac * 100)}% of the novel read<span class="within"> · ${Math.floor(within * 100)}% into Tome ${v.numeral}</span>`;

            const mem = activeMemory(now);
            if (mem) {
                renderMemory(now, mem);
                shownKey = mem.key;
                document.body.classList.add('remembering');
                els.madeleineLabel.textContent = 'Remembering…';
            } else if (shownKey !== null) {
                document.body.classList.remove('remembering');
                els.madeleineLabel.textContent = 'Dip the madeleine';
                shownKey = null;
            }
        }

        els.madeleine.addEventListener('click', () => {
            summonSeed = (Math.random() * 0xffffffff) >>> 0;
            summonedUntil = Date.now() + LINGER * 1000;
            tick();
        });

        tick();
        requestAnimationFrame(() => els.ribbon.classList.add('settled'));
        setInterval(tick, 1000);
    </script>
</body>

</html>
