<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Der Zauberberg, The Magic Mountain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:          #eceae3;
            --text:        #1c1a16;
            --muted:       #4f4940;
            --faint:       #6b6359;
            --rule:        #cfcabf;
            --accent:      #2f3e52;
            --accent-soft: #c9d0d8;
            --read:        #55687f;
            --mercury:     #b3221f;
            --glass:       #f2efe8;
            --card:        rgba(247, 245, 239, 0.82);
            --mtn-h:       clamp(64px, 13vh, 140px);
            --dial:        clamp(270px, min(52vw, 58vh), 440px);
        }

        html { background: var(--bg); }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background: linear-gradient(172deg, #dfe1da 0%, var(--bg) 55%, #d9d6cf 100%);
            font-family: 'EB Garamond', Georgia, serif;
            color: var(--text);
            position: relative;
            overflow-x: hidden;
            padding-bottom: calc(var(--mtn-h) + 0.5rem);
        }

        #snowCanvas {
            position: fixed;
            inset: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Mountains sit at the foot of the document, below the content. */
        .mountains {
            position: absolute;
            left: 0; bottom: 0;
            width: 100%;
            height: var(--mtn-h);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 2;
            margin: 0 auto;
            max-width: 1080px;
            padding: clamp(1rem, 3vh, 2rem) 16px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(0.8rem, 2.4vh, 1.6rem);
        }

        header { text-align: center; }

        .title-de {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.9rem, 4.6vw, 3rem);
            font-weight: 400;
            font-style: italic;
            color: var(--accent);
            letter-spacing: 0.04em;
            line-height: 1.05;
        }

        .title-en {
            font-size: clamp(0.72rem, 1.4vw, 0.88rem);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--muted);
            margin-top: 0.35rem;
        }

        .main {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: clamp(1.2rem, 4vw, 3.5rem);
            align-items: center;
            width: 100%;
        }

        /* ── The dial: one day, one reading of the novel ── */
        .dial-wrap {
            position: relative;
            width: var(--dial);
            height: var(--dial);
            justify-self: center;
        }

        .dial-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }

        .dial-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none;
        }

        .time {
            font-size: calc(var(--dial) * 0.165);
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0.01em;
            font-variant-numeric: lining-nums tabular-nums;
        }

        .time .sec {
            font-size: 0.36em;
            color: var(--faint);
            margin-left: 0.12em;
            vertical-align: 0.95em;
        }

        .date {
            font-size: calc(var(--dial) * 0.042);
            color: var(--muted);
            letter-spacing: 0.06em;
            margin-top: 0.35em;
        }

        .ch-mark {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: calc(var(--dial) * 0.05);
            color: var(--accent);
            margin-top: 0.5em;
        }

        /* ── Right column ── */
        .info {
            display: flex;
            flex-direction: column;
            gap: clamp(0.8rem, 2vh, 1.2rem);
            min-width: 0;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--rule);
            padding: clamp(0.8rem, 2vw, 1.1rem) clamp(0.9rem, 2.4vw, 1.4rem);
            backdrop-filter: blur(3px);
        }

        .label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--faint);
        }

        .chapter-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.35rem, 2.6vw, 1.75rem);
            font-weight: 500;
            color: var(--accent);
            line-height: 1.15;
            margin-top: 0.15rem;
        }

        .chapter-title i { font-weight: 400; }

        .chapter-desc {
            font-size: clamp(0.95rem, 1.6vw, 1.05rem);
            color: var(--muted);
            line-height: 1.45;
            margin-top: 0.35rem;
        }

        .story-time {
            margin-top: 0.7rem;
            padding-top: 0.6rem;
            border-top: 1px solid var(--rule);
            font-size: clamp(1rem, 1.8vw, 1.15rem);
            line-height: 1.35;
        }

        .rate {
            font-size: clamp(0.88rem, 1.5vw, 0.98rem);
            font-style: italic;
            color: var(--muted);
            margin-top: 0.25rem;
            line-height: 1.4;
        }

        .rate b { font-style: normal; font-weight: 600; color: var(--mercury); }

        /* Thermometer row */
        .therm-card {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: clamp(0.8rem, 2vw, 1.2rem);
            align-items: center;
        }

        .therm-card svg { width: 46px; height: 150px; display: block; }

        .therm-reading {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.6rem, 3vw, 2rem);
            font-weight: 500;
            color: var(--mercury);
            line-height: 1.1;
            font-variant-numeric: lining-nums tabular-nums;
            margin-top: 0.15rem;
        }

        .therm-status {
            font-size: clamp(0.92rem, 1.5vw, 1rem);
            color: var(--text);
            line-height: 1.35;
            margin-top: 0.1rem;
        }

        .therm-note {
            font-size: 0.86rem;
            color: var(--faint);
            font-style: italic;
            line-height: 1.35;
            margin-top: 0.4rem;
        }

        .routine {
            margin-top: 0.5rem;
            padding-top: 0.45rem;
            border-top: 1px solid var(--rule);
            font-size: 0.95rem;
            color: var(--muted);
        }

        .routine b { font-weight: 500; color: var(--text); }

        /* Quote */
        .quote {
            max-width: 640px;
            text-align: center;
            padding: 0 0.5rem;
        }

        .quote-en {
            font-size: clamp(1rem, 1.9vw, 1.15rem);
            font-style: italic;
            color: var(--muted);
            line-height: 1.55;
        }

        .quote-de {
            font-size: clamp(0.88rem, 1.5vw, 0.96rem);
            color: var(--faint);
            line-height: 1.45;
            margin-top: 0.3rem;
        }

        .quote-attr {
            font-size: 0.72rem;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: 0.16em;
            margin-top: 0.45rem;
        }

        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        @media (max-width: 760px) {
            :root { --dial: clamp(260px, 86vw, 380px); }
            .main { grid-template-columns: minmax(0, 1fr); }
            .title-en { letter-spacing: 0.18em; }
        }
    </style>
</head>
<body>

<canvas aria-hidden="true" id="snowCanvas"></canvas>

<svg class="mountains" aria-hidden="true" viewBox="0 0 1440 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <polygon points="0,220 0,160 90,100 180,140 290,65 400,115 490,75 560,100 630,45 700,80 780,50 860,85 940,38 1020,78 1110,55 1190,88 1270,52 1360,88 1440,65 1440,220"
             fill="#2a3040" opacity="0.6"/>
    <polygon points="630,45 650,62 640,60 618,58" fill="#f1f3f7" opacity="0.9"/>
    <polygon points="940,38 962,57 948,55 926,54" fill="#f1f3f7" opacity="0.9"/>
    <polygon points="0,220 0,185 70,148 150,170 240,115 320,148 400,120 460,138 520,100 585,122 645,88 715,112 775,80 845,105 920,72 1000,100 1080,75 1160,102 1240,78 1320,105 1390,82 1440,98 1440,220"
             fill="#1e2535" opacity="0.88"/>
</svg>

<main class="page">
    <header>
        <h1 class="title-de">Der Zauberberg</h1>
        <div class="title-en">The Magic Mountain · Thomas Mann · 1924</div>
    </header>

    <div class="main">
        <div class="dial-wrap">
            <svg id="dial" viewBox="-200 -200 400 400" aria-hidden="true"></svg>
            <div class="dial-center">
                <div class="time" id="time" aria-hidden="true">00:00<span class="sec">00</span></div>
                <div class="date" id="date"></div>
                <div class="ch-mark" id="chMark"></div>
            </div>
        </div>

        <div class="info">
            <section class="card" aria-labelledby="chTitle">
                <div class="label">Seven chapters in one day</div>
                <h2 class="chapter-title" id="chTitle"></h2>
                <p class="chapter-desc" id="chDesc"></p>
                <p class="story-time" id="storyTime"></p>
                <p class="rate" id="rate"></p>
            </section>

            <section class="card therm-card" aria-labelledby="thermLabel">
                <svg viewBox="0 0 46 150" aria-hidden="true">
                    <rect x="19" y="6" width="10" height="114" rx="5" fill="#f2efe8" stroke="#a49c90" stroke-width="1"/>
                    <rect id="mercury" x="21.5" y="112" width="5" height="8" fill="#b3221f"/>
                    <circle cx="24" cy="130" r="11" fill="#b3221f" stroke="#8e1a17" stroke-width="1"/>
                    <circle cx="20.5" cy="126.5" r="3.2" fill="rgba(255,255,255,0.35)"/>
                    <rect x="21" y="8" width="1.6" height="108" rx="0.8" fill="rgba(255,255,255,0.7)"/>
                    <g id="thermScale" font-family="Georgia, serif" font-size="8" fill="#5a5348" text-anchor="end"></g>
                </svg>
                <div>
                    <div class="label" id="thermLabel">The thermometer</div>
                    <div class="therm-reading" id="thermReading">35.0°</div>
                    <div class="therm-status" id="thermStatus"></div>
                    <div class="therm-note">Four times a day the Berghof patients hold the thermometer under the tongue for seven minutes and enter the result on their charts.</div>
                    <div class="routine">Berghof routine, roughly: <b id="routine"></b></div>
                </div>
            </section>
        </div>
    </div>

    <figure class="quote">
        <blockquote>
            <p class="quote-en" id="quoteEn"></p>
            <p class="quote-de" id="quoteDe" lang="de"></p>
        </blockquote>
        <figcaption class="quote-attr" id="quoteAttr"></figcaption>
    </figure>

    <p class="sr-only" aria-live="polite" id="live"></p>
</main>

<script>
// ── The idea ────────────────────────────────────────────────────────────────
// The day is one reading of the novel. Midnight is Hans Castorp's arrival;
// the seven chapters share out the 24 hours roughly by their length in the
// book. The pages pass at a steady rate, but the time they cover does not:
// the first chapters spend an evening and a day, the last spends years.
// Clock shares are approximate; story spans are approximate (days after
// arrival, seven years = about 2557 days).
const CHAPTERS = [
    { n: 'I',   share: 2.5,  from: 0,    to: 0.25,
      title: 'Ankunft', en: 'Arrival',
      desc: 'Hans Castorp, a young Hamburg engineer, steps off the little mountain train at Davos-Platz to visit his cousin Joachim for three weeks.' },
    { n: 'II',  share: 3.0,  from: 0.25, to: 0.25,
      title: 'Von der Taufschale', en: 'the christening basin',
      desc: 'The narrator turns back to Hamburg: the grandfather, the christening basin, an orphaned boyhood. Up on the mountain, nothing moves.' },
    { n: 'III', share: 10.0, from: 0.25, to: 1.25,
      title: 'Satana', en: 'the first full day',
      desc: 'The first whole day: a glass door slammed at breakfast, the balcony, Hofrat Behrens, and Settembrini on the path, mocking everything.' },
    { n: 'IV',  share: 15.0, from: 1.25, to: 21,
      title: 'Exkurs über den Zeitsinn', en: 'the three weeks',
      desc: 'The visit runs its course in talk and rest cures, with Clawdia Chauchat always on his mind. Then a cold, an examination, and a thermometer of his own.' },
    { n: 'V',   share: 21.0, from: 21,   to: 210,
      title: 'Walpurgisnacht', en: 'the first winter',
      desc: 'Bed rest becomes residence. Autumn, snow, the X-ray room, and at Carnival a conversation with Clawdia, mostly in French.' },
    { n: 'VI',  share: 24.0, from: 210,  to: 790,
      title: 'Schnee', en: 'changes',
      desc: 'Naphta arrives to argue with Settembrini. Hans skis into a blizzard and has his vision. Joachim leaves for the army, and comes back.' },
    { n: 'VII', share: 24.5, from: 790,  to: 2557,
      title: 'Der Donnerschlag', en: 'the years',
      desc: 'Seasons blur. Peeperkorn, the gramophone, a séance, a duel. Then the thunderclap of 1914 calls him down to the flatlands.' },
];

(function layoutChapters() {
    const total = CHAPTERS.reduce((s, c) => s + c.share, 0);
    let acc = 0;
    CHAPTERS.forEach(c => {
        c.start = acc / total * 1440;
        acc += c.share;
        c.end = acc / total * 1440;
    });
})();

// Four seven-minute measurements (times are this clock's choice, not Mann's).
const MEASURE = [7 * 60 + 30, 11 * 60 + 30, 15 * 60 + 30, 21 * 60];
const MEASURE_LEN = 7;        // minutes
const SHOW_RESULT = 20;       // minutes the reading stays on the tube
const HANS_READING = 37.6;    // the reading that keeps him on the mountain

const ROUTINE = [
    [0,    420,  'night, the sanatorium asleep'],
    [420,  480,  'waking, the first measurement in bed'],
    [480,  540,  'first breakfast in the dining hall'],
    [540,  630,  'the prescribed walk'],
    [630,  660,  'second breakfast'],
    [660,  780,  'morning rest cure on the balcony'],
    [780,  840,  'midday dinner'],
    [840,  960,  'the long afternoon rest cure'],
    [960,  1020, 'tea'],
    [1020, 1140, 'a walk, then rest again'],
    [1140, 1230, 'supper'],
    [1230, 1320, 'evening rest cure, wrapped in camel-hair rugs'],
    [1320, 1440, 'lights out'],
];

// Only lines checked against the novel; the German is Mann's (1924),
// the English is H. T. Lowe-Porter's (1927).
const QUOTES = [
    { en: '“What is time? A mystery, a figment—and all-powerful.”',
      de: '„Was ist die Zeit? Ein Geheimnis, – wesenlos und allmächtig.“',
      at: 'Chapter VI, Changes' },
    { en: '“For the sake of goodness and love, man shall let death have no sovereignty over his thoughts.”',
      de: '',
      at: 'Chapter VI, Snow · trans. Lowe-Porter' },
    { en: 'The narrator asks whether time itself, as such, can be narrated.',
      de: '„Kann man die Zeit erzählen, diese selbst, als solche, an und für sich?“',
      at: 'Kapitel VII, Strandspaziergang' },
];

const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
const ORD    = ['first','second','third','fourth','fifth','sixth','seventh'];
const MONTH_ORD = [...ORD, 'eighth', 'ninth', 'tenth', 'eleventh', 'twelfth'];
const pad = n => String(n).padStart(2, '0');

// ── Dial ────────────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
const dial = document.getElementById('dial');
const R_OUT = 168, R_IN = 146;

function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || dial).appendChild(e);
    return e;
}

function polar(r, minute) {
    const a = minute / 1440 * Math.PI * 2 - Math.PI / 2;
    return [r * Math.cos(a), r * Math.sin(a)];
}

function ringPath(m0, m1, r0, r1) {
    const large = (m1 - m0) > 720 ? 1 : 0;
    const [ax, ay] = polar(r1, m0), [bx, by] = polar(r1, m1);
    const [cx, cy] = polar(r0, m1), [dx, dy] = polar(r0, m0);
    return `M${ax.toFixed(2)},${ay.toFixed(2)} A${r1},${r1} 0 ${large} 1 ${bx.toFixed(2)},${by.toFixed(2)} ` +
           `L${cx.toFixed(2)},${cy.toFixed(2)} A${r0},${r0} 0 ${large} 0 ${dx.toFixed(2)},${dy.toFixed(2)} Z`;
}

el('circle', { cx: 0, cy: 0, r: R_IN - 2, fill: 'rgba(247,245,239,0.86)', stroke: '#cfcabf', 'stroke-width': 1 });

const chapterArcs = CHAPTERS.map(c =>
    el('path', { d: ringPath(c.start, c.end, R_IN, R_OUT), fill: '#c9d0d8' }));
const readArc = el('path', { d: '', fill: '#55687f' });

CHAPTERS.forEach(c => {
    const [x0, y0] = polar(R_IN - 1, c.start), [x1, y1] = polar(R_OUT + 5, c.start);
    el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: '#f5f3ed', 'stroke-width': 2 });
});

// Hour ticks and four hour labels inside the ring
for (let h = 0; h < 24; h++) {
    const m = h * 60, major = h % 6 === 0;
    const [x0, y0] = polar(R_IN - 4, m), [x1, y1] = polar(R_IN - (major ? 13 : 8), m);
    el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: '#8a8276', 'stroke-width': major ? 1.4 : 0.8 });
    if (major) {
        const [tx, ty] = polar(R_IN - 24, m);
        const t = el('text', { x: tx, y: ty + 4, 'text-anchor': 'middle', 'font-size': 11,
            fill: '#5a5348', 'font-family': 'EB Garamond, Georgia, serif' });
        t.textContent = pad(h);
    }
}

// Chapter numerals outside the ring
const numerals = CHAPTERS.map(c => {
    const mid = (c.start + c.end) / 2;
    const [x, y] = polar(R_OUT + 17, mid);
    const t = el('text', { x: x.toFixed(1), y: (y + 5).toFixed(1), 'text-anchor': 'middle',
        'font-size': 15, fill: '#6b6359', 'font-family': 'Cormorant Garamond, Georgia, serif' });
    t.textContent = c.n;
    return t;
});

// Hand: a red index across the ring, like the mercury line
const hand = el('line', { x1: 0, y1: -(R_IN - 6), x2: 0, y2: -(R_OUT + 6),
    stroke: '#b3221f', 'stroke-width': 3, 'stroke-linecap': 'round' });
const handDot = el('circle', { cx: 0, cy: -(R_OUT + 6), r: 4, fill: '#b3221f' });

function drawDial(minuteF, idx) {
    readArc.setAttribute('d', minuteF > 0.05 ? ringPath(0, minuteF, R_IN, R_OUT) : '');
    chapterArcs.forEach((a, i) => a.setAttribute('fill', i === idx ? '#a9b6c4' : '#c9d0d8'));
    numerals.forEach((t, i) => {
        t.setAttribute('fill', i === idx ? '#2f3e52' : '#6b6359');
        t.setAttribute('font-weight', i === idx ? '600' : '400');
    });
    const deg = minuteF / 1440 * 360;
    hand.setAttribute('transform', `rotate(${deg.toFixed(3)})`);
    handDot.setAttribute('transform', `rotate(${deg.toFixed(3)})`);
}

// ── Story time ──────────────────────────────────────────────────────────────
function storyPhrase(c, days) {
    if (c.n === 'I') return 'Up here: the evening of arrival.';
    if (c.n === 'II') return 'Up here: the story clock stands still while the narrator looks back.';
    if (days < 1.25) {
        const f = days - 0.25;
        const part = f < 0.33 ? 'morning' : f < 0.66 ? 'afternoon' : 'evening';
        return `Up here: the first full day, ${part}.`;
    }
    if (days < 21) return `Up here: day ${Math.floor(days) + 1} of a visit meant to last three weeks.`;
    const months = days / 30.44;
    if (months < 12) {
        const m = Math.floor(months);
        return `Up here: the ${MONTH_ORD[m]} month of the “three weeks”.`;
    }
    const y = Math.min(Math.floor(days / 365.25), 6);
    const mo = Math.floor((days - y * 365.25) / 30.44) + 1;
    return `Up here: the ${ORD[y]} year, month ${Math.min(mo, 12)}.`;
}

function ratePhrase(c) {
    const hours = (c.end - c.start) / 60;
    const perHour = (c.to - c.from) / hours;          // story days per clock hour
    if (perHour === 0) return 'In this chapter <b>no time passes</b> on the mountain.';
    if (perHour < 1) {
        const h = Math.round(perHour * 24);
        return `In this chapter one hour of your day is <b>about ${h} hours</b> on the mountain.`;
    }
    const d = Math.round(perHour);
    return `In this chapter one hour of your day is <b>about ${d} days</b> on the mountain.`;
}

// ── Thermometer ─────────────────────────────────────────────────────────────
const T_MIN = 35, T_MAX = 39, Y_TOP = 12, Y_BOT = 116;
const tempY = t => Y_BOT - (t - T_MIN) / (T_MAX - T_MIN) * (Y_BOT - Y_TOP);
const scale = document.getElementById('thermScale');
for (let t = 35; t <= 39; t += 0.5) {
    const y = tempY(t), whole = Number.isInteger(t);
    el('line', { x1: 19, y1: y, x2: whole ? 12 : 15, y2: y, stroke: '#8a8276', 'stroke-width': 0.8 }, scale);
    if (whole) {
        const tx = el('text', { x: 10, y: y + 3 }, scale);
        tx.textContent = t;
    }
}
el('line', { x1: 29, y1: tempY(37), x2: 36, y2: tempY(37), stroke: '#b3221f', 'stroke-width': 1 }, scale);
const mercury = document.getElementById('mercury');

function setMercury(t) {
    const y = tempY(t);
    mercury.setAttribute('y', y.toFixed(2));
    mercury.setAttribute('height', (124 - y).toFixed(2));
}

function fmtWait(mins) {
    const total = Math.ceil(mins - 1e-9);
    const h = Math.floor(total / 60), m = total % 60;
    if (h === 0) return `${m}\u00a0min`;
    return `${h}\u00a0h ${pad(m)}\u00a0min`;
}

function updateThermometer(minuteF) {
    const reading = document.getElementById('thermReading');
    const status = document.getElementById('thermStatus');
    for (const t of MEASURE) {
        const into = minuteF - t;
        if (into >= 0 && into < MEASURE_LEN) {
            // Mercury climbs towards body heat, fast at first, then slowly.
            const k = 1 - Math.exp(-into / 1.6);
            const temp = T_MIN + (HANS_READING - T_MIN) * k / (1 - Math.exp(-MEASURE_LEN / 1.6));
            setMercury(temp);
            reading.textContent = temp.toFixed(1) + '°';
            const left = (MEASURE_LEN - into) * 60;
            status.textContent = `Measuring now, ${Math.floor(left / 60)}:${pad(Math.floor(left % 60))} left. Do not speak.`;
            return;
        }
        if (into >= MEASURE_LEN && into < MEASURE_LEN + SHOW_RESULT) {
            setMercury(HANS_READING);
            reading.textContent = HANS_READING.toFixed(1) + '°';
            status.textContent = `Reading taken at ${pad(Math.floor(t / 60))}:${pad(t % 60)}. Entered on the chart.`;
            return;
        }
    }
    const next = MEASURE.find(t => t > minuteF) ?? MEASURE[0] + 1440;
    setMercury(T_MIN);
    reading.textContent = T_MIN.toFixed(1) + '°';
    status.textContent = `Shaken down. Next measurement at ${pad(Math.floor(next % 1440 / 60))}:${pad(next % 60)}, in ${fmtWait(next - minuteF)}.`;
}

// ── Main update (1 Hz) ──────────────────────────────────────────────────────
let lastLive = '';
let lastQuote = -1;

function update() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    const minuteF = h * 60 + m + s / 60;

    document.getElementById('time').innerHTML = `${pad(h)}:${pad(m)}<span class="sec">${pad(s)}</span>`;
    document.getElementById('date').textContent =
        `${DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]}`;

    let idx = CHAPTERS.findIndex(c => minuteF >= c.start && minuteF < c.end);
    if (idx < 0) idx = CHAPTERS.length - 1;
    const c = CHAPTERS[idx];
    const f = (minuteF - c.start) / (c.end - c.start);
    const days = c.from + (c.to - c.from) * f;

    drawDial(minuteF, idx);
    document.getElementById('chMark').textContent = `Chapter ${c.n}`;
    document.getElementById('chTitle').innerHTML = `Chapter ${c.n} · <i lang="de">${c.title}</i>`;
    document.getElementById('chDesc').textContent = c.desc;
    document.getElementById('storyTime').textContent = storyPhrase(c, days);
    document.getElementById('rate').innerHTML = ratePhrase(c);

    updateThermometer(minuteF);
    const r = ROUTINE.find(x => minuteF >= x[0] && minuteF < x[1]) || ROUTINE[ROUTINE.length - 1];
    document.getElementById('routine').textContent = r[2];

    const qi = Math.floor((h * 60 + m) / 20) % QUOTES.length;
    if (qi !== lastQuote) {
        lastQuote = qi;
        document.getElementById('quoteEn').textContent = QUOTES[qi].en;
        const de = document.getElementById('quoteDe');
        de.textContent = QUOTES[qi].de;
        de.hidden = !QUOTES[qi].de;
        document.getElementById('quoteAttr').textContent = 'Thomas Mann, Der Zauberberg · ' + QUOTES[qi].at;
    }

    const live = `${pad(h)}:${pad(m)}. Chapter ${c.n}. ${storyPhrase(c, days)}`;
    if (live !== lastLive) {
        lastLive = live;
        document.getElementById('live').textContent = live;
    }
}

update();
setInterval(update, 1000);

// ── Snow (decorative) ───────────────────────────────────────────────────────
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const canvas = document.getElementById('snowCanvas');
const ctx = canvas.getContext('2d');
let flakes = [], width, height, snowRunning = false;

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initFlakes() {
    const n = Math.round(Math.min(110, width * height / 11000));
    flakes = Array.from({ length: n }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.7 + 0.5,
        speed: Math.random() * 0.4 + 0.12,
        drift: (Math.random() - 0.5) * 0.25,
        a: Math.random() * 0.4 + 0.25,
    }));
}

function drawSnow(step) {
    ctx.clearRect(0, 0, width, height);
    for (const f of flakes) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${f.a})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(120, 135, 160, ${f.a * 0.45})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
        if (step) {
            f.y += f.speed;
            f.x += f.drift;
            if (f.y > height + 4) { f.y = -4; f.x = Math.random() * width; }
            if (f.x > width + 4) f.x = -4;
            if (f.x < -4) f.x = width + 4;
        }
    }
}

function animateSnow() {
    drawSnow(true);
    if (!reduceMotion.matches) requestAnimationFrame(animateSnow);
    else snowRunning = false;
}

function startSnow() {
    if (reduceMotion.matches) { drawSnow(false); return; }
    if (!snowRunning) { snowRunning = true; requestAnimationFrame(animateSnow); }
}

resizeCanvas();
initFlakes();
startSnow();
window.addEventListener('resize', () => { resizeCanvas(); initFlakes(); if (reduceMotion.matches) drawSnow(false); });
reduceMotion.addEventListener?.('change', startSnow);
</script>
