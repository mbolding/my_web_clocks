/* ===================================================================
   THE SLOW POST: presentation layer
   The page is a sheet on a table. No chrome, no nav, no buttons.
   Light is an administrative decision here, so the palette follows the
   Survey's lamp schedule and deliberately ignores prefers-color-scheme.
   =================================================================== */

:root {
    --surround: #E2DAC7;
    --page:     #EAE3D2;
    --ink:      #2A241C;
    --mark:     #8A7A5C;
    --rule:     rgba(138, 122, 92, 0.38);
    --panel:    #F0EADC;
    --measure:  62ch;
    --glow:     0;
    --underink: transparent;
}

/* i LAMPS UP, 06:00 to 11:59 */
html[data-band="i"] {
    --surround: #E2DAC7; --page: #EAE3D2; --ink: #2A241C;
    --mark: #8A7A5C; --rule: rgba(138, 122, 92, 0.38); --panel: #F1EBDD;
}

/* ii THE DROP, 12:00 to 12:59. One hour. Half lamp everywhere in the House. */
html[data-band="ii"] {
    --surround: #D3CCBA; --page: #DDD6C4; --ink: #2E2820;
    --mark: #6E7A78; --rule: rgba(110, 122, 120, 0.40); --panel: #E4DDCC;
    --underink: #7C4B2E;
}

/* iii TRIMMED, 13:00 to 17:59 */
html[data-band="iii"] {
    --surround: #D5CEBD; --page: #DFD8C7; --ink: #332D25;
    --mark: #857759; --rule: rgba(133, 119, 89, 0.38); --panel: #E6DFCF;
}

/* iv EVENING RATION, 18:00 to 21:59 */
html[data-band="iv"] {
    --surround: #241E17; --page: #CBBA97; --ink: #2B2219;
    --mark: #8A5A28; --rule: rgba(138, 90, 40, 0.55); --panel: #D4C4A3;
    --glow: 1;
}

/* v LAMPS DOWN, 22:00 to 05:59. One lamp in a dark room. */
html[data-band="v"] {
    --surround: #100E0B; --page: #100E0B; --ink: #B8AD93;
    --mark: #6E6455; --rule: rgba(184, 173, 147, 0.70); --panel: #16130F;
    --measure: 54ch; --glow: 1;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--surround);
    color: var(--ink);
    font-family: 'Crimson Text', Georgia, serif;
    font-size: clamp(1.02rem, 0.92rem + 0.42vw, 1.24rem);
    line-height: 1.64;
    min-height: 100vh;
    transition: background-color 1.2s ease, color 1.2s ease;
    overflow-x: hidden;
}

/* Fibre, not parchment cliche. Two gradients at three percent. */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.03;
    background:
        repeating-linear-gradient(94deg, transparent 0 2px, var(--ink) 2px 3px),
        repeating-linear-gradient(6deg, transparent 0 3px, var(--ink) 3px 4px);
}

/* The lamp. Present only in the two banded-dark states. */
.lamp {
    position: fixed;
    left: 50%;
    top: 42%;
    width: min(150vh, 165vw);
    height: min(110vh, 120vw);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
    opacity: calc(var(--glow) * 1);
    background: radial-gradient(ellipse at center,
        rgba(255, 228, 176, 0.16) 0%,
        rgba(255, 220, 160, 0.07) 38%,
        transparent 72%);
    animation: breathe 7s ease-in-out infinite;
    transition: opacity 1.2s ease;
}

@keyframes breathe {
    0%, 100% { opacity: calc(var(--glow) * 0.965); }
    50%      { opacity: calc(var(--glow) * 1); }
}

main {
    position: relative;
    z-index: 1;
    max-width: min(62ch, 100% - 2rem);
    margin: 0 auto;
    padding: clamp(1.4rem, 4vw, 3rem) 1rem clamp(4rem, 12vh, 7rem);
    background: transparent;
    transition: max-width 1.2s ease;
}

/* Bands iv and v put the column on lit paper against a dark room. */
html[data-band="iv"] main,
html[data-band="v"] main {
    background: linear-gradient(var(--page), var(--page));
    background-clip: padding-box;
}
html[data-band="v"] main { background: transparent; }
html[data-band="iv"] main {
    padding-left: clamp(1rem, 4vw, 2.4rem);
    padding-right: clamp(1rem, 4vw, 2.4rem);
    box-shadow: 0 0 60px 30px rgba(203, 186, 151, 0.18);
}

/* --- the stamp: clock face and document header in one object -------- */

.stamp {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: clamp(0.68rem, 0.62rem + 0.2vw, 0.78rem);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    opacity: 0.7;
    text-align: right;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
    margin-bottom: clamp(1.6rem, 4vh, 2.6rem);
    line-height: 1.9;
}
.stamp .clock { font-weight: 700; opacity: 1; letter-spacing: 0.12em; }
.stamp .sep { opacity: 0.45; padding: 0 0.15em; }
@media (max-width: 30rem) {
    .stamp { text-align: left; }
    .stamp .fold { display: block; }
    .stamp .fold + .fold .sep:first-child { display: none; }
}

/* --- prose registers ------------------------------------------------ */

#passage {
    max-width: var(--measure);
    margin: 0 auto;
    transition: max-width 1.2s ease;
}

h1.passage-title {
    font-family: 'Crimson Text', Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.05rem, 0.98rem + 0.3vw, 1.2rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.62;
    margin-bottom: 1.6rem;
}

p { margin-bottom: 1.05rem; }
p:last-of-type { margin-bottom: 0; }

hr.gap {
    border: 0;
    height: 1px;
    background: var(--rule);
    width: 4rem;
    margin: 2rem auto;
    opacity: 0.6;
}

/* Letters: typeset objects on a panel, first-line indent after the first. */
.letter {
    background: var(--panel);
    border-left: 2px solid var(--mark);
    padding: clamp(1rem, 3vw, 1.6rem) clamp(1rem, 3.4vw, 1.8rem);
    margin: 1.4rem 0;
}
.letter p + p { text-indent: 1.4em; margin-bottom: 0.6rem; }

/* Wrapper stamp above a letter: route, drops, walking days, weight. */
.wrapper {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.66;
    line-height: 1.8;
    margin-bottom: 0.9rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px dotted var(--rule);
}
.wrapper .struck { text-decoration: line-through; opacity: 0.55; }

/* Daybook and carbons: institutional hand, ruled paper, narrow measure. */
.ledger {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 0.88em;
    line-height: 1.85;
    max-width: 46ch;
    padding: clamp(0.9rem, 2.6vw, 1.4rem) 0 clamp(0.9rem, 2.6vw, 1.4rem) clamp(0.9rem, 3vw, 1.5rem);
    margin: 1.4rem 0;
    border-left: 1px solid var(--rule);
    background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(1.85em - 1px),
        var(--rule) calc(1.85em - 1px),
        var(--rule) 1.85em
    );
    background-size: 100% 1.85em;
}
.ledger p { margin-bottom: 0; text-indent: 0; }
.ledger .ruled { text-decoration: line-through; text-decoration-thickness: 1px; opacity: 0.78; }

/* The filing hand. Never identified, used four times in the whole piece. */
.filing {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 0.8em;
    opacity: 0.62;
    margin: 1.2rem 0;
}

blockquote {
    margin: 1.2rem 0 1.2rem 1.2rem;
    padding-left: 1rem;
    border-left: 1px solid var(--rule);
    font-style: italic;
}

/* --- lexia: pressure in the page, never a hyperlink ----------------- */

.lexia {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    letter-spacing: 0.012em;
    border-bottom: 1px dotted var(--rule);
    transition: border-bottom-color 140ms ease, background-color 140ms ease;
    border-radius: 2px;
    padding: 0 0.06em;
}
.lexia:hover,
.lexia:focus-visible {
    border-bottom: 1px solid var(--mark);
    background: color-mix(in srgb, var(--mark) 8%, transparent);
}
.lexia:focus-visible { outline: 1px solid var(--mark); outline-offset: 2px; }

html[data-band="v"] .lexia { letter-spacing: 0.02em; }

/* Followed: the page keeps its own record of where you have been. */
.lexia.been {
    opacity: 0.92;
    border-bottom-style: solid;
    border-bottom-color: color-mix(in srgb, var(--rule) 60%, transparent);
}

/* Visible but unlit: the door is there and it is shut. */
.shut {
    opacity: 0.74;
    cursor: default;
    border-bottom: 0;
}
.shut-line {
    display: block;
    font-style: italic;
    opacity: 0.72;
    margin: 0.5rem 0 0.9rem;
    padding-left: 1rem;
    border-left: 1px solid var(--rule);
}

/* A Thresh number you cannot yet read. Visibly inert. */
.dead-type {
    opacity: 0.35;
    font-family: 'Courier Prime', 'Courier New', monospace;
    letter-spacing: 0.04em;
}

/* --- the only navigation object in the piece ------------------------ */

.return {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 0.76rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-top: clamp(2.4rem, 6vh, 3.6rem);
    padding-top: 1rem;
    border-top: 1px solid var(--rule);
}
.return a { color: inherit; text-decoration: none; cursor: pointer; border-bottom: 1px dotted var(--rule); }
.return a:hover, .return a:focus-visible { border-bottom: 1px solid var(--mark); }

#passage { animation: arrive 900ms ease both; }
@keyframes arrive {
    from { opacity: 0; transform: translateY(1.5%); }
    to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
    #passage { animation: none; }
    .lamp { animation: none; opacity: calc(var(--glow) * 1); }
    body, main, .lamp { transition: none; }
}

/* --- late additions ------------------------------------------------- */

.cold-exits { margin-top: 1.6rem; opacity: 0.9; }
.ledger.cold { background-image: none; border-left-style: dashed; }

.lexia.trim, .lexia.act { cursor: pointer; }

.reset {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    opacity: 0.45;
    margin-top: 2.4rem;
}
.reset a { color: inherit; cursor: pointer; border-bottom: 1px dotted var(--rule); }
.reset a:hover, .reset a:focus-visible { opacity: 0.85; }
.reset a.armed { letter-spacing: 0.06em; text-transform: none; opacity: 0.8; border-bottom: 0; }

.wrapper .sep { opacity: 0.4; }
    </style>
</head>

    "text": "Dear Ilse,\n\nCold glue, iron, and dust that has never been outdoors. That is the answer. I am sorry to have taken so long over three nouns.\n\nThe glue is the binders' and it is going off slowly in every direction at once, which is not a failure in the glue but the ordinary behaviour of glue given time. The iron is the standards, the stair treads, and what is left of the gutters on the ninth landing. The dust is the part I would like you to have. Dust that has been out of doors has weather in it and comes off the hand grey; this comes off the hand the colour of the paper it left. I have weighed it off a shelf top at a little under a drachm to the metre, if that is any use to you.\n\nThere is one exception on this floor and I cannot account for it. Range Six smells of apples. Not of something like apples: of apples, in the fifth bay, at about shoulder height, and more in the cold season than out of it. Three survey parties have recorded the fact and entered it under conditions observed. None of them has established why, and the last party wrote underneath that the matter was not within the scope of the survey, which I have copied out and kept.\n\nI am told [[the galleries at your end smell of nothing at all, which I refuse to believe->long_gallery]]. A room of that length is never neutral. Stand in it at the eighth hour and tell me I am wrong, and I will accept the correction and go on believing it.\n\nI owe you [[an account of why I write at such length, when a shorter letter would say the same thing->paid_by_weight]], and it will not fit under the weight I have left myself.\n\n[[The question you put to me, which I have here and you do not->what_i_asked]] has been pinned above this desk for four years. I have replaced the pin twice. The paper has gone the colour of the desk and I no longer take it down to read. It is the oldest thing on this desk that is not furniture.\n\nA. Vey\nSub-Cataloguer, Unassigned Matter"

    "text": "To the Keeper, Post 11-40.\n\nA discrepancy has been raised against your shelf-list return and requires correction at your end.\n\nRange Nine, bay 3, shelf 4. Your return enters seventeen volumes at that shelf. The Division's transcription of the same shelf, taken from your predecessor's return and not amended since, enters sixteen. The difference is one volume and it has stood over three rulings, which is why the query has come to this Division and not been settled between the returns.\n\nThe Division does not assume an error at your end. Three causes are ordinarily responsible, in the order of their frequency. A volume shelved out of its run at a neighbouring bay and counted twice at the turn. A Thresh number whose third field cannot be read, entered under two readings by two hands. A volume taken down and left lying flat on the shelf top, which is not a fault but is not a count either.\n\nYour return for the current ruling is in order in all other particulars. The transcription is a record of a return and is not evidence of the shelf, which is why the count is asked for standing and not from the book.\n\nYou are requested to walk the run, count it standing, and return a note confirming the correction in whichever direction it falls. A note is required whether or not a correction is made. If the seventeen is correct the transcription will be amended here and you need do nothing further. Failing a return note within the ruling, the query is carried forward and re-entered, and this Division is obliged to raise it again in the same terms.\n\nThe query is entered under its date of writing, which is [[the order the transcription volume is bound in->the_manifest]] and the order it will be read in afterwards.\n\nNo further action is required of you.\n\n9-64\nDivision of Unassigned Matter, Ninth Interior"

    "text": "Varn,\n\nThe new fields reached the Ninth Interior in the third week and I have had my hands in them since, and I find, to my own surprise, that I like the work. Four of them, and every one a thing a man can put a rule against: height in millimetres, binding material, shelf-load in kilogrammes, date of accession. No inference. No precedent. Two officers in two ranges on two days will write down the same four facts about the same volume, and the fourth appendix will not have to concede again that no range has ever been counted twice with the same result. It is perfectly legible. I have written that in three reports now and meant it as praise every time.\n\nMy work this month is retiring conditions. I take the old number, read its three fields at the drop, which is the only hour they will show, and enter the four new ones in its place. Yesterday I retired VI.318 / iii / draw / standing, a volume to be read at the trimmed hour, in the draw, by a reader on his feet. Then VII.61 / i / fog / not before, which forbids it before its hour and is silent about after. Then a third whose condition is in company, which requires only that somebody else be in the room with you.\n\nI can give that one's height to the millimetre. I cannot give in company.\n\nThere is no field for it, and there is no field behind the fields. I put the question to the Division and was told, correctly, that conditions of reading are not accession facts, so I entered the height. The work is going well. I have begun to think about [[what a scheme that counts everything countable does to a four range room with two readers in it->threshold]], which you wrote to me about a season ago and which I have not answered as I should have. If there is a range at your end still standing in the old numbers, [[leave it standing and do not report it->the_thresh]].\n\nA. Vey, Sub-Cataloguer, Unassigned Matter"

 "holding_location": {

  "blocks": [

    "register": "letter",
    "text": "Ilse,\n\nA small administrative matter, which I will put at the top so that it cannot sit at the foot of the page pretending to be an afterthought.\n\nI have entered eleven volumes of XI.407 / ii / dry / into the catalogue as held at Post Eleven-Forty. The entry went up on the accession run last quarter with two hundred and forty others and was countersigned without comment, because a holding location is a fact about where a thing stands, and nobody audits a fact about where a thing stands. The regulation is in the twelfth schedule and I have copied out the part of it that matters: a post that holds catalogued material cannot be struck.\n\nEleven volumes is not a figure anybody looks at twice. Four would have read light for a class of that age; forty would have wanted a shelf survey; this wants nothing at all.\n\nThe draught in the corridor outside the accession office has been rerouted and now arrives at the ankles instead of the neck, which I am assured is an improvement.\n\nI should say the rest of it plainly, since you will see your own post number in the standing list before the season is out. The list goes to every division and every relay office in the House, so the address will be printed and carried forward, by people with no reason whatever to care about it, for as long as the catalogue is printed at all.\n\nThe catalogue never asks what a holding is made of. [[It asks only where the thing stands, and it takes the keeper's word for that->the_slip]].\n\nYour runner's boots: I enquired, and the ration on a circuit of that length is two pairs a year, which seems to me thin. Ask for three and cite the stair count.\n\nI would not have you think this cost me anything. It took an afternoon and a pen.\n\nA. Vey\nEntering officer, 9-64"
   },

    "register": "frame",
    "text": "[[What she worked out off the standing list, and the one correction she put on a form about it->daybook_collision]] is nineteen days into that ruling, in the ruled book on the shelf behind you. The next thing the post brought was [[the letter in which a query is raised against exactly this->bad_season]]."
   }

    "register": "letter",
    "text": "Varn,\n\nThree items, in the order the Division served them and not in the order of their weight.\n\nThe survey party came through Unassigned Matter on the ninth and audited seven hundred and sixty entries in four days. A query has been raised against XI.407 / ii / dry / , numbered 4-6631, on the ground that a class of that age ought to have generated a call and has generated none. A transfer order is pending against me, out of the Ninth Interior to a division not yet stated, which the clerk called routine. I signed for it in front of him, and he waited out the coughing with great patience, and took his pen back.\n\nIf the query is upheld the class is dissolved and the volumes under it cease to be catalogued, and uncatalogued matter [[goes down the north stair and goes on existing->hold_door]]. There is a form for that too. I am not going to ask you for anything, because you would send it, and it would walk four years, and it would arrive the wrong size.\n\nI would rather know about your roof.\n\nYou wrote in the spring that the stain over the third bay in Range Four was the shape of nothing in particular. I have thought about that sentence more than a man with a transfer order in his tray ought to. Is it the shape of nothing in particular still, or has it taken an edge? A stain that has stopped working has a hard brown rim, dry to the knuckle. A stain that is still working has a pale margin you can feel before you can see it.\n\nIf there is a pale margin, do not go up. Go under. Tack a sheet of oilcloth to the underside of the joists, a foot clear of the stain on all four sides, leave one corner slack so that it sags, and stand a can under the sag. The water then arrives in one place and you empty the can, which is tedious and is not a repair, and keeps it off the fore edges of Range Four. Oilcloth holds about three years. Report it as a lamp fitting. They come and look at lamp fittings.\n\nWrite and tell me the shape.\n\nA. Vey, Sub-Cataloguer, Unassigned Matter"

    "text": "[[The correction she had already put on a form against this holding, years before the Division numbered a query to it->daybook_collision]] is in the ruled book behind you, with a carbon pinned facing it. Five days passed before the post brought the next of these, [[in which he answers the sum she sent him, itemised back to her->the_channel]]."
   }

  "title": "The Only Thing That Moves in a Straight Line",
  "kind": "letter",
  "day": 24,
  "wrapper": "ROUTE 9-64 TO 11-40 | DROPS 46 | WALKING DAYS 702 | WEIGHT 148 DRACHMS",
  "blocks": [
   {
    "register": "letter",
    "text": "Ilse,\n\nYour sum came up in the spring sack. I have done [[the whole of it again twice, item by item down to the boots->arithmetic_of_walking]], my own way, and got your figures both times. You have costed your own knees as equipment and rounded the weight of my letters down, which I noticed.\n\nI am going to say no, and the reason is not the number of days.\n\nI have been to the Sixth Gallery. Six years ago, before you ever asked, on a fortnight's leave I spent walking outward with a lamp because I wanted to know. It is shut. Shut and left, the doors set into two centuries of settle, and the way round it the charts show is sixty walks of unlit stair. I did not tell you. I have held it against a question I hoped you would not put, and you have put it.\n\nThat is not the argument. Here it is.\n\nYou would not be coming toward me, you would be going into the building. At the far end of twelve hundred days there is a filing number and a desk, and the man it belongs to may by then have been reassigned inward, retired, or moved a range over, and the desk will not know which. There is no office in this library whose business is forwarding. The catalogue records where a book stands. Nothing in the House records where a person went.\n\nSo you would arrive, and ask, and be met with great courtesy, and you would have spent your knees, your ration, and [[the address that is the only thing still reaching me, and you have already told me what leaving it costs->threshold]].\n\nThe post is the only thing in this building that has ever moved in a straight line. It is not the second best way to reach me. It is the only way.\n\nI am asking you to stay at a cold desk and write to a man you will never meet and call that a life. I ask it because it is true and not because it is bearable.\n\nNow the logistics, which are also the answer. Keep to the heavy stock. Your last one took twenty-two months post to post; a thin one would be sitting in a relay box between us yet, and I would be answering a thing you had forgotten writing. Write long. Write heavy. That is the whole of my advice and worth more than the rest of this letter.\n\nA. Vey"

 "to_the_post": {

  "wrapper": "ROUTE 9-64 TO 11-40 | DROPS 59 | WALKING DAYS 1,118 | WEIGHT 79 DRACHMS",
  "blocks": [
   {
    "register": "letter",
    "text": "To Post Eleven-Forty. Not to the keeper of it: to the post, because the post is what the regulations recognise and the post will outlast us both.\n\nI will give the reason at the top, which is where I always put it, so that it is not sitting at the foot of the page pretending to be an afterthought. In the spring a Form 7 came back to me with the receiving frank of Eleven-Thirty-Nine on it and Eleven-Forty struck out in pencil. A post is worked from its neighbour when there is nobody in it. I have known what that frank means since I was a junior. I have never before had to read it off an address I write to every week.\n\nWhoever is standing at this table: you are not the person I was writing to, and you are the person the order provides for, and the order is not wrong. Letters are addressed to posts and not to people, and we are all told that this is good practice, and it is. [[You wrote to me once that the office knows an address and not a person->threshold]]. You meant it as the thing you were afraid of. I am using it as the thing I can rely on.\n\nI am not asking for a reply. There is no address I could give that would still be one by the time a reply was written. I ask instead that Standing Order Four be complied with, in both its parts, by whoever is standing there as the rest of this comes in, and it will come in for some time yet, because I have been writing ahead of the runners for fourteen years and they have not caught me up.\n\nThe bundle: keep it flat in its wrapper and do not tie it with string, which cuts the folds. [[Anything loose in the wrapper stays in the wrapper, including the one form that was never lodged->the_slip]]. Store it at the range end, off the floor, and not under Range Four.\n\nA. Vey, Sub-Cataloguer, Unassigned Matter, 9-64"
   },

    "register": "frame",
    "text": "It is on the light stock, and it is the only one in the bundle that is. [[The last entry anybody completed in the ruled book at this post->daybook_last]] stands on the shelf behind you. The post brought one thing after this, at the reconciling, and [[it weighs almost nothing and has been walking the whole time->one_line]]."

    "text": "CARBON. POST 11-40 TO POST 9-64. STANDING ORDER NINE. DISPATCH WEIGHT 74 DRACHMS. OVERWEIGHT 30 DRACHMS, PAID FROM RATION.\n\nRETENTION NOT REQUIRED AT THIS DISPATCH. COPY RETAINED."
   },
   {
    "register": "ledger",
    "text": "Vey,\n\nThe roof went into Range Four on the second, into the third bay, which is where it goes. I moved six volumes and stood them on their fore edges to dry, which is forbidden, and they are dry. Ration sixteen lamp hours. I burned nineteen and will make it up out of next week. Mail in, one. Mail out, this.\n\nTwo readers. One of them was Pell, who came in out of the draw and stood at the table for the length of a cup, and I wrote him down in the column with the hour, because the column asks for readers and does not ask what they came for.\n\nNine years I have kept this post. I can give you the height of every shelf in four ranges, the load on each of them, and the weight of the door. I have all the figures there are about this room and I have checked most of them twice.\n\nSo here is a request with no form behind it.\n\nTell me one thing about where you are that is not a number. Not the range count, not the shelf load, not how many volumes you placed this quarter. What the air does down there at the trimmed hour. What it smells of. Anything I could not get off a return.\n\nI. Varn, Keeper, 11-40"

 "hands_that_carried": {
  "title": "Forty Pairs of Hands",
  "kind": "carbon",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "ledger",
    "text": "CARBON. POST 11-40 TO POST 9-64. STANDING ORDER NINE. DISPATCH WEIGHT 96 DRACHMS. OVERWEIGHT 52 DRACHMS, PAID FROM RATION.\n\nRETENTION NOT REQUIRED AT THIS DISPATCH. COPY RETAINED."
   },
   {
    "register": "ledger",
    "text": "Vey,\n\nFog to the eighth hour all week. Seventeen lamp hours burned on the ration of sixteen, and the wick at the Range Two end is going.\n\nI asked Pell for the loan of the docket and copied the circuit list off it, the sack between us. Thirty-nine circuits between this post and the Ninth Interior. One runner to a circuit, and at the end of each one the thing is put down and somebody else picks it up. The one standing in front of me walks the first of them. The fortieth pair of hands is not on the docket at all: it is whoever lifts it out of the sack at your end and carries it to your desk, and the docket has no field for him.\n\nThe wrappers on this desk say seventy-three drops, and ninety-one, and sixty-four. That is not the same count, and the hands are forty every time. A box is not a pair of hands. A letter can sit in one box twice, set down both times by the same runner, and the box takes the credit for both. The first of the forty is here, at this end, in [[the iron box at the stair head, where a thin letter waits until it is worth a runner's back->relay_box]].\n\nSo: forty. By the time this is in your hands it will have been in forty other pairs first, none of them told what they were holding. That is as near as either of us is going to come to being touched by the other, and I would rather have the figure than not.\n\nOil came short again on the quarter and I have asked for the shortfall carried forward, which they will refuse. I will ask again at the turn, a refusal not being a ruling."
   },
   {
    "register": "ledger",
    "text": "COPY ENDS AT THE FOOT OF THE SECOND SHEET. NO SIGNATURE ON THE RETAINED COPY."
   },

    "register": "frame",
    "text": "She stopped there and did not sign, and the flimsy holds the blank as plainly as the writing. All forty pairs of hands are walking toward [[an address the Survey can strike, and it does not need her name to strike it->threshold]]. [[The first thing he ever sent her, and what was in it->dear_keeper]] is somewhere in the bundle at your elbow."

  "kind": "carbon",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "ledger",
    "text": "CARBON. POST 11-40 TO POST 9-64. STANDING ORDER NINE. DISPATCH WEIGHT 81 DRACHMS. OVERWEIGHT 37 DRACHMS, PAID FROM RATION.\n\nRETENTION NOT REQUIRED AT THIS DISPATCH. COPY RETAINED."
   },
   {
    "register": "ledger",
    "text": "Vey,\n\nBook-rain in the Long Gallery on the fourth and again on the sixth, Condition Three both times, and nothing of mine took harm.\n\nA notice came up with the sack, and I will copy the two sentences of it that decide the matter, as they are written, since they put the thing better than I would. Posts recording fewer than four readers in a calendar month over three consecutive months are struck. Keepers of struck posts are reassigned inward.\n\nThe reassignment is not the part I want you to have. I can work anywhere. They can set me in a stack at the Fourth Interior and I will keep a column there as well as I keep one here, and the oil will be better.\n\nThis is the part. The post office holds no record of me. It holds a record of Eleven-Forty. Letters are addressed to posts and not to people, which is good practice and is the reason anything of ours outlasts us, and it is also the reason that if this post is struck, every letter of yours now walking toward it, including the ones you sent three years ago and have forgotten the contents of, arrives at a dead address, is held one season, and is reduced. I would not be at the address. I would be alive, at some other address, and there is no form anywhere in the House on which that second address gets written.\n\nThe Eleven-Thirty-Nine keeper has offered me her spare gasket for the range lamp. It is two millimetres out and I am taking it."

 "arithmetic_of_walking": {
  "title": "Nine Hundred Days at the Cheapest Estimate",
  "kind": "carbon",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "ledger",
    "text": "CARBON. POST 11-40 TO POST 9-64. STANDING ORDER NINE. DISPATCH WEIGHT 118 DRACHMS. OVERWEIGHT 74 DRACHMS, PAID FROM RATION.\n\nRETENTION NOT REQUIRED AT THIS DISPATCH. COPY RETAINED."
   },
   {
    "register": "ledger",
    "text": "Vey,\n\nDry all week. Ration sixteen lamp hours, sixteen burned, which has not happened before.\n\nI have costed the walk and set it out as a load: a sum can be checked; an offer cannot.\n\nITEM. Distance. No closer than five hundred and forty walks inward, which is the Division's chart for the Ninth Interior. No further than six hundred and sixty, which is the best this route has ever done on a wrapper I have held, and a runner does one walk a day. A range a hundred and twenty wide. Not an estimate. A shrug with figures in it.\n\nITEM. Pace. A walk is a runner's day under a full sack. Six tenths of a walk in a day, stairs counted in, held four days running to be sure of it.\n\nITEM. Stairs. Nine hundred and forty flights on the eastbound galleries by the relay tables, with the Sixth Gallery open. It has not been open in the memory of anybody I can ask. Going round it adds sixty walks and worse footing.\n\nITEM. Boots. The runner's ration is two pairs a year, a pair to every hundred and eighty-two walks and a half. I have allowed a hundred and eighty. Three pairs to the near end, four to the far. Three pairs bought.\n\nITEM. Oil. A lamp I carry is a lamp I fill. Six drachms a day at the least, and no post on that stretch issues it. Five thousand four hundred drachms at the cheapest estimate, nearly three times the weight of all you have sent me.\n\nITEM. Knees. Fifty-one years old, both. No spares held at this post.\n\nITEM. Carried weight, letters. One thousand nine hundred and forty four drachms on the post scale, one thousand nine hundred and thirty at Eleven-Thirty-Nine, entered at the lower, which is not how a load is costed, and not changed.\n\nITEM. Forwarding. None.\n\nITEM. Return. None.\n\nITEM. Not costed: [[what the ranges here become when nobody returns a shelf-list for them, which is floor at the bottom of the north stair->hold_door]].\n\nSUM. Five hundred and forty walks at six tenths of a walk in a day is nine hundred days, near end of the shrug, Sixth Gallery open. Seven hundred and twenty walks is twelve hundred, on the figures as they stand.\n\nThat is the sum. There is no question at the foot of it.\n\nI. Varn"

    "text": "The regulation, two clauses of it side by side: a post that holds catalogued material cannot be struck, and is surveyed.\n\nHe has entered eleven volumes as held at this post. A party will call for them, and while it waits it will read the reader column. Neither the volumes nor the readers are in four ranges."
   },
   {
    "register": "ledger",
    "text": "In the margin, in pencil: Warn him. Heavy dispatch, 90 drachms. Twenty-two months at best and six years at worst.\n\nRuled through once, in ink, and left legible. Under it in the same pencil, copied out and finished: Warn him. Whatever I send arrives after."
   },
   {
    "register": "ledger",
    "text": "CARBON. FORM 12. CORRECTION OF RECORD. RETAINED UNDER STANDING ORDER NINE.\n\nHOLDING: XI.407 / ii / dry / , eleven volumes, Post 11-40.\n\nCORRECTION: to the conditions of call, add: not to be called for except in the presence of the entering officer.\n\nENTERED: I. Varn, Keeper, 11-40. Dispatched this day, 40 drachms, inside the allowance, at no charge against ration.\n\nRECEIVED, UNASSIGNED MATTER, NINTH INTERIOR: stamped. Interval, 1,506 walking days."
   },
   {
    "register": "frame",
    "text": "The carbon is pinned to the facing leaf, not pasted. [[The column of readers a party would also have to be shown->daybook_invented]] is a month back in this book. [[What she had already told him about this address->threshold]] is in the carbons. [[The letter in which he tells her what he entered here, and where, and which outran her->holding_location]] is on the table. [[The last page she ruled is not far from this one->daybook_last]]."
   }
  ],
  "returnLine": "You leave the pin where it is and close the book on both leaves.",
  "lightClauses": [],
  "variants": []
 },
 "daybook_last": {
  "title": "The Last Entry",
  "kind": "daybook",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "ledger",
    "text": "DAYBOOK. POST 11-40. DAY 29.\n\nWeather: fog to the eighth hour.\n\nLamp hours, rationed: sixteen.\n\nReaders: four.\n\nMail in: one.\n\nMail out: one."
   },
   {
    "register": "ledger",
    "text": "The survey party comes tomorrow. The ranges are in order, the columns are in order, and the oil is short but entered short, which counts as order. I took the shelf label for the holding down this morning and put it up again. There is one thing I ought to set out plainly before they are in the room, and it is that in fourteen years I have never once"
   },
   {
    "register": "frame",
    "text": "Four lines of ordinary prose at the bottom of a ruled form."
   },
   {
    "register": "gap",
    "text": ""
   },
   {
    "register": "frame",
    "text": "The hand changes."
   },
   {
    "register": "ledger",
    "text": "POST 11-40. ATTENDED FROM 11-39 THIS DATE. POST FOUND UNATTENDED. NO KEEPER PRESENT. INVENTORY TAKEN: FOUR RANGES, LAMP, SCALE, SORTING TABLE, DAYBOOK CONTINUED FROM THIS PAGE. MAIL HELD. ENTERED, KEEPER, 11-39, FIRST DAY OF THE FOLLOWING RULING."
   },
   {
    "register": "ledger",
    "text": "FORM 41. RULING ON QUERY 4-6631.\n\nThe holding XI.407 / ii / dry / , Post 11-40, carries a condition of call: it is not to be called for except in the presence of the entering officer.\n\nThe Division of Unassigned Matter, Ninth Interior, is unable to produce the entering officer or any successor holding his file.\n\nIn the absence of an entering officer the query cannot be put and is withdrawn.\n\nThe class stands. The holding stands."
   },
   {
    "register": "frame",
    "text": "The ruling is loose between the last leaves, never pasted in, because pasting it in was the business of the keeper of the post. [[What was in the wrapper and never went into this book->the_slip]] is hers as well. [[The page where she worked the two clauses against each other holds the correction she pinned to it->daybook_collision]]. [[One of the letters that came for her afterward is addressed to the post and not to her->to_the_post]]. [[The reader column went on counting after she stopped->ending_standing]]."
   }
  ],
  "returnLine": "You slide the ruling back between the last leaves and close the book.",
  "lightClauses": [],
  "variants": []
 },
 "the_post": {
  "title": "Post Eleven-Forty",
  "kind": "hub",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "filing",
    "text": "[The arrived portion is in writing order, which is not the order the post brought it in. The work took years, and whoever did it left no note about having done it. Not one item in it was ever handed to the keeper it is addressed to. What stands unread at the close of a ruling is entered again and goes back onto the route, so this is the portion that went back on at every turn and outlived its own delivery. It came off the route at the ruling that entered it as having outrun her, and Standing Order Four has held it here ever since, against a reader.]"
   },
   {
    "register": "frame",
    "text": "Post Eleven-Forty. Four ranges, a sorting table, a scale, and one lamp at the range end lit whatever the hour is doing. One thousand one hundred and ninety walks from the Ingress, a figure off a chart nobody checks. The post is unattended, worked from Eleven-Thirty-Nine one day to a ruling period, the ruling period being the calendar month."
   },
   {
    "register": "frame",
    "text": "Standing Order Four. Mail that has outrun its addressee is not destroyed, because destroying mail requires a form and reading it does not. It is read once at the post, aloud, by whoever is standing there, and then filed. Matter not yet read is held at the post against a reader.\n\nYou are whoever is standing there."
   },
   {
    "register": "frame",
    "text": "The bundle lies flat at your left hand, out of its string. Every item carries a wrapper with the same boxes: route, drops, walking days, weight in drachms, and a ruled box marked TIME ELAPSED. [[The wrapper it all came in has something loose in it that is not a letter->the_slip]].\n\n{{WALKING}} Whatever is still on the route stands transcribed in [[the catalogue's fair copy of the whole accession, including what has not come->the_manifest]], and anything leaving here would wait in [[the iron box at the stair head, until it was worth a runner's back->relay_box]]."
   },
   {
    "register": "frame",
    "text": "{{NEWEST}} On the shelf behind you [[the ruled book lies open at a page with a notice pasted square into it->daybook_survey]], still kept, being the Survey's document and not the keeper's.\n\nYou came in [[out of the gallery, where the fog stands to the eighth hour->long_gallery]]. Above the third bay of Range Four the ceiling carries a stain, hard and brown at the rim."
   },
   {
    "register": "frame",
    "text": "[[The order has a second half, which is to file it back into the holding->ending_standing]]."
   }
  ],
  "returnLine": "You square the bundle against the edge of the table and leave it there.",
  "lightClauses": [
   {
    "band": "i",
    "text": "Full lamp on all four ranges, and the scale's needle throws a hairline shadow onto the table."
   },
   {
    "band": "ii",
    "text": "The House has gone to half lamp together for its hour, and this room went with it."
   },
   {
    "band": "iii",
    "text": "The ration is back to working strength: enough for the page, not enough for the range ends."
   },
   {
    "band": "iv",
    "text": "The light has gone amber and stops a range short, which is the allowance for this hour."
   },
   {
    "band": "v",
    "text": "One lamp at the range end, and the table is as much of the room as you have."
   }
  ],
  "variants": [
   {
    "key": "disturbed_ix404",
    "register": "frame",
    "text": "A volume is lying flat on a shelf top in Range Nine, which is not a fault and is not a count either. The shelf-list return for that bay stands open at this post and has not been walked."
   },
   {
    "key": "delivery_already_opened",
    "register": "frame",
    "text": "Today's delivery has been opened and read and is on the table with the rest of it."
   },
   {
    "key": "nothing_came_today",
    "register": "frame",
    "text": "Nothing came today. The route is under no obligation to bring something to every date, and mostly does not."
   },
   {
    "key": "fourth_visit_day",
    "register": "frame",
    "text": "The chair is where you left it, turned a little out from the table."
   },
   {
    "key": "later_month_ruling",
    "register": "frame",
    "text": "The post has begun its next ruling. What stood outstanding at the close of the last one was entered again and went back onto the route."
   },
   {
    "key": "later_month_filing_sentence",
    "register": "filing",
    "text": "[Anything still outstanding has been entered again on the new ruling. The note does not say how many rulings that makes.]"
   },
   {
    "key": "still_walking_one",
    "register": "frame",
    "text": "One of them is still walking."
   },
   {
    "key": "still_walking_none",
    "register": "frame",
    "text": "Nothing of it is still walking. The route has handed over the whole of the accession and holds nothing outstanding against this post."
   },
   {
    "key": "newest_arrival_label_paid_by_weight",
    "register": "frame",
    "text": "The newest of them explains why he writes at such length and asks you to read it as haste"
   },
   {
    "key": "newest_arrival_label_dear_keeper",
    "register": "frame",
    "text": "The newest of them is the first thing he ever sent her, and it is a query about a shelf-list"
   },
   {
    "key": "newest_arrival_label_the_fourth_consolidation",
    "register": "frame",
    "text": "The newest of them is his account of the new scheme, written by a man enjoying the work"
   },
   {
    "key": "newest_arrival_label_somewhere_safe",
    "register": "frame",
    "text": "The newest of them says where he has been putting the books he cannot bear to lose"
   },
   {
    "key": "newest_arrival_label_holding_location",
    "register": "frame",
    "text": "The newest of them enters eleven volumes as held at this post and says so at the top"
   },
   {
    "key": "newest_arrival_label_bad_season",
    "register": "frame",
    "text": "The newest of them asks about the roof over Range Four and asks for nothing else"
   },
   {
    "key": "newest_arrival_label_the_channel",
    "register": "frame",
    "text": "The newest of them answers her sum, item by item, and says no to the whole of it"
   },
   {
    "key": "newest_arrival_label_to_the_post",
    "register": "frame",
    "text": "The newest of them is addressed to the post and not to the woman who kept it"
   },
   {
    "key": "newest_arrival_label_one_line",
    "register": "frame",
    "text": "The newest of them weighs two drachms and has been walking the whole time"
   }
  ]
 },
 "long_gallery": {
  "title": "The Long Gallery",
  "kind": "room",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "frame",
    "text": "The gallery runs four hundred metres from this door to the end wall, shelving both sides, and at about half that the two runs close to a point. It is a measurement and not an effect. Somebody walked it with a chain and wrote it down."
   },
   {
    "register": "frame",
    "text": "[[What stands in here until the eighth hour, and the one light that will show it->fog_hour]] is entered on the return as a weather field. So is the draw, the wind that falls down the north stairwells all year and crosses this floor at ankle height."
   },
   {
    "register": "frame",
    "text": "Range Nine, third bay: a quarto with a cracked hinge, numbered IX.404 / iv / dry / , the third field open and a space after it. [[You can take it down->disturb_hinge]]. Nobody here reshelves. The shelf-list for these gallery ranges is returned from the post you came out of, so a discrepancy out here is a query for the keeper inside."
   },
   {
    "register": "frame",
    "text": "[[The range at the back is still shelved the old way, three fields to a number->the_thresh]]. [[At this hour the gallery is only what you can hear of it->lamps_down]]. Anything going out of this post stands on its edge in [[the iron box at the stair head, until it is worth carrying->relay_box]]."
   }
  ],
  "returnLine": "You come in off the gallery and square the bundle where you left it.",
  "lightClauses": [
   {
    "band": "i",
    "text": "Full lamp the length of it, and the point where the shelving closes is a bay further off."
   },
   {
    "band": "ii",
    "text": "Half lamp for the hour, and the far end of the gallery has simply been taken away."
   },
   {
    "band": "iii",
    "text": "The ration is back down: a spine at arm's length reads, a shelf end does not."
   },
   {
    "band": "iv",
    "text": "The lamps are on the evening allowance and the gallery ends about forty metres out."
   },
   {
    "band": "v",
    "text": "No lamp from here to the end wall, and the distance is a matter of record rather than of sight."
   }
  ],
  "variants": [
   {
    "key": "disturbed_ix404_open",
    "register": "frame",
    "text": "IX.404 / iv / dry / is lying flat on the shelf top in the third bay of Range Nine, where you left it, open a little at the cracked hinge."
   },
   {
    "key": "fourth_visit",
    "register": "frame",
    "text": "Somebody has straightened the run in the third bay since you were last down here. There is no entry anywhere for having done it."
   }
  ]
 },
 "relay_box": {
  "title": "The Relay Box",
  "kind": "room",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "frame",
    "text": "The box is iron, bolted through the wall at the stair head. The lid hinge is worn bright. The chute on the outward side is dull, and has been dull as long as the paint has been on it, because nothing has ever left here at a speed worth entering."
   },
   {
    "register": "frame",
    "text": "Inside, thin items standing on their edges the way thin items do. A two drachm note. A half sheet folded twice. The frankings run back years, and some of the addresses are in hands that have stopped.\n\n[[Why a heavy letter overtakes a thin one, and why a thin one stands here for years->paid_by_weight]] lies in the bundle on the table. After this box comes [[a chain of runners, counted in pairs of hands between here and the Ninth Interior->hands_that_carried]]."
   },
   {
    "register": "frame",
    "text": "A chit hangs on a nail beside the lid. Six sets of initials on it, all of them P, in six different hands.\n\n[[The box is emptied at the reconciling, by whoever is carrying the run->runners_docket]]. [[The catalogue's claim about what is on its way here->the_manifest]] is a transcription and not a delivery."
   }
  ],
  "returnLine": "You lower the lid onto its hinge and take up the bundle again.",
  "lightClauses": [
   {
    "band": "i",
    "text": "Full lamp at the stair head, and a franking can be read without lifting it out."
   },
   {
    "band": "ii",
    "text": "The half lamp hour has reached the stair head; the box is a shape and the frankings are not."
   },
   {
    "band": "iii",
    "text": "The ration is back to working strength and the box throws its own shadow down the stair."
   },
   {
    "band": "iv",
    "text": "The evening allowance reaches the stair head about as far as the lid and no further."
   },
   {
    "band": "v",
    "text": "One lamp behind you at the range end, and the inside of the box is entirely by touch."
   }
  ],
  "variants": [
   {
    "key": "disturbed_ix404_chalk",
    "register": "frame",
    "text": "There is a chalk mark on the end of the box, dated, initialled P: one item out of place, Range Nine."
   }
  ]
 },
 "the_thresh": {
  "title": "Still Shelved the Old Way",
  "kind": "room",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "frame",
    "text": "The Consolidation stopped three ranges short of the back wall. The spines still carry their Thresh numbers, painted small at the foot: IV.212 / i / dry / , and next along IV.86 / v / draw / . Range and shelf; an hour band in lower case roman, out of the five the stamp is counting in; a word for the weather indoors; then a solidus, a space, and nothing. A number whose third field cannot be read is called open, and half the building is shelved open, worked by inference and precedent, and nobody discusses it."
   },
   {
    "register": "frame",
    "text": "The fields do not say what a book is about. They say under what condition it may legitimately be read. One of these two is lawful in the band now printed at the head of the page; the other is not."
   },
   {
    "register": "frame",
    "text": "One lamp is lit at the range end, and it can be [[trimmed to half by hand, the way she records doing it once and enters no reason->trim_lamp]], an irregularity and not an offence. [[At noon the whole House goes to half lamp together, for its hour->the_noon_drop]]."
   },
   {
    "register": "frame",
    "text": "[[The letter setting out what the new scheme measures instead->the_fourth_consolidation]] is on the table, with [[the one admitting a class with no books in it that nobody can call for->somewhere_safe]]. On a form filled in here, [[class is a line you write a number on, and the number is a condition->the_slip]]. [[What cannot be placed goes down the north stair->hold_door]]."
   }
  ],
  "returnLine": "You push the one that stands proud back level with the run, and walk back to the table.",
  "lightClauses": [
   {
    "band": "i",
    "text": "The lamps are at full on their brackets and every number on the run is as plain as paint; IV.212 / i / dry / is inside its own hour and IV.86 is nowhere near its own."
   },
   {
    "band": "ii",
    "text": "The light has gone low and flat and a shade cooler than it was, and something faintly brown is standing up in the numbers that was not there an hour ago. IV.140 / ii / dry / is lawful for the rest of this hour, and IV.212 is not."
   },
   {
    "band": "iii",
    "text": "The lamps have been pulled back a notch by the schedule and the small paint at the foot of the spines has lost its edges; IV.301 / iii / dry / is inside its hour now, and IV.86 wants two more bands than the page has."
   },
   {
    "band": "iv",
    "text": "One measured lamp is burning at the range end, amber for the first arm's length of shelving and dark after it. IV.55 / iv / draw / is lawful while this lasts, and IV.212 had its hour and has lost it."
   },
   {
    "band": "v",
    "text": "The room is dark to the ceiling and the range end lamp is the whole of the light, so you read the small paint by holding your head at an angle to it. IV.86 / v / draw / has been lawful since the twenty-second hour, and IV.212 will not be lawful again until the sixth."
   }
  ],
  "variants": [
   {
    "key": "trim_lamp_ledger",
    "register": "ledger",
    "text": "Item: trimmed the range lamp to half for a quarter hour to read a third field. Irregular. I have not entered the reason."
   },
   {
    "key": "trim_lamp_frame",
    "register": "frame",
    "text": "You put the lamp back to full. The numbers stay closed, because you have seen them now and a spine cannot be unread."
   },
   {
    "key": "saw_third_field_paragraph_route_drop",
    "register": "frame",
    "text": "The fields do not say what a book is about. They say under what condition it may legitimately be read, and you can read them now: IV.212 / i / dry / aloud, and next along IV.86 / v / draw / in company. Down the run, standing, alone, not before. Five words, one to a spine, each of them a thing a person is either doing or not doing in a room. You read them at noon, in the hour the schedule still drops, which is the hour the House set aside for it and then filled with the meal. None of it is difficult. All of it is a matter of when you happen to be standing here."
   },
   {
    "key": "saw_third_field_paragraph_route_lamp",
    "register": "frame",
    "text": "The fields do not say what a book is about. They say under what condition it may legitimately be read, and you can read them now: IV.212 / i / dry / aloud, and next along IV.86 / v / draw / in company. Down the run, standing, alone, not before. Five words, one to a spine, each of them a thing a person is either doing or not doing in a room. You read them by a lamp you trimmed yourself, at whatever hour it is, which is what she did, and she did not enter the reason either. None of it is difficult. All of it is a matter of when you happen to be standing here."
   }
  ]
 },
 "the_manifest": {
  "title": "What the Catalogue Says Is Coming",
  "kind": "room",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "frame",
    "text": "The transcription volume stands at the end of the sorting table, bound in boards, and it falls open at the current place because that is where it has been opened. It holds a fair copy of every item in this accession, made at the far end off the dispatch returns, including the items the post has not brought. A transcription is a promise about an object you do not have."
   },
   {
    "register": "frame",
    "text": "What it can give you is the words. It cannot give you the wrapper, or the hand, or the weight in drachms, or the folds, or the column of daybook standing beside it on the day it came. [[The rest of it is standing on its edge in an iron box at the stair head->relay_box]], and will be for some time yet."
   },
   {
    "register": "frame",
    "text": "You may turn one page ahead, and the volume records that you have. It is bound in order, so ahead means the next one and not the one after it, and you go forward a page at a time and never jump. [[The next page holds the transcription of whatever the post has not brought yet->cold_target]]."
   },
   {
    "register": "frame",
    "text": "[[The slip in the wrapper was never lodged with any of this->the_slip]]. [[You could carry it to the catalogue yourself and lodge it->ending_deposit]]."
   }
  ],
  "returnLine": "You let the volume fall shut on its own weight and square it to the shelf edge.",
  "lightClauses": [
   {
    "band": "i",
    "text": "The light is full on the boards and the fair copy is as plain as it is ever going to be, which is plainer than the letters it is copied from."
   },
   {
    "band": "ii",
    "text": "For this one hour the light goes low and cool across the page, and the fair copy greys without getting any harder to read, because a clerk ruled it for exactly this."
   },
   {
    "band": "iii",
    "text": "The lamps have come back a notch off the full and the hairlines in the copperplate thin out where the clerk lifted his pen."
   },
   {
    "band": "iv",
    "text": "One measured lamp burns above the shelf and puts an amber edge on the boards, and the outer columns of the page go warm and a little indistinct."
   },
   {
    "band": "v",
    "text": "There is no light on the shelf now except the one at the range end, and the fair copy comes up a line at a time under it, in the order it was bound."
   }
  ],
  "variants": [
   {
    "key": "readcold_nonempty",
    "register": "frame",
    "text": "The volume falls open at the place you opened it. The catalogue now records that somebody read ahead of the post, which is the only kind of thing a catalogue can record about a person."
   }
  ]
 },
 "hold_door": {
  "title": "The Door at the Bottom of the North Stair",
  "kind": "room",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "frame",
    "text": "Behind this door is floor, and it has to be swept round. The Hold is not a furnace. Nothing here is burned, which is the worse arrangement: deaccessioned matter is carried down, set on the floor in runs, and goes on existing. In this building uncatalogued and not existing are one condition. The difference is floor."
   },
   {
    "register": "frame",
    "text": "The north stair goes down ninety-odd treads, getting colder all the way, and the cold comes up through the gap under the door at the bottom. It is the wind the stamp at the head of this page calls draw."
   },
   {
    "register": "frame",
    "text": "You can put your hand flat on the door. The iron is colder than the air. You do not open it."
   },
   {
    "register": "frame",
    "text": "[[The letter from the man whose four books come down here if the query is upheld->bad_season]] is on the table upstairs. [[What it would cost to go the other way, costed to the boot and the knee by a woman of fifty-one->arithmetic_of_walking]]. [[What this stair sounds like with the lamps out->lamps_down]]. At the head of the stair is the gallery, [[four hundred metres of it you measured on the way in->long_gallery]]."
   }
  ],
  "returnLine": "You take your hand off the door and carry the cold of it back up to the table.",
  "lightClauses": [
   {
    "band": "i",
    "text": "There is a lamp at the stair head, full on its bracket, and it reaches four treads and then stops, which is its whole contribution."
   },
   {
    "band": "ii",
    "text": "The stair lamp has gone low and cool with every other lamp in the House, and the door at the bottom is a shape rather than a door."
   },
   {
    "band": "iii",
    "text": "The light off the stair head is a notch short of what it was, and the gap under the door reads as a grey line and nothing else."
   },
   {
    "band": "iv",
    "text": "One measured lamp at the head of the stair puts an amber edge on the top treads and gives up a long way above the bottom."
   },
   {
    "band": "v",
    "text": "There is no light on this stair at all, and the door is simply where the cold is coming from, which is the whole of how you find it."
   }
  ],
  "variants": []
 },
 "fog_hour": {
  "title": "Fog to the Eighth Hour",
  "kind": "fragment",
  "day": 0,
  "wrapper": "",
  "blocks": [
   {
    "register": "frame",
    "text": "The sixth hour, and the gallery ends at twenty metres. Not in haze: it ends. Shelving, standard, shelving, then fog with nothing behind it. The spines in Range Nine have taken water and the gutters are dark.\n\nA half sheet lies on the shelf top, the colour of the shelf. Under a lamp it is blank. A lamp comes off one point and warms the paper past the ink; this light is weak and comes from everywhere, and the brown stands out of the brown."
   },
