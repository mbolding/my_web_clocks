const ROMAN = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],
               [40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
function roman(n) {
    let out = '';
    for (const [v, s] of ROMAN) while (n >= v) { out += s; n -= v; }
    return out;
}

/* --- storage. The post keeps a record; a reader who blocks it is simply
       one the post has no record of, and nothing says so. ------------- */

function blank() {
    return {
        v: 2, firstVisit: null, visitDays: [], bandsSeen: [], warmOpens: {}, coldOpens: {},
        wearDays: {}, order: [], readCold: [], disturbed: [], sawThirdField: false,
        thirdFieldRoute: '', endings: [], struckShown: false, dropIns: { date: null, served: [] }
    };
}

let S = blank();
let storageWorks = true;

function load() {
    try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return blank();
        const s = JSON.parse(raw);
        const b = blank();
        for (const k of Object.keys(b)) if (s[k] !== undefined) b[k] = s[k];
        if (!b.dropIns || typeof b.dropIns !== 'object') b.dropIns = { date: null, served: [] };
        if (!Array.isArray(b.dropIns.served)) b.dropIns.served = [];
        return b;
    } catch (e) { storageWorks = false; return blank(); }
}

function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { storageWorks = false; }
}

/* --- the present moment ------------------------------------------- */

function iso(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
}

function daysInMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }

function bandFor(mins) {
    for (const b of BANDS) {
        if (b.from <= b.to) { if (mins >= b.from && mins <= b.to) return b; }
        else if (mins >= b.from || mins <= b.to) return b;
    }
    return BANDS[4];
}

/* Fog stands in the Long Gallery to the eighth hour. The cold falls down the
   north stairwells at night. The cold season is Condition Three. */
function weatherFor(mins, month) {
    if (mins >= 300 && mins <= 479) return 'fog';
    if (mins >= 1320 || mins <= 299) return 'draw';
    if (month === 10 || month === 11 || month === 0 || month === 1) return 'damp';
    return 'dry';
}

function now() {
    const d = new Date();
    const mins = d.getHours() * 60 + d.getMinutes();
    const dim = daysInMonth(d);
    return {
        d, date: d.getDate(), dim, mins, hour: d.getHours(),
        isLastDay: d.getDate() === dim,
        band: bandFor(mins), weather: weatherFor(mins, d.getMonth()), iso: iso(d)
    };
}

/* --- what the post has managed to hand over ------------------------ */

function arrivalDay(id, T) {
    const a = ARRIVAL[id];
    if (a === undefined) return null;
    return a === 0 ? T.dim : Math.min(a, T.dim);   /* short month clause */
}

function onTable(id, T) {
    if (ARRIVAL[id] === undefined) return true;          /* not an arriving item */
    if ((S.warmOpens[id] || 0) > 0) return true;         /* read at the post, and filed */
    return T.date >= arrivalDay(id, T);
}

function hasRead(id) {
    return (S.warmOpens[id] || 0) > 0 || S.readCold.indexOf(id) !== -1;
}

function countSpineRead() {
    return SPINE.filter(hasRead).length;
}

function tally(T) { return SPINE.filter(id => onTable(id, T)).length; }

/* The first item the route has not handed over and the reader has not
   already turned to in the volume. */
function coldTarget(T) {
    for (const id of SPINE) {
        if (!onTable(id, T) && S.readCold.indexOf(id) === -1) return id;
    }
    return null;
}

/* --- gates. Every shut door in the piece resolves through here, so a
       condition is stated in exactly one place. ---------------------- */

function gate(id, T) {
    const P = PASSAGES[id];
    if (!P) return { open: false, line: '' };

    /* An arriving item. Open warm when it is on the table; open cold when the
       volume is what brought you. Already turned to in the volume counts as
       read, so the post never tells a reader that something is still walking
       when they have its transcription in front of them. */
    if (ARRIVAL[id] !== undefined) {
        if (onTable(id, T)) return { open: true, line: '', cold: false };
        if (S.readCold.indexOf(id) !== -1) return { open: true, line: '', cold: true };
        if (id === coldTarget(T)) return { open: true, line: '', cold: true };
        return { open: false, line: LOCK.walking };
    }

    switch (id) {
        case 'the_noon_drop':
            return T.hour === 12 ? { open: true, line: '' } : { open: false, line: LOCK.drop };
        case 'fog_hour':
            return (T.mins >= 360 && T.mins <= 479) ? { open: true, line: '' }
                                                    : { open: false, line: LOCK.fog };
        case 'lamps_down':
            return (T.mins >= 1320 || T.mins <= 359) ? { open: true, line: '' }
                                                     : { open: false, line: LOCK.lampsdown };
        case 'runners_docket':
            return T.isLastDay ? { open: true, line: '' } : { open: false, line: LOCK.reconcile };
        case 'the_regular': {
            if (!S.firstVisit) return { open: false, line: LOCK.regular };
            const f = S.firstVisit.slice(0, 7), t = T.iso.slice(0, 7);
            return f !== t ? { open: true, line: '' } : { open: false, line: LOCK.regular };
        }
        case 'daybook_last':
            return (countSpineRead() >= 4 || hasRead('to_the_post'))
                ? { open: true, line: '' } : { open: false, line: LOCK.backbook };
        case 'ending_standing':
            return (countSpineRead() >= 8 && (hasRead('to_the_post') || hasRead('daybook_last')))
                ? { open: true, line: '' } : { open: false, line: LOCK.standing };
        case 'ending_walk':
            return (hasRead('arithmetic_of_walking') && hasRead('the_channel') && hasRead('threshold'))
                ? { open: true, line: '' } : { open: false, line: LOCK.walk };
        case 'ending_deposit':
            return (hasRead('the_thresh') && hasRead('somewhere_safe') && hasRead('holding_location') &&
                    hasRead('the_slip') && (hasRead('daybook_invented') || hasRead('daybook_collision')))
                ? { open: true, line: '' } : { open: false, line: LOCK.deposit };
        default:
            return { open: true, line: '' };
    }
}

/* --- rendering ------------------------------------------------------ */

/* --- tokens: the few places the prose has to count something -------- */

let dropNote = '';          /* set by the drop-in rule, read by two hub clauses */

const WORDS = ['none', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                'August', 'September', 'October', 'November', 'December'];

function hubVariant(P, key) {
    const v = variant(P, key);
    return v ? v.text : '';
}

/* The newest thing the post has brought, and the sentence that opens it. */
function newestClause(T) {
    let newest = null;
    for (const id of SPINE) if (onTable(id, T)) newest = id;
    if (!newest) return '';
    const P = PASSAGES.the_post;
    const label = newest === 'deep_stacks'
        ? 'The newest of them is an answer about what the deep stacks smell of'
        : hubVariant(P, 'newest_arrival_label_' + newest);
    if (!label) return '';
    return '[[' + label + '->' + newest + ']].';
}

function walkingClause(T) {
    const n = 10 - tally(T);
    const P = PASSAGES.the_post;
    if (n === 0) return hubVariant(P, 'still_walking_none');
    if (n === 1) return hubVariant(P, 'still_walking_one');
    return WORDS[n] + ' of them are still walking.';
}

/* How long the reader declined to wait, in the post's own arithmetic. */
function daysSaved(T) {
    let most = 1;
    for (const id of S.readCold) {
        const due = arrivalDay(id, T);
        if (due !== null) most = Math.max(most, due - T.date);
    }
    return most;
}

/* ending_deposit recites the reader's path back as a delivery order,
   because from the post's point of view that is what it is. */
function deliveryLines() {
    const lines = [];
    let n = 0;
    for (const id of S.order) {
        if (!PASSAGES[id] || PASSAGES[id].kind === 'ending') continue;
        n++;
        lines.push(String(n).padStart(2, '0') + '.  ' + PASSAGES[id].title.toUpperCase());
    }
    return lines.join('\n');
}

function subst(text, T) {
    return text
        .replace(/\{\{NEWEST\}\}/g, () => newestClause(T))
        .replace(/\{\{WALKING\}\}/g, () => walkingClause(T))
        .replace(/\{\{DAYS_SAVED\}\}/g, () => String(daysSaved(T)))
        .replace(/\{\{DELIVERY_LINES\}\}/g, () => deliveryLines())
        .replace(/\{\{TODAY\}\}/g, () => T.date + ' ' + MONTHS[T.d.getMonth()] + ' ' + T.d.getFullYear())
        .replace(/\{visitDays\}/g, () => String(visitCount()));
}

const LEXIA = /\[\[([^\]]+?)->([a-z0-9_]+)\]\]/g;

function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

let shutSeq = 0;
let currentId = null;

/* A lexia is pressure in the page, never a hyperlink. A shut one is visible,
   unlit, and says what it is waiting for, out loud for a screen reader too.

   The prose is escaped around the markup rather than through it, because
   escaping first would turn every -> into an entity and no link would match. */
function lexiaHTML(anchor, target, T) {
    const text = esc(anchor);

    if (target === 'disturb_hinge') {
        /* The one thing a reader can physically do to this building. */
        if (disturbed()) return text;
        return `<span class="lexia act" role="button" tabindex="0" data-act="disturb">${text}</span>`;
    }

    if (target === 'trim_lamp') {
        /* The second route to a third field. It does not navigate: she
           records trimming the range lamp and enters no reason. */
        if (S.sawThirdField) return text;
        return `<span class="lexia trim" role="button" tabindex="0" data-trim="1">${text}</span>`;
    }

    if (target === 'cold_target') {
        const t = coldTarget(T);
        if (!t) return shutHTML(text, LOCK.bound);
        target = t;
    }

    if (!PASSAGES[target]) return text;

    const g = gate(target, T);
    if (!g.open) return shutHTML(text, g.line);

    const been = hasRead(target) ? ' been' : '';
    return `<a class="lexia${been}" data-to="${target}" role="link" tabindex="0">${text}</a>`;
}

function shutHTML(text, line) {
    const id = 'shut' + (++shutSeq);
    return `<span class="shut" role="button" tabindex="0" aria-disabled="true" ` +
           `aria-describedby="${id}" data-shut="${id}" data-line="${esc(line)}">${text}</span>`;
}

function markup(text, T) {
    let out = '', last = 0, m;
    LEXIA.lastIndex = 0;
    while ((m = LEXIA.exec(text)) !== null) {
        out += esc(text.slice(last, m.index));
        out += lexiaHTML(m[1], m[2], T);
        last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
}

function paragraphs(text, T, br) {
    return subst(text, T).trim().split(/\n\s*\n/).map(p => {
        const t = p.trim();
        if (!t) return '';
        return '<p>' + markup(t, T).replace(/\n/g, br ? '<br>' : ' ') + '</p>';
    }).join('\n');
}

function renderBlocks(blocks, T) {
    let html = '';
    for (const b of blocks) {
        if (b.register === 'gap') { html += '<hr class="gap">'; continue; }
        const body = paragraphs(b.text, T, b.register === 'ledger');
        if (b.register === 'letter')      html += `<div class="letter">${body}</div>`;
        else if (b.register === 'ledger') html += `<div class="ledger">${body}</div>`;
        else if (b.register === 'filing') html += `<div class="filing">${body}</div>`;
        else                              html += body;
    }
    return html;
}

/* --- the stamp: clock face and document header in one object -------- */

function stamp(T) {
    const hh = String(T.d.getHours()).padStart(2, '0');
    const mm = String(T.d.getMinutes()).padStart(2, '0');
    const n = tally(T);
    return `<span class="fold">POST 11-40<span class="sep">/</span>DAY ${roman(T.date)}</span>` +
           `<span class="sep">/</span><span class="fold">${T.band.n} ${T.band.name} ${T.weather}` +
           `<span class="sep">/</span><span class="clock">${hh}:${mm}</span>` +
           `<span class="sep">/</span>${n} of 10 on the table</span>`;
}

/* --- the wrapper, which is where the paper gives way ---------------- */

function wrapperFor(id, T) {
    const P = PASSAGES[id];
    if (!P || !P.wrapper) return '';
    const days = (S.wearDays[id] || []).length;
    /* Three stamps, at one date, two dates and four. An object that cannot
       part at a crease, a scrap or an unfolded sheet, carries its own line. */
    const key = days >= 4 ? 'wear_4_or_more_days' : days >= 2 ? 'wear_2_days' : 'wear_1_day';
    const own = variant(P, key);
    let read;
    if (own) read = own.text;
    else if (days >= 4) read = 'Read at the post. The folds are going soft and the third sheet has parted at the crease.';
    else if (days >= 2) read = 'Read at the post, second time.';
    else                read = 'Delivered. Read at the post.';

    /* The irony lands once. On every wrapper after the first the box is
       simply empty, and the empty box does the rest of the work for free. */
    let elapsed;
    if (!S.struckShown) { elapsed = '<span class="struck">TIME ELAPSED</span>'; S.struckShown = true; }
    else { elapsed = 'TIME ELAPSED'; }

    return `<div class="wrapper">${esc(P.wrapper)}<span class="sep"> | </span>${elapsed}<br>${esc(read)}</div>`;
}

/* --- opening a passage ---------------------------------------------- */

function variant(P, key) {
    if (!P.variants) return null;
    for (const v of P.variants) if (v.key === key) return v;
    return null;
}

function open(id, T, silent) {
    const P = PASSAGES[id];
    if (!P) return;
    T = T || now();

    currentId = id;
    const isArriving = ARRIVAL[id] !== undefined;
    const cold = isArriving && !onTable(id, T);

    /* The count is incremented before the prose renders, so a gate on this
       page is evaluated against a reader who is standing here. */
    if (silent) {
        /* A re-render of the room you are already standing in. */
    } else if (cold) {
        S.coldOpens[id] = (S.coldOpens[id] || 0) + 1;
        if (S.readCold.indexOf(id) === -1) S.readCold.push(id);
    } else {
        S.warmOpens[id] = (S.warmOpens[id] || 0) + 1;
        if (isArriving) {
            const w = S.wearDays[id] || (S.wearDays[id] = []);
            if (w.indexOf(T.iso) === -1) w.push(T.iso);
        }
    }
    if (id === 'the_noon_drop' && !S.sawThirdField) {
        S.sawThirdField = true;
        S.thirdFieldRoute = 'drop';
    }
    if (S.order.indexOf(id) === -1) S.order.push(id);
    if (PASSAGES[id].kind === 'ending' && S.endings.indexOf(id) === -1) S.endings.push(id);
    save();

    const el = document.getElementById('passage');
    let html = '';

    if (PASSAGES[id].kind === 'ending' && (S.warmOpens[id] || 0) > 1) {
        const seen = variant(P, 'ending_reread_filing_line') || variant(P, 'already_seen');
        if (seen) html += `<div class="filing">${paragraphs(seen.text, T)}</div>`;
    }

    html += `<h1 class="passage-title">${esc(P.title)}</h1>`;

    if (cold) {
        /* The transcription only: no wrapper, no hand, no weight, no folds. */
        const body = P.blocks.filter(b => b.register === 'letter' || b.register === 'ledger');
        const src = body.length ? body : P.blocks.filter(b => b.register !== 'gap');
        html += `<div class="ledger cold">` +
                src.map(b => paragraphs(b.text.replace(LEXIA, '$1'), T)).join('') + `</div>`;
        html += coldExits(T);
    } else {
        html += wrapperFor(id, T);
        html += renderBlocks(applyVariants(P, T), T);
    }

    html += `<div class="shut-slot" aria-live="polite"></div>`;
    html += `<div class="return"><a data-to="the_post">${esc(P.returnLine || 'You set it down on the table.')}</a></div>`;
    if (id === 'the_post') html += resetLine();

    el.innerHTML = html;
    el.scrollTop = 0;
    window.scrollTo(0, 0);
    document.title = P.title + ' | The Slow Post';
    wire(el, T);
}

/* Every cold transcription has the same three exits, and the first of them
   advances the chain by exactly one item. */
function coldExits(T) {
    const next = coldTarget(T);
    const label = next && PASSAGES[next] ? COLD_LABELS[next] : null;
    let html = '<p class="cold-exits">';
    if (next && label) {
        html += `<a class="lexia" data-to="${next}" role="link" tabindex="0">${esc(label)}</a>. `;
    } else {
        html += `<span class="shut" role="button" tabindex="0" aria-disabled="true"
            data-line="${esc(LOCK.bound)}">the next page of the volume</span>. `;
    }
    html += `<a class="lexia" data-to="the_manifest" role="link" tabindex="0">The volume it is bound in</a>, ` +
            `and <a class="lexia" data-to="relay_box" role="link" tabindex="0">where the original is standing</a>.`;
    return html + '</p>';
}

/* --- variants: the six ways the post notices you -------------------- */

/* Each rule says when a piece of variant text belongs on the page. Keys are
   matched by prefix, so a drafter can suffix a key without breaking this. */
const VARIANT_RULES = {
    reader_column_tier1: () => visitCount() < 3,
    reader_column_tier2: () => visitCount() >= 3 && visitCount() < 8,
    reader_column_tier3: () => visitCount() >= 8,

    disturbed_IX404:       () => disturbed(),
    disturbed_ix404:       () => disturbed(),
    disturbed_ix404_chalk: () => disturbed(),
    disturbed_ix404_open:  () => disturbed(),

    remarks_saw_third_field:              () => S.sawThirdField,
    remarks_saw_third_field_frame:        () => S.sawThirdField,
    saw_third_field_paragraph_route_drop: () => S.sawThirdField && S.thirdFieldRoute === 'drop',
    saw_third_field_paragraph_route_lamp: () => S.sawThirdField && S.thirdFieldRoute === 'lamp',
    coda_saw_third_field_drop:            () => S.sawThirdField && S.thirdFieldRoute === 'drop',
    coda_saw_third_field_lamp:            () => S.sawThirdField && S.thirdFieldRoute === 'lamp',

    cold_chain_coda:  () => S.readCold.length > 0,
    readcold_nonempty:() => S.readCold.length > 0,
    bands_seen_v:     () => S.bandsSeen.indexOf('v') !== -1,

    fourth_visit:     () => visitCount() >= 4,
    fourth_visit_day: () => visitCount() >= 4,

    later_month_ruling: (T) => laterMonth(T),

    second_entry_paid_by_weight_read: () => hasRead('paid_by_weight'),

    reconciling_month_28: (T) => T.dim === 28,
    reconciling_month_29: (T) => T.dim === 29,
    reconciling_month_30: (T) => T.dim === 30,
    reconciling_month_31: (T) => T.dim === 31,

    /* Served by the drop-in rule, and only on the load it dropped you into. */
    delivery_already_opened: (T) => dropNote === 'opened',
    nothing_came_today:      (T) => dropNote === 'nothing',

    /* Handled elsewhere: tokens, in-place actions, and the wrapper. */
    later_month_filing_sentence: () => false,
    trim_lamp_frame:             () => false,
    trim_lamp_ledger:            () => false,
    visit_count_token:           () => false,
    ending_reread_filing_line:   () => false,
    already_seen:                () => false
};

function disturbed() { return S.disturbed.indexOf('IX.404') !== -1; }
function laterMonth(T) { return !!S.firstVisit && S.firstVisit.slice(0, 7) !== T.iso.slice(0, 7); }

function visitCount() { return S.visitDays.length; }

function variantAllowed(key, T) {
    if (key.indexOf('newest_arrival_label_') === 0) return false;   /* used by the hub token */
    if (key.indexOf('wear_') === 0 || key.indexOf('wrapper_wear') === 0) return false;
    if (key.indexOf('still_walking_') === 0) return false;          /* used by the hub token */
    if (key.indexOf('order_noticed') !== -1 || key.indexOf('filing_order_noticed') === 0) return false;
    const rule = VARIANT_RULES[key];
    return rule ? !!rule(T) : false;
}

function applyVariants(P, T) {
    const blocks = [];

    /* The hub and the five rooms report the lamp they are standing under. */
    if (P.lightClauses && P.lightClauses.length) {
        const lc = P.lightClauses.filter(l => l.band === T.band.n)[0];
        if (lc) blocks.push({ register: 'frame', text: lc.text });
    }

    for (const b of P.blocks) blocks.push(b);

    /* One further sentence inside the filing hand's square bracket, which is
       the same note in the same place and not a second appearance of it. */
    const lm = variant(P, 'later_month_filing_sentence');
    if (lm && laterMonth(T)) {
        for (const b of blocks) {
            if (b.register === 'filing') {
                const extra = lm.text.replace(/^\[/, '').replace(/\]$/, '');
                blocks[blocks.indexOf(b)] = {
                    register: 'filing',
                    text: b.text.replace(/\]\s*$/, ' ' + extra + ']')
                };
                break;
            }
        }
    }

    if (P.variants) {
        for (const v of P.variants) {
            if (v.key === 'already_seen') continue;
            /* The order noticed pair: whichever of the two was opened second
               gains a note in the filing hand, and only then. */
            if (v.key.indexOf('order_noticed') === 0) {
                const pair = P.id === 'dear_keeper' ? 'hands_that_carried' : 'dear_keeper';
                if (!(hasRead(pair) && S.order.indexOf(pair) < S.order.indexOf(P.id))) continue;
                blocks.push({ register: 'filing', text: v.text });
                continue;
            }
            if (variantAllowed(v.key, T)) blocks.push({ register: v.register || 'frame', text: v.text });
        }
    }
    return blocks;
}

/* --- the only thing in the piece that empties the key --------------- */

function resetLine() {
    return '<div class="reset"><a id="reset-strike" role="button" tabindex="0">Close the post.</a></div>';
}

function resetCost() {
    const days = visitCount();
    const items = SPINE.filter(id => (S.warmOpens[id] || 0) > 0).length;
    const third = S.sawThirdField ? 'the third field stands read' : 'the third field stands unread';
    return `Closing discards ${days} ${days === 1 ? 'day' : 'days'} attended, ` +
           `${items} ${items === 1 ? 'item' : 'items'} read at the post, and ${third}. ` +
           `The post keeps no copy. Strike it again to close it.`;
}

/* --- navigation ------------------------------------------------------ */

function wire(el, T) {
    const slot = el.querySelector('.shut-slot');

    el.querySelectorAll('[data-to]').forEach(a => {
        const go = e => {
            e.preventDefault();
            open(a.dataset.to, now());
        };
        a.addEventListener('click', go);
        a.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') go(e);
        });
    });

    el.querySelectorAll('.shut').forEach(s => {
        const say = () => {
            if (s.dataset.said) return;
            s.dataset.said = '1';
            const line = document.createElement('span');
            line.className = 'shut-line';
            if (s.dataset.shut) line.id = s.dataset.shut;
            line.textContent = s.dataset.line;
            if (slot) slot.appendChild(line); else s.after(line);
        };
        s.addEventListener('click', say);
        s.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); say(); } });
    });

    el.querySelectorAll('[data-act="disturb"]').forEach(a => {
        const act = () => {
            if (disturbed()) return;
            S.disturbed.push('IX.404');
            save();
            /* The room is different now, so you are shown the room. */
            open(currentId, now(), true);
        };
        a.addEventListener('click', act);
        a.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    });

    el.querySelectorAll('[data-trim]').forEach(t => {
        const trim = () => {
            if (S.sawThirdField) return;
            S.sawThirdField = true;
            S.thirdFieldRoute = S.thirdFieldRoute || 'lamp';
            save();
            const P = PASSAGES[currentId];
            const led = variant(P, 'trim_lamp_ledger');
            const fr = variant(P, 'trim_lamp_frame');
            const box = document.createElement('div');
            if (led) box.innerHTML += `<div class="ledger">${paragraphs(led.text, T, true)}</div>`;
            if (fr) box.innerHTML += paragraphs(fr.text, T);
            t.replaceWith(document.createTextNode(t.textContent));
            if (slot) slot.before(box); else el.appendChild(box);
        };
        t.addEventListener('click', trim);
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trim(); } });
    });

    const strike = el.querySelector('#reset-strike');
    if (strike) {
        strike.addEventListener('click', () => {
            if (strike.dataset.armed) {
                try { localStorage.removeItem(KEY); } catch (e) { /* nothing to be done */ }
                location.reload();
                return;
            }
            strike.dataset.armed = '1';
            strike.textContent = resetCost();
            strike.classList.add('armed');
        });
    }

    /* The cracked hinge in Range Nine. Taking it down is the only thing a
       reader can physically do to this building, and nobody reshelves. */
    el.querySelectorAll('[data-disturb]').forEach(d => {
        d.addEventListener('click', () => {
            if (S.disturbed.indexOf(d.dataset.disturb) === -1) S.disturbed.push(d.dataset.disturb);
            save();
        });
    });
}

/* --- the drop-in rule: where a returning reader lands --------------- */

function dropIn(T) {
    /* ZERO. A reader the post has no record of meets the table first. */
    if (!S.firstVisit || !storageWorks) return 'the_post';

    const due = [];
    if (T.isLastDay) due.push('runners_docket');
    for (const id of SPINE) {
        if (arrivalDay(id, T) === T.date && (S.warmOpens[id] || 0) === 0) due.push(id);
    }
    const served = (S.dropIns.date === T.iso) ? S.dropIns.served : [];
    const rest = due.filter(id => served.indexOf(id) === -1);
    if (!rest.length) {
        /* Clause TWO: the frame notes in one clause either that today's
           delivery has already been opened, or that nothing came. */
        const dueToday = SPINE.some(id => arrivalDay(id, T) === T.date);
        dropNote = dueToday ? 'opened' : 'nothing';
        return 'the_post';
    }

    const pick = rest[0];
    S.dropIns = { date: T.iso, served: served.concat([pick]) };
    save();
    return pick;
}

/* --- the tick. The stamp is live and the day rolls without a reload. - */

let lastBand = null, lastDay = null;

function tick() {
    const T = now();
    document.getElementById('stamp').innerHTML = stamp(T);
    if (T.band.n !== lastBand) {
        document.documentElement.setAttribute('data-band', T.band.n);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content',
            getComputedStyle(document.documentElement).getPropertyValue('--surround').trim());
        lastBand = T.band.n;
    }
    /* The day rolls under the reader. The stamp changes; the open passage
       is never withdrawn and never re-rendered. */
    if (T.date !== lastDay) lastDay = T.date;
}

function boot() {
    S = load();
    const T = now();

    if (!S.firstVisit) S.firstVisit = T.iso;
    let vd = S.visitDays.filter(v => v && v.date === T.iso)[0];
    if (!vd) { vd = { date: T.iso, bands: [] }; S.visitDays.push(vd); }
    if (!vd.bands) vd.bands = [];
    if (vd.bands.indexOf(T.band.n) === -1) vd.bands.push(T.band.n);
    if (S.bandsSeen.indexOf(T.band.n) === -1) S.bandsSeen.push(T.band.n);
    save();

    document.documentElement.setAttribute('data-band', T.band.n);
    lastBand = T.band.n; lastDay = T.date;
    tick();
    setInterval(tick, 10000);

    open(dropIn(T), T);
}

document.addEventListener('DOMContentLoaded', boot);
    </script>
