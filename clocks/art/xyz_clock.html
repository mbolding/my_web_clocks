<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ Clock</title>
    <style>
        body { margin: 0; background-color: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: clamp(8px, 2vh, 20px);
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: monospace;
            font-size: clamp(1rem, 3.5vw, 1.75rem);
            letter-spacing: 0.08em;
            pointer-events: none;
        }
        #legend {
            position: absolute;
            bottom: clamp(8px, 2vh, 20px);
            width: 100%;
            text-align: center;
            color: #4a8a4a;
            font-family: monospace;
            font-size: clamp(0.65rem, 2vw, 0.8rem);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info"></div>
    <div id="legend">x = hour &middot; y = minute &middot; z = second &mdash; trailing 12 hours &middot; drag to orbit, scroll to zoom</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let marker, trail;

        const scale = 15;
        const trailLengthSeconds = 12 * 60 * 60;

        // The trail is kept in chronological order rather than as a ring buffer:
        // a THREE.Line draws its vertices in array order, so a wrapped ring buffer
        // would stitch the newest point back to the oldest with a stray segment
        // straight across the cube. Once full we drop the oldest point and append.
        const trailPositions = new Float32Array(trailLengthSeconds * 3);
        const trailColors = new Float32Array(trailLengthSeconds * 3);
        const trailGeometry = new THREE.BufferGeometry();
        let trailCount = 0;
        let lastPlottedSecond = -1;

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function mapRange(value, inMin, inMax, outMin, outMax) {
            return (value - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;
        }

        // Where a given moment sits in the cube. Integer seconds only, so the
        // trail lands on one point per second.
        function plotFor(date) {
            const h = date.getHours();
            const m = date.getMinutes();
            const s = date.getSeconds();
            return {
                x: mapRange(h + m / 60, 0, 24, -scale, scale),
                y: mapRange(m + s / 60, 0, 60, -scale, scale),
                z: mapRange(s, 0, 60, -scale, scale)
            };
        }

        function pushTrailPoint(p) {
            if (trailCount === trailLengthSeconds) {
                // Drop the oldest point, keeping the rest in order. Colours are a
                // function of slot index, not of the point, so they stay put.
                trailPositions.copyWithin(0, 3);
                trailCount--;
            }
            const i = trailCount * 3;
            trailPositions[i] = p.x;
            trailPositions[i + 1] = p.y;
            trailPositions[i + 2] = p.z;
            trailCount++;
        }

        // Fade the trail from dim (oldest) to bright (newest) so the direction of
        // time is readable the moment the page loads. Only needs recomputing while
        // the buffer is still filling; once full, slot i always means the same age.
        function recolourTrail() {
            for (let i = 0; i < trailCount; i++) {
                const age = trailCount > 1 ? i / (trailCount - 1) : 1;
                const intensity = 0.12 + age * 0.88;
                trailColors[i * 3] = 0.1 * intensity;
                trailColors[i * 3 + 1] = intensity;
                trailColors[i * 3 + 2] = 0.25 * intensity;
            }
        }

        // Seed the previous 12 hours. The mapping is a pure function of the clock,
        // so the full pattern can be drawn immediately instead of taking half a day
        // to appear.
        function seedTrail(now) {
            const startOfSecond = new Date(now);
            startOfSecond.setMilliseconds(0);
            for (let back = trailLengthSeconds - 1; back >= 0; back--) {
                pushTrailPoint(plotFor(new Date(startOfSecond.getTime() - back * 1000)));
            }
            recolourTrail();
            lastPlottedSecond = startOfSecond.getSeconds();
        }

        // A small orbit control, inline so the clock needs nothing beyond Three.js
        // itself. Spherical camera position driven by pointer drag and wheel.
        const orbit = { theta: Math.PI / 4, phi: Math.PI / 3, radius: 55, dragging: false, lastX: 0, lastY: 0 };

        function applyCamera() {
            orbit.phi = Math.max(0.15, Math.min(Math.PI - 0.15, orbit.phi));
            orbit.radius = Math.max(25, Math.min(120, orbit.radius));
            camera.position.set(
                orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
                orbit.radius * Math.cos(orbit.phi),
                orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta)
            );
            camera.lookAt(0, 0, 0);
        }

        function bindOrbitControls(el) {
            el.addEventListener('pointerdown', e => {
                orbit.dragging = true;
                orbit.lastX = e.clientX;
                orbit.lastY = e.clientY;
                el.setPointerCapture(e.pointerId);
            });
            el.addEventListener('pointermove', e => {
                if (!orbit.dragging) return;
                orbit.theta -= (e.clientX - orbit.lastX) * 0.006;
                orbit.phi -= (e.clientY - orbit.lastY) * 0.006;
                orbit.lastX = e.clientX;
                orbit.lastY = e.clientY;
                applyCamera();
            });
            const stop = e => {
                orbit.dragging = false;
                if (el.hasPointerCapture && el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
            };
            el.addEventListener('pointerup', stop);
            el.addEventListener('pointercancel', stop);
            el.addEventListener('wheel', e => {
                e.preventDefault();
                orbit.radius += e.deltaY * 0.05;
                applyCamera();
            }, { passive: false });
        }

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            applyCamera();
            bindOrbitControls(renderer.domElement);

            // Bounding Box
            const boxGeom = new THREE.BoxGeometry(scale * 2, scale * 2, scale * 2);
            const boxEdges = new THREE.EdgesGeometry(boxGeom);
            const boxMaterial = new THREE.LineBasicMaterial({ color: 0x444444 });
            scene.add(new THREE.LineSegments(boxEdges, boxMaterial));

            // Marker
            const markerGeom = new THREE.SphereGeometry(0.3, 16, 16);
            const markerMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            marker = new THREE.Mesh(markerGeom, markerMaterial);
            scene.add(marker);

            // Trail
            seedTrail(new Date());
            trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
            trailGeometry.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));
            trailGeometry.setDrawRange(0, trailCount);
            trail = new THREE.Line(trailGeometry, new THREE.LineBasicMaterial({ vertexColors: true }));
            scene.add(trail);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function update() {
            const now = new Date();
            const s = now.getSeconds();

            // The marker slides between whole seconds; the trail does not, so that
            // it stays one point per second. Reduced motion pins it to the second.
            const smooth = plotFor(now);
            if (!prefersReducedMotion) {
                smooth.z = mapRange(s + now.getMilliseconds() / 1000, 0, 60, -scale, scale);
            }
            marker.position.set(smooth.x, smooth.y, smooth.z);

            if (s !== lastPlottedSecond) {
                pushTrailPoint(plotFor(now));
                trailGeometry.setDrawRange(0, trailCount);
                trailGeometry.attributes.position.needsUpdate = true;
                lastPlottedSecond = s;
            }

            document.getElementById('info').textContent = now.toLocaleTimeString();
            renderer.render(scene, camera);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
        }

        init();
    </script>
</body>
</html>
