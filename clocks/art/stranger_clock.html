<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stranger Clock</title>
    <meta name="description" content="Camus's L'Étranger as a day under the Algerian sun: Part One climbs toward the glare of the beach at two o'clock, Part Two spends sixteen hours in a cell.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #2b2620;
            --ink-soft: #4a4136;
            --ink-faint: #6a5d4c;
            --halo: rgba(255, 248, 232, 0.55);
            --strip-ink: #f4ecdc;
            --strip-dim: #cfc4b0;
            --sun: #e0a040;
            --cell: #c9b28a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background: #e9dcc0;
            color: var(--ink);
            font-family: 'Courier Prime', 'Courier New', monospace;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow-x: hidden;
        }

        #sky {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: block;
        }

        #flash {
            position: fixed;
            inset: 0;
            z-index: 3;
            background: #fffdf4;
            opacity: 0;
            pointer-events: none;
        }

        header, main, footer {
            position: relative;
            z-index: 2;
        }

        header {
            padding: clamp(14px, 3vh, 28px) clamp(16px, 4vw, 40px) 0;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            color: var(--ink-soft);
            text-shadow: 0 0 12px var(--halo);
        }

        .book {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: clamp(0.95rem, 2.4vw, 1.2rem);
            letter-spacing: 0.06em;
            color: var(--ink);
        }

        .book span {
            display: block;
            font-family: 'Courier Prime', monospace;
            font-weight: 400;
            font-size: clamp(0.72rem, 1.8vw, 0.85rem);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-top: 0.15em;
        }

        .part-label {
            font-size: clamp(0.72rem, 1.8vw, 0.85rem);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-align: right;
        }

        main {
            align-self: end;
            padding: clamp(100px, 17vh, 260px) clamp(16px, 5vw, 48px) clamp(12px, 3vh, 32px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-shadow: 0 0 18px var(--halo);
        }

        .time {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: clamp(3.6rem, 17vw, 9.5rem);
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .time .sec {
            font-size: 0.3em;
            font-weight: 400;
            letter-spacing: 0;
            color: var(--ink-soft);
            margin-left: 0.15em;
            vertical-align: 0.15em;
        }

        .time.heat {
            filter: url(#heat);
        }

        .date {
            margin-top: clamp(0.4rem, 1.2vh, 0.8rem);
            font-size: clamp(0.85rem, 2.6vw, 1.1rem);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .chapter {
            margin-top: clamp(1.2rem, 3.5vh, 2.2rem);
            font-family: 'IBM Plex Mono', monospace;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        .scene {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: clamp(1.25rem, 4vw, 1.8rem);
            margin-top: 0.25rem;
            color: var(--ink);
        }

        .caption {
            margin-top: 0.7rem;
            max-width: 40rem;
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            line-height: 1.6;
            color: var(--ink-soft);
        }

        .quote {
            margin-top: 1rem;
            max-width: 36rem;
            font-style: italic;
            font-size: clamp(1rem, 2.8vw, 1.25rem);
            line-height: 1.5;
            color: var(--ink);
        }

        .quote[hidden] {
            display: none;
        }

        .quote cite {
            display: block;
            margin-top: 0.3rem;
            font-style: normal;
            font-size: 0.7em;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        footer {
            padding: 0.9rem clamp(16px, 4vw, 40px) clamp(14px, 2.5vh, 24px);
            background: linear-gradient(to bottom, rgba(18, 16, 13, 0), rgba(18, 16, 13, 0.55) 30%);
            color: var(--strip-ink);
        }

        .parts {
            position: relative;
            height: 1.5rem;
            font-size: clamp(0.66rem, 1.7vw, 0.78rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--strip-dim);
        }

        .parts span {
            position: absolute;
            bottom: 0.4rem;
            white-space: nowrap;
        }

        .strip {
            position: relative;
            height: 1.6rem;
            display: flex;
            border-top: 1px solid rgba(244, 236, 220, 0.5);
        }

        .seg {
            position: relative;
            border-left: 1px solid rgba(244, 236, 220, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: clamp(0.6rem, 1.6vw, 0.75rem);
            color: var(--strip-dim);
            overflow: hidden;
        }

        .seg.p1 {
            background: rgba(224, 160, 64, 0.22);
        }

        .seg.p2 {
            background: rgba(120, 128, 150, 0.18);
        }

        .seg.now {
            color: #fff8ea;
            font-weight: 600;
        }

        .seg.p1.now {
            background: rgba(224, 160, 64, 0.5);
        }

        .seg.p2.now {
            background: rgba(150, 160, 190, 0.42);
        }

        .marker {
            position: absolute;
            top: -0.3rem;
            bottom: 0;
            width: 2px;
            margin-left: -1px;
            background: #fff8ea;
            box-shadow: 0 0 6px rgba(255, 248, 234, 0.8);
        }

        .marker::before {
            content: '';
            position: absolute;
            top: 0;
            left: -4px;
            width: 10px;
            height: 10px;
            margin-top: -5px;
            border-radius: 50%;
            background: #fff8ea;
        }

        .hours {
            position: relative;
            height: 1.1rem;
            font-size: clamp(0.6rem, 1.5vw, 0.72rem);
            color: var(--strip-dim);
        }

        .hours span {
            position: absolute;
            top: 0.2rem;
            transform: translateX(-50%);
        }

        .hours span:first-child {
            transform: none;
        }

        .hours span:last-child {
            transform: translateX(-100%);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        @media (max-width: 520px) {
            .hours .minor {
                display: none;
            }
        }

        @media (max-height: 560px) {
            main {
                padding-top: 110px;
            }

            .caption {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div id="flash" aria-hidden="true"></div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <filter id="heat" x="-5%" y="-20%" width="110%" height="140%">
            <feTurbulence id="heatNoise" type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" seed="3" result="n" />
            <feDisplacementMap id="heatMap" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <header>
        <div class="book" lang="fr">L'Étranger<span lang="en">Albert Camus, 1942</span></div>
        <div class="part-label" id="partLabel">Part One</div>
    </header>

    <main>
        <div class="time" id="time" aria-hidden="true">00:00<span class="sec">:00</span></div>
        <div class="date" id="date"></div>
        <div class="chapter" id="chapter"></div>
        <div class="scene" id="scene"></div>
        <p class="caption" id="caption"></p>
        <blockquote class="quote" id="quote" lang="fr" hidden></blockquote>
        <div class="sr-only" aria-live="polite" id="announce"></div>
    </main>

    <footer aria-hidden="true">
        <div class="parts" id="parts"></div>
        <div class="strip" id="strip"><div class="marker" id="marker"></div></div>
        <div class="hours" id="hours"></div>
    </footer>

    <script>
        // ---- The book laid along a day ------------------------------------
        // The day starts at 06:00, the way the novel starts in the morning.
        // Part One runs 06:00 to 14:00, climbing toward the glare on the beach.
        // Part Two runs 14:00 to 06:00: sixteen hours in a cell, the hour count
        // Meursault learns to sleep away, ending at dawn, the hour they come
        // for the condemned. Then the book begins again.
        const CHAPTERS = [
            { part: 1, n: 'I', start: 6, end: 8, scenes: [{ from: 6, title: 'Marengo',
                text: "A telegram from the old people's home. The bus through the heat, the vigil beside the closed coffin, then the funeral procession under a sun so fierce he can barely think.",
                quote: { text: "Aujourd'hui, maman est morte. Ou peut-être hier, je ne sais pas.", cite: 'Part One, the opening lines' } }] },
            { part: 1, n: 'II', start: 8, end: 9.5, scenes: [{ from: 8, title: 'Saturday, Sunday',
                text: 'The day after the funeral he swims with Marie at the harbour baths and takes her to a comic film. Sunday he spends at his window, watching the street. Nothing, he decides, has changed.' }] },
            { part: 1, n: 'III', start: 9.5, end: 10.75, scenes: [{ from: 9.5, title: 'Neighbours',
                text: 'Back at the office. On the stairs old Salamano curses his mangy dog. Raymond asks him to write a letter to the woman he means to punish, and he writes it, since he has no reason not to.' }] },
            { part: 1, n: 'IV', start: 10.75, end: 12, scenes: [{ from: 10.75, title: 'Raymond',
                text: "Raymond beats the woman and a policeman comes up the stairs. Marie asks whether he loves her. He tells her the question means nothing, but he doesn't think so." }] },
            { part: 1, n: 'V', start: 12, end: 13, scenes: [{ from: 12, title: 'Paris',
                text: 'His employer offers him a post in Paris; one life is as good as another. Marie asks if he will marry her, and it makes no difference to him. Salamano\'s dog runs away.' }] },
            { part: 1, n: 'VI', start: 13, end: 14, scenes: [{ from: 13, title: 'The beach',
                text: "Sunday at Masson's cabin. After lunch, the walk along the white sand, Raymond's revolver, then back alone toward the spring, into the light. A blade flashes. On this clock, at two, one shot, and then four more." }] },
            { part: 2, n: 'I', start: 14, end: 16, scenes: [{ from: 14, title: 'Questions',
                text: 'Arrested. The examining magistrate waves a silver crucifix at him and wants to know why he paused between the first shot and the other four. He has no answer that would satisfy anyone.' }] },
            { part: 2, n: 'II', start: 16, end: 19, scenes: [{ from: 16, title: 'The cell',
                text: 'Months behind a barred window. One visit from Marie across a shouting parlour. He kills time by recalling every object in his old room, sleeps sixteen hours a day or more, and the days lose their names until only yesterday and tomorrow still mean anything.' }] },
            { part: 2, n: 'III', start: 19, end: 21, scenes: [{ from: 19, title: 'The trial',
                text: "A packed summer courtroom, the jurors fanning themselves. The director of the home, the caretaker's coffee, a cigarette at the vigil, Marie and the comic film: his mother's funeral becomes the case against him." }] },
            { part: 2, n: 'IV', start: 21, end: 23, scenes: [{ from: 21, title: 'The verdict',
                text: 'The prosecutor says he has no soul. Asked to explain himself, Meursault says, too fast, that it was because of the sun, and the room laughs. The sentence: his head, in a public square, in the name of the French people.' }] },
            { part: 2, n: 'V', start: 23, end: 30, scenes: [
                { from: 23, title: 'The chaplain',
                    text: 'He has refused the chaplain three times. When the priest comes anyway, something bursts open in him; he seizes him by the collar and shouts out the few things he is sure of.' },
                { from: 24, title: 'The stars',
                    text: 'Afterwards, calm. The smells of the night and the sounds of the countryside reach him, the walls seem to fall away, and under the stars he feels that he has been happy, and is happy still.',
                    quote: { text: 'la tendre indifférence du monde', cite: 'Part Two, the closing pages' } },
                { from: 29, title: 'Dawn',
                    text: 'Dawn is when they come for the condemned. He lies awake listening for footsteps until the light arrives, and every dawn that passes in silence is one more day.' }
            ] }
        ];

        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        // Book-day hour: 6..30, so Part Two's night stays contiguous.
        const bookHour = t => (t < 6 ? t + 24 : t);
        const stripPos = t => (bookHour(t) - 6) / 24;

        function locate(t) {
            const b = bookHour(t);
            const ch = CHAPTERS.find(c => b >= c.start && b < c.end) || CHAPTERS[0];
            let sc = ch.scenes[0];
            for (const s of ch.scenes) if (b >= s.from) sc = s;
            return { ch, sc };
        }

        // ---- Colour helpers ----------------------------------------------
        const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
        const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
        const css = (c, a = 1) => `rgba(${c.map(Math.round).join(',')},${a})`;
        const lum = c => {
            const [r, g, b] = c.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        };
        const clamp01 = v => Math.max(0, Math.min(1, v));
        const smooth = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };

        // Sky [hour, zenith, horizon]
        const SKY = [
            [0, '#0a0f1e', '#18203a'],
            [4.6, '#0c1226', '#1d2741'],
            [5.5, '#343a5a', '#b9846a'],
            [6.3, '#8eaac0', '#efcfa4'],
            [9, '#b4cddb', '#f5e4c0'],
            [12, '#e2ebee', '#fbf2d8'],
            [14, '#fffdf6', '#fff5da'],
            [17, '#d7dfe2', '#f2d9ac'],
            [19.4, '#64688a', '#e49a68'],
            [20.4, '#1c2240', '#3a3456'],
            [22, '#0a0f1e', '#151b32'],
            [24, '#0a0f1e', '#18203a']
        ].map(([h, a, b]) => [h, hex(a), hex(b)]);

        function skyAt(t) {
            for (let i = 0; i < SKY.length - 1; i++) {
                const [h0, z0, o0] = SKY[i], [h1, z1, o1] = SKY[i + 1];
                if (t >= h0 && t <= h1) {
                    const k = (t - h0) / (h1 - h0);
                    return [mix(z0, z1, k), mix(o0, o1, k)];
                }
            }
            return [SKY[0][1], SKY[0][2]];
        }

        // Light and heat: rises through Part One, peaks at 14:00 on the beach,
        // with a first surge at the funeral. After 14:00 it only reaches the cell
        // through the window.
        function glareAt(t) {
            if (t >= 6 && t < 14) {
                const climb = Math.pow((t - 6) / 8, 2.2);
                const funeral = 0.42 * Math.exp(-Math.pow((t - 7.3) / 0.45, 2));
                return clamp01(Math.max(climb, funeral));
            }
            if (t >= 14 && t < 20) return 0.85 * Math.pow(1 - (t - 14) / 6, 1.6);
            return 0;
        }

        // Elevation 0..1 of the sun, up 06:00, down 20:00
        const sunElev = t => (t > 6 && t < 20 ? Math.sin(Math.PI * (t - 6) / 14) : 0);

        // Prison walls: closed 14:00 to midnight, they dissolve after the
        // chaplain leaves, and the morning is open again.
        function wallsAt(t) {
            if (t >= 14) return 1;
            if (t < 0.6) return 1 - smooth(0, 0.6, t);
            return 0;
        }

        // ---- Canvas ------------------------------------------------------
        const canvas = document.getElementById('sky');
        const ctx = canvas.getContext('2d');
        const flashEl = document.getElementById('flash');
        const heatMap = document.getElementById('heatMap');
        const heatNoise = document.getElementById('heatNoise');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let W = 0, H = 0, horizon = 0, win = null;

        // Fixed star field
        let seed = 1942;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const STARS = Array.from({ length: 260 }, () => ({ x: rnd(), y: rnd(), r: 0.4 + rnd() * 1.3, p: rnd() * 6.28, s: 0.5 + rnd() * 2 }));

        function layout() {
            const dpr = window.devicePixelRatio || 1;
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const headerB = document.querySelector('header').getBoundingClientRect().bottom;
            const mainTop = document.getElementById('time').getBoundingClientRect().top;
            const footTop = document.querySelector('footer').getBoundingClientRect().top;
            horizon = Math.min(H * 0.86, Math.max(H * 0.6, footTop + 6));

            // Cell window sits in the gap between the header and the time
            const gapTop = headerB + 14, gapBot = mainTop - 18;
            const avail = Math.max(50, gapBot - gapTop);
            let wh = Math.min(avail, Math.max(70, Math.min(W, H) * 0.24));
            let ww = Math.min(wh * 1.15, W * 0.5);
            wh = Math.min(wh, ww / 0.95);
            win = { x: (W - ww) / 2, y: gapTop + (avail - wh) / 2, w: ww, h: wh };
        }

        function drawSky(t, ms, animate) {
            const [zen, hor] = skyAt(t);
            const g = ctx.createLinearGradient(0, 0, 0, horizon);
            g.addColorStop(0, css(zen));
            g.addColorStop(1, css(hor));
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, horizon + 1);

            // Stars, fading with daylight
            const dark = 1 - smooth(0.04, 0.28, lum(zen));
            if (dark > 0.01) {
                for (const s of STARS) {
                    const tw = animate ? 0.65 + 0.35 * Math.sin(ms / 1000 * s.s + s.p) : 0.85;
                    ctx.fillStyle = `rgba(255,250,235,${dark * tw * (0.35 + s.r / 2.4)})`;
                    ctx.beginPath();
                    ctx.arc(s.x * W, s.y * horizon * 0.97, s.r, 0, 6.283);
                    ctx.fill();
                }
            }

            // Sun along its arc
            const e = sunElev(t);
            const glare = glareAt(t);
            let sun = null;
            if (e > 0) {
                const x = W * (0.08 + 0.84 * (t - 6) / 14);
                const top = Math.max(H * 0.1, 70);
                const y = horizon - e * (horizon - top);
                const base = Math.min(W, H) * 0.05;
                const wob = animate ? 1 + 0.02 * Math.sin(ms / 170) * glare : 1;
                const r = base * (1 + 0.7 * glare) * wob;
                const halo = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * (3 + 9 * glare));
                halo.addColorStop(0, `rgba(255,246,214,${0.55 + 0.4 * glare})`);
                halo.addColorStop(1, 'rgba(255,240,200,0)');
                ctx.fillStyle = halo;
                ctx.fillRect(0, 0, W, H);
                const low = 1 - smooth(0.05, 0.45, e);
                ctx.fillStyle = css(mix([255, 251, 236], [242, 150, 80], low));
                ctx.beginPath();
                ctx.arc(x, y, r, 0, 6.283);
                ctx.fill();
                sun = { x, y, r, e };
            }

            // Sea
            const sea = ctx.createLinearGradient(0, horizon, 0, H);
            const seaTop = mix(mix(hor, [40, 92, 118], 0.55), [10, 14, 26], dark * 0.6);
            const seaBot = mix(mix(zen, [22, 58, 82], 0.75), [6, 9, 18], dark * 0.6);
            sea.addColorStop(0, css(seaTop));
            sea.addColorStop(1, css(seaBot));
            ctx.fillStyle = sea;
            ctx.fillRect(0, horizon, W, H - horizon);

            // Glitter under the sun
            if (sun) {
                const n = 46;
                for (let i = 0; i < n; i++) {
                    const k = i / n;
                    const yy = horizon + 4 + k * (H - horizon);
                    const spread = 10 + k * W * 0.12;
                    const ph = animate ? ms / 600 + i * 1.7 : i * 1.7;
                    const xx = sun.x + Math.sin(ph * 1.3 + i) * spread;
                    const a = (0.25 + 0.55 * glare) * (0.5 + 0.5 * Math.sin(ph + i * 3.1)) * sun.e;
                    ctx.fillStyle = `rgba(255,248,226,${a})`;
                    ctx.fillRect(xx - 6 - k * 10, yy, 12 + k * 20, 1.5);
                }
            }

            // Glare veil: the whole scene bleaches toward 14:00
            if (glare > 0) {
                ctx.fillStyle = `rgba(255,252,240,${0.5 * glare * glare})`;
                ctx.fillRect(0, 0, W, H);
            }
            return { zen, hor, dark };
        }

        function drawCell(t, alpha, sky) {
            if (alpha <= 0 || !win) return;
            ctx.save();
            ctx.globalAlpha = alpha;
            // Walls, with the window cut out
            ctx.beginPath();
            ctx.rect(0, 0, W, H);
            ctx.rect(win.x + win.w, win.y, -win.w, win.h);
            const wall = ctx.createLinearGradient(0, 0, 0, H);
            wall.addColorStop(0, '#3a352f');
            wall.addColorStop(0.75, '#2a2621');
            wall.addColorStop(1, '#1d1a17');
            ctx.fillStyle = wall;
            ctx.fill('evenodd');

            // The patch of light from the window travels the wall like a sundial
            const glare = glareAt(t);
            if (glare > 0.02) {
                const k = clamp01((t - 14) / 6);
                const shift = (0.15 - 0.9 * k) * W * 0.5;
                const drop = H * (0.32 + 0.1 * k);
                const x0 = win.x, x1 = win.x + win.w, y0 = win.y + win.h;
                ctx.fillStyle = `rgba(255,226,170,${0.14 * glare + 0.03})`;
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y0);
                ctx.lineTo(x1 + shift, y0 + drop);
                ctx.lineTo(x0 + shift, y0 + drop);
                ctx.closePath();
                ctx.fill();
                // bar shadows in the patch
                ctx.strokeStyle = 'rgba(42,38,33,0.55)';
                ctx.lineWidth = Math.max(3, win.w * 0.045);
                for (let i = 1; i <= 4; i++) {
                    const xb = x0 + (win.w * i) / 5;
                    ctx.beginPath();
                    ctx.moveTo(xb, y0);
                    ctx.lineTo(xb + shift, y0 + drop);
                    ctx.stroke();
                }
            }

            // Window frame and bars
            ctx.fillStyle = '#17140f';
            const bw = Math.max(3, win.w * 0.04);
            for (let i = 1; i <= 4; i++) ctx.fillRect(win.x + (win.w * i) / 5 - bw / 2, win.y, bw, win.h);
            ctx.fillRect(win.x, win.y + win.h * 0.5 - bw / 2, win.w, bw);
            ctx.strokeStyle = '#120f0c';
            ctx.lineWidth = Math.max(4, win.w * 0.05);
            ctx.strokeRect(win.x, win.y, win.w, win.h);
            // sill light
            if (glare > 0.02) {
                ctx.fillStyle = `rgba(255,232,190,${0.5 * glare})`;
                ctx.fillRect(win.x - 4, win.y + win.h + ctx.lineWidth / 2, win.w + 8, 2);
            }
            ctx.restore();
        }

        let lastFrame = 0;
        function render(ms) {
            const now = new Date();
            const t = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600 + now.getMilliseconds() / 3.6e6;
            const animate = !reduceMotion.matches;
            const sky = drawSky(t, ms || 0, animate);
            drawCell(t, wallsAt(t), sky);

            // Heat shimmer on the digits (Part One only, and the first minutes after)
            const heat = t >= 6 && t < 14.25 ? glareAt(Math.min(t, 13.999)) * (t < 14 ? 1 : 1 - (t - 14) / 0.25) : 0;
            const scale = heat * 9;
            heatMap.setAttribute('scale', scale.toFixed(2));
            timeEl.classList.toggle('heat', scale > 0.3);
            if (animate && scale > 0.3) {
                const f = 0.09 + 0.012 * Math.sin((ms || 0) / 260);
                heatNoise.setAttribute('baseFrequency', `0.012 ${f.toFixed(4)}`);
            }

            // 14:00: one shot, a pause, then four quick knocks
            let fl = 0;
            if (animate && now.getHours() === 14 && now.getMinutes() === 0) {
                const s = now.getSeconds() + now.getMilliseconds() / 1000;
                if (s < 1.5) fl = 0.75 * Math.exp(-s * 3);
                for (const k of [3, 3.7, 4.4, 5.1]) if (s >= k && s < k + 0.6) fl = Math.max(fl, 0.4 * Math.exp(-(s - k) * 7));
            }
            flashEl.style.opacity = fl.toFixed(3);
        }

        function loop(ms) {
            if (ms - lastFrame > 40) {
                render(ms);
                lastFrame = ms;
            }
            if (!reduceMotion.matches) requestAnimationFrame(loop);
        }

        // ---- Text --------------------------------------------------------
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');
        const partEl = document.getElementById('partLabel');
        const chapterEl = document.getElementById('chapter');
        const sceneEl = document.getElementById('scene');
        const captionEl = document.getElementById('caption');
        const quoteEl = document.getElementById('quote');
        const announceEl = document.getElementById('announce');
        const markerEl = document.getElementById('marker');
        const rootStyle = document.documentElement.style;
        const pad = n => String(n).padStart(2, '0');
        let lastScene = null, lastMinute = -1;

        function buildStrip() {
            const strip = document.getElementById('strip');
            CHAPTERS.forEach((c, i) => {
                const seg = document.createElement('div');
                seg.className = 'seg p' + c.part;
                seg.style.flex = String(c.end - c.start);
                seg.textContent = c.n;
                seg.dataset.i = i;
                strip.appendChild(seg);
            });
            document.getElementById('parts').innerHTML =
                '<span style="left:0">Part One</span>' +
                `<span style="left:${(8 / 24) * 100}%;padding-left:0.4rem">Part Two, sixteen hours</span>`;
            const hrs = [6, 10, 14, 18, 22, 2, 6];
            document.getElementById('hours').innerHTML = hrs.map((h, i) => {
                const left = (i * 4 / 24) * 100;
                const minor = (h === 10 || h === 18 || h === 22 || h === 2) ? ' class="minor"' : '';
                return `<span${minor} style="left:${left}%">${pad(h)}:00</span>`;
            }).join('');
        }

        function setInk(t) {
            const walls = wallsAt(t);
            const [zen, hor] = skyAt(t);
            let bg = mix(zen, hor, 0.62);
            const glare = glareAt(t);
            if (walls < 0.5) bg = mix(bg, [255, 252, 240], 0.5 * glare * glare);
            else bg = hex('#2e2a25');
            const light = walls >= 0.5 || lum(bg) < 0.3;
            let ink, soft, faint, halo;
            if (light) {
                ink = hex('#f3ead8'); soft = hex('#ddd1bc'); faint = hex('#c9b99e');
                halo = 'rgba(10,8,6,0.55)';
            } else {
                // Part One: the glare eats into the digits as the day heats up
                const heat = t >= 6 && t < 14 ? glare : 0;
                ink = mix(hex('#2b2620'), bg, 0.42 * heat);
                soft = mix(hex('#3f362c'), bg, 0.18 * heat);
                faint = mix(hex('#5c4f3f'), bg, 0.12 * heat);
                halo = `rgba(255,250,236,${0.5 - 0.3 * heat})`;
            }
            rootStyle.setProperty('--ink', css(ink));
            rootStyle.setProperty('--ink-soft', css(soft));
            rootStyle.setProperty('--ink-faint', css(faint));
            rootStyle.setProperty('--halo', halo);
        }

        function tick() {
            const now = new Date();
            const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            const t = h + m / 60 + s / 3600;
            timeEl.firstChild.nodeValue = `${pad(h)}:${pad(m)}`;
            timeEl.lastChild.textContent = `:${pad(s)}`;

            const { ch, sc } = locate(t);
            const partName = ch.part === 1 ? 'Part One' : 'Part Two';
            // In prison the days stop having names
            const named = ch.part === 1 || (t >= 14 && t < 16);
            dateEl.textContent = named
                ? `${DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]}`
                : 'yesterday · tomorrow';

            if (sc !== lastScene) {
                lastScene = sc;
                partEl.textContent = partName;
                chapterEl.textContent = `${partName} · Chapter ${ch.n}`;
                sceneEl.textContent = sc.title;
                captionEl.textContent = sc.text;
                if (sc.quote) {
                    quoteEl.innerHTML = `« ${sc.quote.text} »<cite lang="en">${sc.quote.cite}</cite>`;
                    quoteEl.hidden = false;
                } else {
                    quoteEl.hidden = true;
                }
                document.querySelectorAll('.seg').forEach(el => el.classList.toggle('now', CHAPTERS[el.dataset.i] === ch));
                requestAnimationFrame(layout);
            }
            markerEl.style.left = (stripPos(t) * 100).toFixed(3) + '%';
            setInk(t);

            if (m !== lastMinute) {
                lastMinute = m;
                announceEl.textContent = `${pad(h)}:${pad(m)}. ${partName}, chapter ${ch.n}: ${sc.title}.`;
            }
            if (reduceMotion.matches && win) render(performance.now());
        }

        buildStrip();
        tick();
        layout();
        render(0);
        setInterval(tick, 1000);
        requestAnimationFrame(loop);
        reduceMotion.addEventListener('change', () => { if (!reduceMotion.matches) requestAnimationFrame(loop); });
        window.addEventListener('resize', () => { layout(); render(performance.now()); });
        if (document.fonts) document.fonts.ready.then(() => { layout(); render(performance.now()); });
    </script>
</body>

</html>
