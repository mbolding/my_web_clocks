<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime and Punishment Clock</title>
    <meta name="description" content="Every hour Raskolnikov walks the 730 steps from his garret to the pawnbroker's bell, while the day runs through the novel and his fever rises and breaks.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #35321f;
            --bg-bottom: #15140b;
            --panel: rgba(18, 16, 9, 0.55);
            --rule: rgba(216, 200, 160, 0.22);
            --ink: #ece4cf;
            --ink-soft: #c9bfa6;
            --ink-dim: #a99f86;
            --accent: #e0a46a;
            --fever: #e26a4a;
        }

        body.fever {
            --bg-top: #3f2c1c;
            --bg-bottom: #190d07;
            --accent: #ee9a6c;
        }

        body.siberia {
            --bg-top: #22303a;
            --bg-bottom: #0b1218;
            --rule: rgba(180, 205, 225, 0.22);
            --ink: #e4ecf2;
            --ink-soft: #bccbd6;
            --ink-dim: #96a8b6;
            --accent: #9cc4e4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: #15140b; }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            background-color: var(--bg-bottom);
            font-family: 'PT Serif', Georgia, serif;
            color: var(--ink);
            transition: color 2s ease;
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            grid-template-columns: minmax(300px, 0.85fr) minmax(0, 1.6fr);
            grid-template-rows: minmax(0, 1fr) auto;
            grid-template-areas:
                "text map"
                "chart chart";
            gap: clamp(14px, 2vw, 28px) clamp(18px, 3vw, 44px);
            padding: clamp(16px, 3vw, 40px);
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ---------- left column ---------- */
        .text {
            grid-area: text;
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 2vh, 22px);
            min-width: 0;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(1.6rem, 2.6vw, 2.5rem);
            line-height: 1.1;
            letter-spacing: 0.01em;
        }

        header .sub {
            margin-top: 0.35rem;
            font-size: clamp(0.85rem, 1.1vw, 1rem);
            color: var(--ink-soft);
        }

        header .sub i { color: var(--ink-dim); }

        .readout {
            border-top: 1px solid var(--rule);
            border-bottom: 1px solid var(--rule);
            padding: clamp(10px, 1.6vh, 18px) 0;
        }

        .time {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(3rem, 6.4vw, 5.6rem);
            line-height: 1;
            font-variant-numeric: tabular-nums lining-nums;
            color: var(--ink);
        }

        .time .sec {
            font-size: 0.4em;
            color: var(--ink-dim);
            margin-left: 0.15em;
            font-weight: 400;
        }

        .steps {
            margin-top: 0.6rem;
            font-size: clamp(0.95rem, 1.3vw, 1.15rem);
            color: var(--ink-soft);
            font-variant-numeric: tabular-nums;
        }

        .steps b {
            color: var(--accent);
            font-weight: 700;
            transition: color 2s ease;
        }

        .steprule {
            margin-top: 0.55rem;
            height: 4px;
            background: var(--rule);
            position: relative;
            overflow: hidden;
        }

        .steprule span {
            position: absolute;
            inset: 0 auto 0 0;
            background: var(--accent);
            width: 0;
            transition: background 2s ease;
        }

        .chapter {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .where {
            font-size: clamp(0.72rem, 0.9vw, 0.82rem);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-dim);
        }

        .chapter h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(1.35rem, 2.2vw, 2rem);
            line-height: 1.15;
        }

        .place {
            font-style: italic;
            color: var(--ink-soft);
            font-size: clamp(0.92rem, 1.15vw, 1.05rem);
        }

        blockquote {
            margin-top: 0.4rem;
            padding-left: 1rem;
            border-left: 3px solid var(--accent);
            font-size: clamp(1rem, 1.5vw, 1.35rem);
            line-height: 1.6;
            color: var(--ink);
            transition: border-color 2s ease;
        }

        blockquote cite {
            display: block;
            margin-top: 0.45rem;
            font-style: normal;
            font-size: 0.8em;
            color: var(--ink-dim);
        }

        /* ---------- map ---------- */
        .map {
            grid-area: map;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        .map-wrap {
            position: relative;
            flex: 1;
            min-height: 320px;
        }

        .map canvas {
            position: absolute;
            inset: 0;
            display: block;
        }

        .map figcaption {
            margin-top: 0.6rem;
            font-size: clamp(0.85rem, 1.05vw, 0.98rem);
            line-height: 1.5;
            color: var(--ink-soft);
            min-height: 3em;
        }

        .map figcaption cite {
            font-style: normal;
            color: var(--ink-dim);
            font-size: 0.88em;
            white-space: nowrap;
        }

        /* ---------- fever chart ---------- */
        .chart {
            grid-area: chart;
            min-width: 0;
        }

        .chart-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            font-size: clamp(0.72rem, 0.9vw, 0.82rem);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-dim);
            margin-bottom: 0.4rem;
        }

        .chart-wrap {
            position: relative;
            height: clamp(96px, 13vh, 130px);
        }

        .chart canvas {
            position: absolute;
            inset: 0;
            display: block;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        @media (max-width: 860px), (max-height: 560px) {
            .page {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto;
                grid-template-areas:
                    "head"
                    "map"
                    "text"
                    "chart";
            }
            .text { display: contents; }
            .head-block { grid-area: head; display: flex; flex-direction: column; gap: 14px; }
            .chapter { grid-area: text; }
            .map-wrap { flex: none; aspect-ratio: 1000 / 700; min-height: 0; }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="text">
            <div class="head-block">
                <header>
                    <h1>Crime and Punishment</h1>
                    <p class="sub">Fyodor Dostoevsky, 1866 · <i lang="ru">Преступление и наказание</i></p>
                </header>

                <div class="readout">
                    <div class="time" id="time" role="timer" aria-label="Current time">--:--<span class="sec">--</span></div>
                    <div class="steps" id="steps">Step <b>0</b> of 730</div>
                    <div class="steprule" aria-hidden="true"><span id="steprule"></span></div>
                </div>
            </div>

            <article class="chapter" id="chapter" aria-live="polite">
                <div class="where" id="where">Part I · Chapter I</div>
                <h2 id="head">The garret</h2>
                <div class="place" id="place">S. Place, under the roof</div>
                <blockquote>
                    <span id="quote"></span>
                    <cite id="cite"></cite>
                </blockquote>
            </article>
        </section>

        <figure class="map">
            <div class="map-wrap">
                <canvas id="map" role="img" aria-label="Schematic map of the walk from Raskolnikov's lodging in S. Place, over K. bridge, to the old pawnbroker's house on the canal"></canvas>
            </div>
            <figcaption id="caption"></figcaption>
        </figure>

        <section class="chart" aria-label="Fever through the day">
            <div class="chart-head">
                <span>The fever, hour by hour</span>
                <span id="fever-label">Fever</span>
            </div>
            <div class="chart-wrap">
                <canvas id="chart" aria-hidden="true"></canvas>
            </div>
        </section>
    </main>

    <script>
        // ------------------------------------------------------------------
        // The day is the novel. The book opens at 14:00 so that the hour
        // of the murder falls at seven in the evening, as it does in the
        // text; Svidrigailov's last morning falls at five ("It was nearly
        // five."). Each hour is also one walk of 730 steps, gate to bell.
        // All quotations: Constance Garnett's translation (1914).
        // ------------------------------------------------------------------
        const HOURS = {
            14: { part: 'Part I', chap: 'Chapter I', head: 'The garret', place: 'S. Place, under the roof',
                  q: 'His garret was under the roof of a high, five-storied house and was more like a cupboard than a room.', fever: 0.15 },
            15: { part: 'Part I', chap: 'Chapter I', head: 'The rehearsal', place: 'From the gate to the house on the canal',
                  q: 'He had counted them once when he had been lost in dreams.', fever: 0.2 },
            16: { part: 'Part I', chap: 'Chapter II', head: 'Marmeladov', place: 'A tavern, near the Hay Market',
                  q: '“Honoured sir,” he began almost with solemnity, “poverty is not a vice, that’s a true saying.”', fever: 0.26 },
            17: { part: 'Part I', chap: 'Chapter V', head: 'The dream of the mare', place: 'Asleep in the bushes on Petrovsky Island',
                  q: 'He dreamt he was back in his childhood in the little town of his birth.', fever: 0.45 },
            18: { part: 'Part I', chap: 'Chapter V', head: 'The Hay Market', place: 'Lizaveta at the huckster’s stall',
                  q: '…that therefore at seven o’clock precisely the old woman <em>would be left alone</em>.', fever: 0.6 },
            19: { part: 'Part I', chap: 'Chapter VI', head: 'Seven o’clock', place: 'The house on the canal, fourth storey',
                  q: 'Glancing out of the corner of his eye into a shop, he saw by a clock on the wall that it was ten minutes past seven.', fever: 0.8 },
            20: { part: 'Part I', chap: 'Chapter VII', head: 'Behind the door', place: 'The old woman’s flat, Koch knocking',
                  q: 'Raskolnikov stood keeping tight hold of the axe. He was in a sort of delirium.', fever: 0.95 },
            21: { part: 'Part II', chap: 'Chapter I', head: 'Delirium', place: 'The garret, under his old student’s coat',
                  q: '…covered himself up with it and once more sank into drowsiness and delirium. He lost consciousness.', fever: 1 },
            22: { part: 'Part II', chap: 'Chapter III', head: 'Four days', place: 'Razumihin at the bedside',
                  q: '“For the last four days you have scarcely eaten or drunk anything.”', fever: 0.85 },
            23: { part: 'Part III', chap: 'Chapter V', head: 'The article', place: 'Porfiry Petrovitch’s rooms',
                  q: '“…that is not an official right, but an inner right to decide in his own conscience to overstep… certain obstacles.”', fever: 0.6 },
            0:  { part: 'Part III', chap: 'Chapter V', head: 'Napoleons', place: 'Porfiry Petrovitch’s rooms',
                  q: '“Oh, come, don’t we all think ourselves Napoleons now in Russia?”', fever: 0.64 },
            1:  { part: 'Part III', chap: 'Chapter VI', head: 'The nightmare', place: 'The old woman’s flat, in a dream',
                  q: '…the old woman was sitting and laughing, shaking with noiseless laughter.', fever: 0.82 },
            2:  { part: 'Part IV', chap: 'Chapter IV', head: 'Lazarus', place: 'Sonia’s room at Kapernaumov’s',
                  q: '“And when He thus had spoken, He cried with a loud voice, Lazarus, come forth.”', fever: 0.5 },
            3:  { part: 'Part V', chap: 'Chapter IV', head: 'The confession to Sonia', place: 'Sonia’s room',
                  q: '“…whether I am a trembling creature or whether I have the <em>right</em>…”', fever: 0.62 },
            4:  { part: 'Part V', chap: 'Chapter IV', head: 'The cross-roads', place: 'Sonia’s room',
                  q: '“Go at once, this very minute, stand at the cross-roads, bow down, first kiss the earth which you have defiled…”', fever: 0.55 },
            5:  { part: 'Part VI', chap: 'Chapter VI', head: 'Svidrigailov', place: 'The big house with the tower, in the mist',
                  q: 'There was a thick mist outside and he could see nothing. It was nearly five.', fever: 0.45 },
            6:  { part: 'Part VI', chap: 'Chapter VIII', head: 'The Hay Market', place: 'On his knees in the square',
                  q: 'He knelt down in the middle of the square, bowed down to the earth, and kissed that filthy earth with bliss and rapture.', fever: 0.5 },
            7:  { part: 'Part VI', chap: 'Chapter VIII', head: 'The police station', place: 'Ilya Petrovitch’s office',
                  q: '“<em>It was I killed the old pawnbroker woman and her sister Lizaveta with an axe and robbed them.</em>”', fever: 0.38 },
            8:  { part: 'Epilogue', chap: 'I', head: 'Siberia', place: 'The fortress on the river',
                  q: 'Siberia. On the banks of a broad solitary river stands a town, one of the administrative centres of Russia.', fever: 0.22, siberia: true },
            9:  { part: 'Epilogue', chap: 'II', head: 'Lent', place: 'The convict ward of the hospital',
                  q: 'He was in the hospital from the middle of Lent till after Easter.', fever: 0.5, siberia: true },
            10: { part: 'Epilogue', chap: 'II', head: 'The plague dream', place: 'The convict ward of the hospital',
                  q: 'He dreamt that the whole world was condemned to a terrible new strange plague.', fever: 0.66, siberia: true },
            11: { part: 'Epilogue', chap: 'II', head: 'The river', place: 'A heap of logs by the kiln shed',
                  q: '…sat down on a heap of logs by the shed and began gazing at the wide deserted river.', fever: 0.22, siberia: true },
            12: { part: 'Epilogue', chap: 'II', head: 'Sonia', place: 'The river bank',
                  q: 'How it happened he did not know. But all at once something seemed to seize him and fling him at her feet.', fever: 0.1, siberia: true },
            13: { part: 'Epilogue', chap: 'II', head: 'A new story', place: 'Seven more years to wait',
                  q: 'But that is the beginning of a new story—the story of the gradual renewal of a man.', fever: 0.04, siberia: true }
        };

        const PARTS = [
            { label: 'Part I', short: 'I', from: 14, to: 21 },
            { label: 'Part II', short: 'II', from: 21, to: 23 },
            { label: 'Part III', short: 'III', from: 23, to: 26 },
            { label: 'Part IV', short: 'IV', from: 26, to: 27 },
            { label: 'Part V', short: 'V', from: 27, to: 29 },
            { label: 'Part VI', short: 'VI', from: 29, to: 32 },
            { label: 'Epilogue', short: 'Ep.', from: 32, to: 38 }
        ];

        const STEPS = 730;
        const WALK_SECONDS = 3540;  // the walk fills :00 to :59, the last minute is spent at the bell
        const DAY_START = 14;       // the book opens at 14:00

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        // ------------------------------------------------------------------
        // Time helpers
        // ------------------------------------------------------------------
        function bookIndex(hour) { return (hour - DAY_START + 24) % 24; }   // 0..23 from 14:00

        function feverAt(date) {
            const h = date.getHours();
            const f = (date.getMinutes() * 60 + date.getSeconds()) / 3600;
            const a = HOURS[h].fever;
            const b = HOURS[(h + 1) % 24].fever;
            // ease between hourly readings so the fever drifts rather than jumps
            const s = f < 0.75 ? 0 : (f - 0.75) / 0.25;
            return a + (b - a) * s * s * (3 - 2 * s);
        }

        function stepAt(date) {
            const s = date.getMinutes() * 60 + date.getSeconds() + date.getMilliseconds() / 1000;
            return Math.min(STEPS, (s / WALK_SECONDS) * STEPS);
        }

        // ------------------------------------------------------------------
        // Text readout (1 Hz)
        // ------------------------------------------------------------------
        const el = id => document.getElementById(id);
        const timeEl = el('time'), stepsEl = el('steps'), ruleEl = el('steprule');
        const whereEl = el('where'), headEl = el('head'), placeEl = el('place');
        const quoteEl = el('quote'), citeEl = el('cite'), captionEl = el('caption');
        const feverLabel = el('fever-label');
        let shownHour = -1, shownBell = null;

        const CAPTION_WALK = '“…he knew indeed how many steps it was from the gate of his lodging house: exactly seven hundred and thirty.” <cite>Part I, Chapter I</cite>';
        const CAPTION_BELL = '“The bell gave a faint tinkle as though it were made of tin and not of copper.” <cite>Part I, Chapter I</cite>';

        function pad(n) { return String(n).padStart(2, '0'); }

        function updateText() {
            const now = new Date();
            const h = now.getHours();
            timeEl.innerHTML = `${pad(h)}:${pad(now.getMinutes())}<span class="sec">${pad(now.getSeconds())}</span>`;
            timeEl.setAttribute('aria-label', `${pad(h)}:${pad(now.getMinutes())}`);

            const step = Math.floor(stepAt(now));
            const atBell = step >= STEPS;
            stepsEl.innerHTML = atBell
                ? `Step <b>730</b> of 730, at the bell`
                : `Step <b>${step}</b> of 730, ${STEPS - step} to the bell`;
            ruleEl.style.width = (step / STEPS * 100).toFixed(2) + '%';

            if (atBell !== shownBell) {
                captionEl.innerHTML = atBell ? CAPTION_BELL : CAPTION_WALK;
                shownBell = atBell;
            }

            if (h !== shownHour) {
                const c = HOURS[h];
                whereEl.textContent = c.part === 'Epilogue' ? `Epilogue · ${c.chap}` : `${c.part} · ${c.chap}`;
                headEl.textContent = c.head;
                placeEl.textContent = c.place;
                quoteEl.innerHTML = c.q;
                citeEl.textContent = c.part === 'Epilogue' ? `Epilogue, ${c.chap}` : `${c.part}, ${c.chap}`;
                document.body.classList.toggle('siberia', !!c.siberia);
                shownHour = h;
                drawChart();
            }
            const fv = feverAt(now);
            document.body.classList.toggle('fever', fv >= 0.75);
            feverLabel.textContent = fv >= 0.9 ? 'Delirium' : fv >= 0.6 ? 'High fever' : fv >= 0.35 ? 'Feverish' : fv >= 0.15 ? 'Uneasy' : 'Fever broken';
        }

        // ------------------------------------------------------------------
        // Map geometry, in a 1000 x 680 box
        // ------------------------------------------------------------------
        const MW = 1000, MH = 680;

        const CANAL = [[-30, 300], [100, 285], [220, 300], [320, 350], [430, 368], [540, 332],
                       [640, 292], [740, 300], [840, 360], [920, 430], [1030, 470]];

        const BLOCKS = [
            [0, 40, 95, 250], [120, 205, 320, 262], [345, 30, 610, 238], [870, 30, 1000, 300],
            [0, 335, 170, 455], [320, 448, 560, 640], [600, 395, 800, 640], [830, 505, 1000, 640],
            [0, 610, 300, 680], [345, 272, 410, 318], [180, 330, 270, 420]
        ];
        const GARRET = [60, 480, 230, 590];
        const HOUSE = [640, 82, 850, 232];
        const COURT = [680, 140, 760, 215];
        const HAYMARKET = [120, 52, 320, 182];

        const PATH = [
            [232, 520], [300, 520], [300, 410], [420, 410],     // out of the gate, up the lane, along the embankment
            [432, 410], [442, 325],                             // K. bridge
            [540, 296], [640, 254], [705, 256],                 // along the canal
            [710, 215], [715, 175], [775, 175],                 // through the gateway and the courtyard
            [800, 168], [822, 156], [796, 145], [822, 134],     // the staircase, to the fourth storey
            [796, 123], [812, 112]
        ];
        const BELL = PATH[PATH.length - 1];

        // cumulative lengths for placing a step on the path
        const SEG = [];
        let PATH_LEN = 0;
        for (let i = 1; i < PATH.length; i++) {
            const d = Math.hypot(PATH[i][0] - PATH[i - 1][0], PATH[i][1] - PATH[i - 1][1]);
            SEG.push(d);
            PATH_LEN += d;
        }
        function pointAt(frac) {
            let d = Math.max(0, Math.min(1, frac)) * PATH_LEN;
            for (let i = 0; i < SEG.length; i++) {
                if (d <= SEG[i] || i === SEG.length - 1) {
                    const t = SEG[i] ? Math.min(1, d / SEG[i]) : 0;
                    const a = PATH[i], b = PATH[i + 1];
                    return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t,
                             ang: Math.atan2(b[1] - a[1], b[0] - a[0]), seg: i };
                }
                d -= SEG[i];
            }
        }
        function pathUpTo(frac) {
            const p = pointAt(frac);
            const pts = PATH.slice(0, p.seg + 1);
            pts.push([p.x, p.y]);
            return pts;
        }
        function pathFrom(frac) {
            const p = pointAt(frac);
            return [[p.x, p.y], ...PATH.slice(p.seg + 1)];
        }

        // ------------------------------------------------------------------
        // Map drawing
        // ------------------------------------------------------------------
        const map = el('map'), mctx = map.getContext('2d');
        let mw = 0, mh = 0, scale = 1, ox = 0, oy = 0;

        function resizeMap() {
            const dpr = window.devicePixelRatio || 1;
            const r = map.parentElement.getBoundingClientRect();
            mw = Math.max(1, r.width);
            mh = Math.max(1, r.height);
            map.style.width = mw + 'px';
            map.style.height = mh + 'px';
            map.width = Math.round(mw * dpr);
            map.height = Math.round(mh * dpr);
            mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            scale = Math.min(mw / MW, mh / MH);
            ox = (mw - MW * scale) / 2;
            oy = (mh - MH * scale) / 2;
            drawMap(performance.now());
        }

        // the fever bends the streets: a slow displacement field in map units
        let warpAmp = 0, warpT = 0;
        function warp(x, y) {
            if (warpAmp < 0.01) return [x, y];
            const dx = warpAmp * (Math.sin(y * 0.021 + warpT * 1.1) + 0.5 * Math.sin(y * 0.053 - warpT * 1.7 + x * 0.01));
            const dy = warpAmp * 0.7 * Math.sin(x * 0.018 + warpT * 0.9);
            return [x + dx, y + dy];
        }
        function toScreen(p) { const w = warp(p[0], p[1]); return [ox + w[0] * scale, oy + w[1] * scale]; }

        function polyline(pts, closed) {
            // subdivide so straight streets can bend
            mctx.beginPath();
            let first = true;
            const n = closed ? pts.length : pts.length - 1;
            for (let i = 0; i < n; i++) {
                const a = pts[i], b = pts[(i + 1) % pts.length];
                const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
                const k = warpAmp > 0.01 ? Math.max(1, Math.ceil(len / 18)) : 1;
                for (let j = first ? 0 : 1; j <= k; j++) {
                    const s = toScreen([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);
                    if (first) { mctx.moveTo(s[0], s[1]); first = false; } else mctx.lineTo(s[0], s[1]);
                }
            }
            if (closed) mctx.closePath();
        }
        function rectPts(r) { return [[r[0], r[1]], [r[2], r[1]], [r[2], r[3]], [r[0], r[3]]]; }

        function offsetLine(pts, d) {
            return pts.map((p, i) => {
                const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
                const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
                return [p[0] - dy / L * d, p[1] + dx / L * d];
            });
        }

        function label(text, x, y, opts = {}) {
            const s = toScreen([x, y]);
            const px = Math.max(10.5, Math.min(16, (opts.size || 15) * scale * 1.15));
            mctx.font = `${opts.italic ? 'italic ' : ''}${opts.bold ? '700 ' : ''}${px}px "PT Serif", Georgia, serif`;
            mctx.textAlign = opts.align || 'left';
            mctx.textBaseline = 'middle';
            mctx.fillStyle = opts.color;
            mctx.fillText(text, s[0], s[1] + (opts.line || 0) * px * 1.3);
        }

        function css(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }

        function drawLayer(c, frac, fv, now) {
            const lw = Math.max(0.8, scale * 1.2);

            // canal
            const north = offsetLine(CANAL, -17), south = offsetLine(CANAL, 17);
            polyline([...north, ...south.slice().reverse()], true);
            mctx.fillStyle = c.water;
            mctx.fill();
            mctx.lineWidth = lw;
            mctx.strokeStyle = c.line;
            polyline(north); mctx.stroke();
            polyline(south); mctx.stroke();

            // city blocks, hatched like an engraved plan
            for (const r of BLOCKS) {
                polyline(rectPts(r), true);
                mctx.fillStyle = c.block;
                mctx.fill();
                mctx.strokeStyle = c.lineDim;
                mctx.lineWidth = lw * 0.8;
                mctx.stroke();
            }

            // Hay Market, an open square
            polyline(rectPts(HAYMARKET), true);
            mctx.setLineDash([3 * scale + 1, 4 * scale + 1]);
            mctx.strokeStyle = c.lineDim;
            mctx.stroke();
            mctx.setLineDash([]);

            // the garret's house and the old woman's house
            for (const r of [GARRET, HOUSE]) {
                polyline(rectPts(r), true);
                mctx.fillStyle = c.house;
                mctx.fill();
                mctx.strokeStyle = c.line;
                mctx.lineWidth = lw * 1.3;
                mctx.stroke();
            }
            polyline(rectPts(COURT), true);
            mctx.fillStyle = 'rgba(0,0,0,0.18)';
            mctx.fill();
            mctx.strokeStyle = c.lineDim;
            mctx.lineWidth = lw * 0.8;
            mctx.stroke();

            // K. bridge
            polyline([[424, 400], [436, 336]]); mctx.strokeStyle = c.line; mctx.lineWidth = lw; mctx.stroke();
            polyline([[448, 403], [458, 338]]); mctx.stroke();

            // the road still to walk: dotted
            polyline(pathFrom(frac));
            mctx.setLineDash([2 * scale + 1, 5 * scale + 1]);
            mctx.strokeStyle = c.lineDim;
            mctx.lineWidth = lw * 1.2;
            mctx.stroke();
            mctx.setLineDash([]);

            // the road walked: a solid line with a footprint every ten steps
            if (frac > 0) {
                polyline(pathUpTo(frac));
                mctx.strokeStyle = c.walked;
                mctx.globalAlpha *= 0.55;
                mctx.lineWidth = lw * 1.6;
                mctx.stroke();
                mctx.globalAlpha /= 0.55;
                const done = Math.floor(frac * STEPS / 10);
                mctx.fillStyle = c.walked;
                for (let i = 1; i <= done; i++) {
                    const p = pointAt(i * 10 / STEPS);
                    const side = (i % 2 ? 1 : -1) * 4.5;
                    const s = toScreen([p.x - Math.sin(p.ang) * side, p.y + Math.cos(p.ang) * side]);
                    mctx.beginPath();
                    mctx.ellipse(s[0], s[1], Math.max(1.1, 2.4 * scale), Math.max(0.8, 1.5 * scale), p.ang, 0, Math.PI * 2);
                    mctx.fill();
                }
            }

            // the gate and the bell
            const g = toScreen(PATH[0]);
            mctx.fillStyle = c.line;
            mctx.fillRect(g[0] - 2.5 * scale - 1, g[1] - 9 * scale, 5 * scale + 2, 18 * scale);

            const b = toScreen(BELL);
            const atBell = frac >= 1;
            mctx.beginPath();
            mctx.arc(b[0], b[1], Math.max(3, 6 * scale), 0, Math.PI * 2);
            mctx.fillStyle = atBell ? c.walked : c.bg;
            mctx.fill();
            mctx.strokeStyle = c.walked;
            mctx.lineWidth = lw * 1.3;
            mctx.stroke();
            if (atBell) {
                const phase = reduceMotion.matches ? 0.5 : (now / 1400) % 1;
                for (let k = 0; k < 3; k++) {
                    const ph = (phase + k / 3) % 1;
                    mctx.beginPath();
                    mctx.arc(b[0], b[1], (8 + ph * 34) * scale + 2, -Math.PI * 0.9, -Math.PI * 0.1);
                    mctx.globalAlpha *= (1 - ph);
                    mctx.stroke();
                    mctx.globalAlpha /= Math.max(0.001, 1 - ph);
                }
            }

            // labels
            const L = c.label, LD = c.labelDim;
            label('S. Place', 145, 522, { color: L, align: 'center', bold: true, line: -0.5 });
            label('the garret', 145, 522, { color: LD, align: 'center', italic: true, line: 0.5 });
            label('K. bridge', 470, 372, { color: L, italic: true });
            label('the canal', 905, 395, { color: LD, italic: true, align: 'right' });
            label('Hay Market', 220, 117, { color: LD, align: 'center', italic: true });
            label('the old woman’s house', 745, 46, { color: L, align: 'center', bold: true, line: -0.5 });
            label('fourth storey, the bell', 745, 46, { color: LD, align: 'center', italic: true, line: 0.5 });
        }

        function drawMap(now) {
            const d = new Date();
            const fv = feverAt(d);
            const frac = stepAt(d) / STEPS;
            const siberia = document.body.classList.contains('siberia');

            mctx.clearRect(0, 0, mw, mh);

            const c = siberia ? {
                bg: '#16212a', water: 'rgba(110,150,180,0.20)', block: 'rgba(150,175,195,0.07)', house: 'rgba(150,175,195,0.14)',
                line: 'rgba(200,220,235,0.75)', lineDim: 'rgba(190,210,225,0.42)', walked: '#a9cdea',
                label: '#e4ecf2', labelDim: '#a9bccb'
            } : {
                bg: '#26231a', water: 'rgba(120,140,120,0.20)', block: 'rgba(214,196,150,0.07)', house: 'rgba(214,196,150,0.15)',
                line: 'rgba(232,220,190,0.75)', lineDim: 'rgba(222,206,170,0.42)',
                walked: fv > 0.7 ? '#f0886a' : '#e8a86e',
                label: '#efe6cf', labelDim: '#bfb293'
            };

            warpT = reduceMotion.matches ? 1.3 : now / 1000;
            warpAmp = Math.pow(fv, 1.6) * 16;

            // double vision at high fever: a reddish ghost of the plan, drifting
            if (fv > 0.45 && !siberia) {
                mctx.save();
                const shift = (fv - 0.45) * 14 * scale;
                const wob = reduceMotion.matches ? 0.6 : Math.sin(now / 900);
                mctx.translate(shift * wob, -shift * 0.5);
                mctx.globalAlpha = (fv - 0.45) * 0.55;
                drawLayer({ ...c, line: '#d05a3c', lineDim: '#b44a32', walked: '#d05a3c', label: 'rgba(0,0,0,0)', labelDim: 'rgba(0,0,0,0)',
                            water: 'rgba(0,0,0,0)', block: 'rgba(0,0,0,0)', house: 'rgba(0,0,0,0)', bg: 'rgba(0,0,0,0)' }, frac, fv, now);
                mctx.restore();
            }

            mctx.save();
            drawLayer(c, frac, fv, now);
            mctx.restore();

            // the walker
            const p = pointAt(frac);
            const s = toScreen([p.x, p.y]);
            const r = Math.max(4, 7 * scale);
            const glow = mctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r * 3.2);
            glow.addColorStop(0, siberia ? 'rgba(170,210,240,0.45)' : 'rgba(240,180,120,0.45)');
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            mctx.fillStyle = glow;
            mctx.beginPath(); mctx.arc(s[0], s[1], r * 3.2, 0, Math.PI * 2); mctx.fill();
            mctx.beginPath(); mctx.arc(s[0], s[1], r, 0, Math.PI * 2);
            mctx.fillStyle = siberia ? '#eef5fa' : '#f6ecd6';
            mctx.fill();
            mctx.lineWidth = Math.max(1.2, 2 * scale);
            mctx.strokeStyle = c.walked;
            mctx.stroke();

            // the heat: a red vignette that thickens with the fever
            if (fv > 0.2 && !siberia) {
                const v = mctx.createRadialGradient(mw / 2, mh / 2, Math.min(mw, mh) * 0.25, mw / 2, mh / 2, Math.max(mw, mh) * 0.75);
                v.addColorStop(0, 'rgba(0,0,0,0)');
                v.addColorStop(1, `rgba(150,50,25,${((fv - 0.2) * 0.45).toFixed(3)})`);
                mctx.fillStyle = v;
                mctx.fillRect(0, 0, mw, mh);
            }
        }

        // ------------------------------------------------------------------
        // Fever chart: 24 hours from 14:00, the novel's parts as bands
        // ------------------------------------------------------------------
        const chart = el('chart'), cctx = chart.getContext('2d');
        let cw = 0, ch = 0;

        function resizeChart() {
            const dpr = window.devicePixelRatio || 1;
            const r = chart.parentElement.getBoundingClientRect();
            cw = Math.max(1, r.width);
            ch = Math.max(1, r.height);
            chart.style.width = cw + 'px';
            chart.style.height = ch + 'px';
            chart.width = Math.round(cw * dpr);
            chart.height = Math.round(ch * dpr);
            cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawChart();
        }

        function drawChart() {
            if (!cw) return;
            const now = new Date();
            const siberiaNow = document.body.classList.contains('siberia');
            cctx.clearRect(0, 0, cw, ch);
            const top = 20, bottom = ch - 18, H = bottom - top;
            const x = i => (i / 24) * cw;
            const narrow = cw < 560;

            // part bands
            cctx.textBaseline = 'middle';
            cctx.font = `${narrow ? 11 : 12}px "PT Serif", Georgia, serif`;
            PARTS.forEach((p, i) => {
                const x0 = x(p.from - DAY_START), x1 = x(p.to - DAY_START);
                const ep = p.short === 'Ep.';
                cctx.fillStyle = ep ? `rgba(140,180,210,${i % 2 ? 0.10 : 0.07})` : `rgba(220,200,150,${i % 2 ? 0.09 : 0.05})`;
                cctx.fillRect(x0, top, x1 - x0, H);
                cctx.fillStyle = ep ? '#a9bfd0' : '#c3b796';
                cctx.textAlign = 'center';
                const text = (narrow || x1 - x0 < 70) ? p.short : p.label;
                cctx.fillText(text, (x0 + x1) / 2, 9);
                if (i) {
                    cctx.fillStyle = 'rgba(220,205,170,0.35)';
                    cctx.fillRect(Math.round(x0), top, 1, H);
                }
            });

            // fever curve (hourly readings at mid-hour, smoothed)
            const pts = [];
            for (let i = 0; i <= 24; i++) {
                const h = (DAY_START + Math.min(i, 23)) % 24;
                pts.push([x(i === 24 ? 24 : i + 0.5), bottom - HOURS[h].fever * (H - 6)]);
            }
            pts.unshift([0, bottom - HOURS[DAY_START].fever * (H - 6)]);
            pts[pts.length - 1][0] = cw;

            const line = new Path2D();
            line.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) {
                const a = pts[i - 1], b = pts[i], mx = (a[0] + b[0]) / 2;
                line.bezierCurveTo(mx, a[1], mx, b[1], b[0], b[1]);
            }
            const area = new Path2D(line);
            area.lineTo(cw, bottom);
            area.lineTo(0, bottom);
            area.closePath();
            const grad = cctx.createLinearGradient(0, top, 0, bottom);
            grad.addColorStop(0, 'rgba(226,106,74,0.55)');
            grad.addColorStop(1, 'rgba(226,106,74,0.04)');
            cctx.fillStyle = grad;
            cctx.fill(area);
            cctx.strokeStyle = '#e8865f';
            cctx.lineWidth = 1.6;
            cctx.stroke(line);

            // hour ticks
            cctx.fillStyle = '#a99f86';
            cctx.textAlign = 'center';
            cctx.font = `${narrow ? 10.5 : 11.5}px "PT Serif", Georgia, serif`;
            const every = cw < 420 ? 6 : cw < 760 ? 3 : 2;
            for (let i = 0; i < 24; i++) {
                const h = (DAY_START + i) % 24;
                cctx.fillStyle = 'rgba(220,205,170,0.35)';
                cctx.fillRect(Math.round(x(i)), bottom, 1, 4);
                if (i % every === 0) {
                    cctx.fillStyle = '#a99f86';
                    cctx.textAlign = i === 0 ? 'left' : 'center';
                    cctx.fillText(pad(h) + ':00', x(i) + (i === 0 ? 1 : 0), bottom + 11);
                }
            }

            // now
            const idx = bookIndex(now.getHours()) + (now.getMinutes() * 60 + now.getSeconds()) / 3600;
            const nx = x(idx);
            cctx.fillStyle = siberiaNow ? '#cfe3f2' : '#f6ecd6';
            cctx.fillRect(Math.round(nx) - 1, top - 2, 2, H + 4);
            const fy = bottom - feverAt(now) * (H - 6);
            cctx.beginPath();
            cctx.arc(nx, fy, 4.5, 0, Math.PI * 2);
            cctx.fill();
            cctx.strokeStyle = '#e26a4a';
            cctx.lineWidth = 2;
            cctx.stroke();
        }

        // ------------------------------------------------------------------
        // Loops
        // ------------------------------------------------------------------
        let rafId = null, slowId = null;

        function frame(t) {
            drawMap(t);
            rafId = requestAnimationFrame(frame);
        }

        function startLoops() {
            if (rafId) cancelAnimationFrame(rafId);
            if (slowId) clearInterval(slowId);
            rafId = slowId = null;
            if (reduceMotion.matches) {
                // hold the streets still; the walker still advances once a second
                drawMap(0);
                slowId = setInterval(() => drawMap(0), 1000);
            } else {
                rafId = requestAnimationFrame(frame);
            }
        }

        updateText();
        setInterval(() => {
            const before = shownHour;
            updateText();
            if (before === shownHour && new Date().getSeconds() % 10 === 0) drawChart();
        }, 1000);

        const ro = new ResizeObserver(() => { resizeMap(); resizeChart(); });
        ro.observe(map.parentElement);
        ro.observe(chart.parentElement);
        window.addEventListener('resize', () => { resizeMap(); resizeChart(); });
        if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', startLoops);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { resizeMap(); resizeChart(); });

        resizeMap();
        resizeChart();
        startLoops();
    </script>
</body>

</html>
