<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candide Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c99a2e;
            --gold-light: #e8c766;
            --ink: #2a2118;
            --ink-soft: #5a4a38;
            --paper: #fbf6e9;
            --sky1: #0b1026;
            --sky2: #1b2447;
            --ground: #3d3428;
            --sea: #23465e;
            --scene-h: min(54vh, 42vw);
            --garden-h: 120px;
            --route-h: clamp(40px, 6vh, 52px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            background: linear-gradient(to bottom, var(--sky1), var(--sky2));
            background-color: var(--sky2);
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            position: relative;
            font-family: 'EB Garamond', Georgia, serif;
            color: var(--ink);
        }

        /* ---------- the sky and the world ---------- */
        .stars {
            position: absolute; inset: 0;
            pointer-events: none;
            transition: opacity 2s;
        }
        .stars i {
            position: absolute; width: 2px; height: 2px; border-radius: 50%;
            background: #fff; opacity: .8;
        }
        .tint {
            position: absolute; inset: 0; pointer-events: none;
            transition: background 1.5s;
        }

        #world {
            position: absolute;
            left: 0; right: 0; top: 0;
            bottom: var(--garden-h);
            overflow: hidden;
            pointer-events: none;
        }

        .ground-band {
            position: absolute; left: 0; right: 0; bottom: 0;
            height: calc(var(--scene-h) * 0.075 + 1px);
            background: var(--ground);
        }

        .scene {
            position: absolute;
            bottom: 0; left: 50%;
            height: var(--scene-h);
            aspect-ratio: 1000 / 400;
            transform: translateX(-50%);
            overflow: visible;
        }
        .scene [class] { transform-box: fill-box; }

        /* full-width effect layers */
        .fx { position: absolute; inset: 0; pointer-events: none; }

        .fx-sea {
            top: auto; height: calc(var(--scene-h) * 0.22 + 1px);
            background: linear-gradient(to bottom, var(--sea), #0d2233);
        }
        .fx-sea::before {
            content: ''; position: absolute; left: 0; right: 0; top: -9px; height: 18px;
            background: radial-gradient(ellipse 30px 9px at 30px 9px, var(--sea) 98%, transparent 100%) 0 0 / 60px 18px repeat-x;
            animation: seaRoll 3s linear infinite;
        }
        .fx-sea.rough::before { animation-duration: 1.2s; top: -14px; height: 28px;
            background: radial-gradient(ellipse 40px 14px at 40px 14px, var(--sea) 98%, transparent 100%) 0 0 / 80px 28px repeat-x; }
        @keyframes seaRoll { to { background-position: 60px 0; } }

        .fx-snow {
            background-image:
                radial-gradient(2px 2px at 20px 30px, #fff 50%, transparent 51%),
                radial-gradient(3px 3px at 80px 120px, #fff 50%, transparent 51%),
                radial-gradient(2px 2px at 150px 60px, #fff 50%, transparent 51%),
                radial-gradient(3px 3px at 190px 170px, #fff 50%, transparent 51%),
                radial-gradient(2px 2px at 110px 190px, #fff 50%, transparent 51%);
            background-size: 210px 210px;
            animation: snowFall 9s linear infinite;
            opacity: .85;
        }
        @keyframes snowFall { to { background-position: 60px 210px; } }

        .fx-rain {
            background-image: repeating-linear-gradient(105deg, transparent 0 14px, rgba(200,215,235,.35) 14px 15px, transparent 15px 31px);
            background-size: 200px 200px;
            animation: rainFall .35s linear infinite;
        }
        @keyframes rainFall { to { background-position: -40px 200px; } }

        .fx-flash { background: #f4f6ff; opacity: 0; animation: lightning 6s infinite; }
        @keyframes lightning {
            0%, 61%, 100% { opacity: 0; }
            62% { opacity: .85; } 63% { opacity: .1; } 64% { opacity: .6; } 68% { opacity: 0; }
        }

        .fx-smoke {
            background:
                radial-gradient(ellipse 30% 18% at 30% 70%, rgba(40,32,30,.45), transparent 70%),
                radial-gradient(ellipse 35% 20% at 70% 60%, rgba(40,32,30,.4), transparent 70%),
                radial-gradient(ellipse 40% 22% at 50% 40%, rgba(60,50,45,.3), transparent 70%);
            animation: smokeDrift 14s ease-in-out infinite alternate;
        }
        @keyframes smokeDrift { from { transform: translateX(-4%); } to { transform: translateX(4%); } }

        .fx-pox { background-image:
                radial-gradient(circle at 12% 30%, rgba(170,40,50,.55) 0 7px, transparent 8px),
                radial-gradient(circle at 88% 22%, rgba(170,40,50,.5) 0 9px, transparent 10px),
                radial-gradient(circle at 6% 70%, rgba(140,150,40,.5) 0 6px, transparent 7px),
                radial-gradient(circle at 94% 62%, rgba(170,40,50,.5) 0 8px, transparent 9px),
                radial-gradient(circle at 20% 52%, rgba(140,150,40,.45) 0 5px, transparent 6px),
                radial-gradient(circle at 80% 45%, rgba(140,150,40,.45) 0 6px, transparent 7px);
            animation: poxThrob 3s ease-in-out infinite alternate;
        }
        @keyframes poxThrob { from { opacity: .55; } to { opacity: 1; } }

        .shaking { animation: quakeLoop 12s infinite; }

        /* ---------- shared scene motion ---------- */
        .flick { transform-origin: 50% 100%; animation: flick .45s ease-in-out infinite alternate; }
        .flick.b { animation-duration: .6s; animation-delay: -.2s; }
        .flick.c { animation-duration: .38s; animation-delay: -.1s; }
        @keyframes flick { from { transform: scale(1, 1) skewX(-3deg); } to { transform: scale(.9, 1.18) skewX(4deg); } }

        .puff { transform-origin: 50% 50%; animation: puff 5s linear infinite; opacity: .5; }
        @keyframes puff { from { transform: translate(0, 0) scale(.6); opacity: .7; } to { transform: translate(30px, -160px) scale(2.2); opacity: 0; } }

        /* Westphalie */
        .w-boot { transform-origin: 90% 10%; transform: rotate(-35deg); animation: bootKick 6s infinite; }
        @keyframes bootKick { 0%, 6% { transform: rotate(25deg); } 10% { transform: rotate(-40deg); } 20%, 100% { transform: rotate(-35deg); } }
        .w-fly { transform-origin: 50% 50%; transform: translate(110px, -150px) rotate(220deg); animation: fly 6s infinite; }
        @keyframes fly {
            0%, 9% { transform: translate(0, 0) rotate(0); opacity: 1; }
            20% { transform: translate(60px, -130px) rotate(150deg); }
            30% { transform: translate(120px, -160px) rotate(300deg); }
            42% { transform: translate(176px, -40px) rotate(480deg); }
            46% { transform: translate(186px, 16px) rotate(520deg); }
            80% { transform: translate(186px, 16px) rotate(520deg); opacity: 1; }
            90%, 100% { transform: translate(186px, 16px) rotate(520deg); opacity: 0; }
        }

        /* Bulgares */
        .b-ballL { animation: ballL 2.6s ease-in infinite; transform: translate(150px, -150px); }
        .b-ballR { animation: ballR 2.6s ease-in infinite; animation-delay: -1.3s; transform: translate(-150px, -150px); }
        @keyframes ballL { 0% { transform: translate(0, 0); opacity: 1; } 25% { transform: translate(60px, -120px); } 50% { transform: translate(130px, -160px); } 75% { transform: translate(195px, -120px); } 100% { transform: translate(250px, -20px); opacity: 1; } }
        @keyframes ballR { 0% { transform: translate(0, 0); opacity: 1; } 25% { transform: translate(-60px, -120px); } 50% { transform: translate(-130px, -160px); } 75% { transform: translate(-195px, -120px); } 100% { transform: translate(-250px, -20px); opacity: 1; } }
        .b-muzzle { transform-origin: 50% 50%; animation: muzzle 2.6s infinite; opacity: .9; }
        .b-muzzle.r { animation-delay: -1.3s; }
        @keyframes muzzle { 0% { transform: scale(1.4); opacity: 1; } 12% { transform: scale(.2); opacity: 0; } 100% { opacity: 0; } }
        .b-burst { transform-origin: 50% 50%; animation: burst 2.6s infinite; }
        .b-burst.r { animation-delay: -1.3s; }
        @keyframes burst { 0%, 95% { transform: scale(.1); opacity: 0; } 97% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
        .b-march { animation: march .5s steps(2) infinite; }
        @keyframes march { 50% { transform: translateY(-2px); } }

        /* Hollande */
        .h-sails { transform-origin: 50% 50%; animation: spin 9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .h-pus { transform-origin: 50% 50%; animation: pus 4s ease-out infinite; }
        @keyframes pus { 0% { transform: scale(0); } 20% { transform: scale(1.25); } 30%, 100% { transform: scale(1); } }
        .h-beggar { transform-origin: 50% 100%; animation: totter 2.4s ease-in-out infinite alternate; }
        @keyframes totter { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }

        /* Tempete */
        .t-ship { transform-origin: 50% 80%; transform: rotate(-12deg); animation: pitch 3.2s ease-in-out infinite alternate; }
        @keyframes pitch { from { transform: rotate(-16deg) translateY(4px); } to { transform: rotate(14deg) translateY(-6px); } }
        .t-mast { transform-origin: 50% 100%; transform: rotate(-58deg); animation: mastBreak 8s infinite; }
        @keyframes mastBreak { 0%, 40% { transform: rotate(0); } 46% { transform: rotate(-20deg); } 60%, 100% { transform: rotate(-58deg); } }
        .t-wave { animation: waveSlide 2.4s linear infinite; }
        .t-wave.back { animation-duration: 3.6s; animation-direction: reverse; }
        @keyframes waveSlide { to { transform: translateX(-100px); } }
        .t-fall { transform-origin: 50% 50%; transform: translate(40px, 120px) rotate(160deg); animation: overboard 8s infinite; }
        .t-bolt { opacity: 0; animation: lightning 6s infinite; }
        @keyframes overboard { 0%, 50% { transform: translate(0, 0); opacity: 1; } 62% { transform: translate(30px, 60px) rotate(120deg); } 70% { transform: translate(40px, 120px) rotate(170deg); opacity: 1; } 76%, 100% { transform: translate(40px, 140px) rotate(180deg); opacity: 0; } }

        /* Lisbonne */
        @keyframes quakeLoop {
            0%, 8%, 48%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-6px, 3px) rotate(-.4deg); } 12% { transform: translate(7px, -2px) rotate(.5deg); }
            14% { transform: translate(-8px, 1px); } 16% { transform: translate(6px, 4px) rotate(-.6deg); }
            18% { transform: translate(-5px, -3px) rotate(.4deg); } 20% { transform: translate(8px, 2px); }
            22% { transform: translate(-7px, 3px) rotate(.5deg); } 24% { transform: translate(5px, -2px) rotate(-.4deg); }
            27% { transform: translate(-6px, 2px); } 30% { transform: translate(7px, -3px) rotate(.3deg); }
            33% { transform: translate(-5px, 3px); } 36% { transform: translate(4px, -1px); }
            40% { transform: translate(-3px, 2px); } 44% { transform: translate(2px, -1px); }
        }
        .l-house { transform-origin: 50% 100%; }
        .l-fall1 { transform: rotate(-14deg) translateY(30px); animation: fall1 12s infinite; }
        .l-fall2 { transform: rotate(11deg) translateY(40px); animation: fall2 12s infinite; }
        .l-fall3 { transform: translateY(70px) scaleY(.4); animation: fall3 12s infinite; }
        @keyframes fall1 { 0%, 20% { transform: none; } 30%, 92% { transform: rotate(-14deg) translateY(30px); } 100% { transform: none; } }
        @keyframes fall2 { 0%, 26% { transform: none; } 36%, 92% { transform: rotate(11deg) translateY(40px); } 100% { transform: none; } }
        @keyframes fall3 { 0%, 30% { transform: none; } 38%, 92% { transform: translateY(70px) scaleY(.4); } 100% { transform: none; } }
        .l-fire { transform-origin: 50% 100%; animation: fireIn 12s infinite; }
        @keyframes fireIn { 0%, 4% { transform: scale(.5); } 12%, 92% { transform: scale(1); } 100% { transform: scale(.5); } }
        .l-wave { transform: translateX(-200px); animation: tsunami 12s infinite; }
        @keyframes tsunami { 0%, 48% { transform: translateX(-1100px); } 70% { transform: translateX(-200px); } 82% { transform: translateX(80px); opacity: 1; } 92%, 100% { transform: translateX(200px); opacity: 0; } }
        .l-dust { transform-origin: 50% 100%; animation: dust 12s infinite; opacity: .55; }
        @keyframes dust { 0%, 22% { opacity: 0; transform: scale(.4); } 40% { opacity: .7; transform: scale(1.1); } 70% { opacity: .4; transform: scale(1.4); } 85%, 100% { opacity: 0; transform: scale(1.6); } }

        /* Auto-da-fe */
        .a-swing { transform-origin: 50% 0; animation: swing 3s ease-in-out infinite alternate; }
        @keyframes swing { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
        .a-flog { transform-origin: 90% 90%; animation: flog .8s ease-in-out infinite alternate; }
        @keyframes flog { from { transform: rotate(-30deg); } to { transform: rotate(40deg); } }
        .a-crowd { animation: sway 1.6s ease-in-out infinite alternate; }
        @keyframes sway { to { transform: translateX(4px); } }

        /* Paraguay */
        .p-bubble { transform-origin: 50% 50%; animation: bubble 1.8s ease-in infinite; }
        @keyframes bubble { 0% { transform: translateY(0) scale(.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-40px) scale(1.2); opacity: 0; } }
        .p-dance { animation: dance .7s ease-in-out infinite alternate; }
        .p-dance.b { animation-delay: -.35s; }
        @keyframes dance { from { transform: translateY(0); } to { transform: translateY(-14px); } }
        .p-arrow { transform: translateX(300px); animation: arrow 2.2s linear infinite; }
        .p-arrow.b { animation-delay: -1.1s; animation-duration: 2.6s; }
        @keyframes arrow { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }

        /* Eldorado */
        .e-sheep { animation: sheepLost 15s linear infinite; }
        @keyframes sheepLost {
            0% { transform: translate(0, 0); opacity: 0; }
            4% { opacity: 1; }
            78% { transform: translate(380px, 0) rotate(0); }
            84% { transform: translate(408px, 40px) rotate(40deg); }
            100% { transform: translate(430px, 260px) rotate(130deg); opacity: 0; }
        }
        .e-glint { transform-origin: 50% 50%; animation: glint 2.4s ease-in-out infinite alternate; }
        @keyframes glint { from { opacity: .3; transform: scale(.6); } to { opacity: 1; transform: scale(1.1); } }

        /* Surinam */
        .s-ship { transform-origin: 50% 90%; transform: translate(150px, 40px) rotate(18deg); animation: sink 14s infinite; }
        @keyframes sink {
            0% { transform: translate(-120px, 0) rotate(0); opacity: 1; }
            40% { transform: translate(60px, 0) rotate(-2deg); }
            55% { transform: translate(100px, 4px) rotate(4deg); }
            80% { transform: translate(150px, 70px) rotate(22deg); opacity: 1; }
            90%, 100% { transform: translate(160px, 130px) rotate(30deg); opacity: 0; }
        }
        .s-fire { transform-origin: 50% 100%; animation: sFire 14s infinite; }
        @keyframes sFire { 0%, 45% { transform: scale(0); } 52%, 82% { transform: scale(1); } 90%, 100% { transform: scale(0); } }
        .s-flash { transform-origin: 50% 50%; animation: sFlash 14s infinite; }
        @keyframes sFlash { 0%, 40% { opacity: 0; transform: scale(.2); } 42% { opacity: 1; transform: scale(1.3); } 46%, 100% { opacity: 0; transform: scale(.2); } }
        .s-float { animation: bob 1.6s ease-in-out infinite alternate, floatIn 14s infinite; }
        @keyframes bob { from { translate: 0 0; } to { translate: 0 -5px; } }
        @keyframes floatIn { 0%, 82% { opacity: 0; transform: translateX(0); } 88% { opacity: 1; } 100% { opacity: 1; transform: translateX(-60px); } }

        /* Paris */
        .pa-coin { transform-origin: 50% 50%; animation: fleece 4s ease-in infinite; }
        @keyframes fleece { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), -150px) scale(1); opacity: 0; } }
        .pa-card { transform-origin: 50% 50%; animation: cardFly 3s ease-out infinite; }
        @keyframes cardFly { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--dx), -90px) rotate(260deg); opacity: 0; } }

        /* Portsmouth */
        .po-flash { transform-origin: 0% 50%; animation: volley 5s infinite; }
        @keyframes volley { 0%, 58% { opacity: 0; transform: scale(.2); } 60% { opacity: 1; transform: scale(1.3); } 66%, 100% { opacity: 0; transform: scale(.4); } }
        .po-smoke { transform-origin: 0% 50%; animation: volleySmoke 5s infinite; }
        @keyframes volleySmoke { 0%, 59% { opacity: 0; transform: scale(.3); } 64% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: translate(-20px, -40px) scale(2.2); } }
        .po-admiral { transform-origin: 50% 100%; transform: rotate(80deg); animation: shot 5s infinite; }
        @keyframes shot { 0%, 60% { transform: rotate(0); } 66%, 92% { transform: rotate(82deg); } 100% { transform: rotate(0); } }
        .po-ship { animation: roll 4s ease-in-out infinite alternate; transform-origin: 50% 90%; }
        @keyframes roll { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }

        /* Venise */
        .v-crown { transform-origin: 50% 100%; animation: crownOff 12s infinite; }
        @keyframes crownOff {
            0%, 10% { transform: translate(0, 0) rotate(0); opacity: 1; }
            14% { transform: translate(6px, -22px) rotate(30deg); }
            30% { transform: translate(30px, 120px) rotate(200deg); opacity: 1; }
            34%, 92% { transform: translate(30px, 130px) rotate(200deg); opacity: 0; }
            100% { transform: translate(0, 0); opacity: 1; }
        }
        .v-gondola { transform-origin: 50% 50%; animation: roll 2.8s ease-in-out infinite alternate; }
        .v-fw { transform-origin: 50% 50%; animation: firework 3.4s ease-out infinite; }
        @keyframes firework { 0%, 40% { transform: scale(0); opacity: 0; } 45% { opacity: 1; } 80% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.15); opacity: 0; } }

        /* Jardin */
        .j-hoe { transform-origin: 50% 100%; animation: hoe 2.2s ease-in-out infinite; }
        @keyframes hoe { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(14deg); } 60% { transform: rotate(-4deg); } }
        .j-smoke { transform-origin: 50% 100%; animation: puff 7s linear infinite; }

        /* ---------- the garden ---------- */
        #garden {
            position: absolute; left: 0; bottom: 0;
            width: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .motto {
            position: absolute; left: 0; right: 0;
            bottom: clamp(6px, 1.4vh, 14px);
            z-index: 8;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(0.78rem, 1.7vw, 1.15rem);
            letter-spacing: .08em;
            padding: 0 16px;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.6);
        }
        .motto .done { color: #fdf3d2; }
        .motto .todo { color: rgba(253,243,210,.32); }
        .motto .gloss { display: block; font-family: 'EB Garamond', serif; font-style: italic; font-weight: 400;
            letter-spacing: 0; font-size: clamp(.78rem, 1.3vw, .95rem); color: #f1e4c0; margin-top: 2px; }

        /* ---------- route across the top ---------- */
        .route {
            position: absolute; top: 0; left: 0; right: 0;
            height: var(--route-h);
            z-index: 12;
            background: linear-gradient(to bottom, rgba(20,14,8,.78), rgba(20,14,8,.55));
            border-bottom: 1px solid rgba(232,199,102,.45);
            --route-pad: clamp(10px, 2vw, 28px);
            padding: 0 var(--route-pad);
        }
        .route ol {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            height: 100%;
            position: relative;
        }
        .route ol::before {
            content: ''; position: absolute; left: calc(100% / 26); right: calc(100% / 26);
            top: 34%; height: 1px; background: rgba(232,199,102,.5);
        }
        .route li {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start;
            padding-top: calc(var(--route-h) * .34 - 4px);
            min-width: 0;
        }
        .route .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #2a2118; border: 1px solid var(--gold-light);
            position: relative; z-index: 1;
        }
        .route li.past .dot { background: var(--gold); }
        .route li.now .dot { background: var(--gold-light); box-shadow: 0 0 0 3px rgba(232,199,102,.35); }
        .route .lbl {
            font-family: 'Cinzel', serif; font-weight: 600;
            font-size: clamp(8.5px, .8vw, 11.5px);
            color: rgba(246,234,200,.72);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; max-width: 100%;
        }
        .route li.now .lbl { color: #ffe9a8; }
        .route .marker {
            position: absolute; top: calc(var(--route-h) * .34 - 9px);
            width: 0; height: 0;
            border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-top: 7px solid #ff7a5c;
            transform: translateX(-6px);
            z-index: 2;
            transition: left 1s linear;
        }

        /* ---------- HUD: Pangloss's card and the chapter caption ---------- */
        .hud {
            position: absolute;
            top: calc(var(--route-h) + clamp(10px, 2.2vh, 24px));
            left: clamp(12px, 2.5vw, 36px); right: clamp(12px, 2.5vw, 36px);
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .card {
            position: relative;
            width: clamp(280px, 34vw, 430px);
            background: var(--paper);
            border: 5px solid var(--gold);
            border-radius: 12px;
            padding: clamp(12px, 2vh, 20px) clamp(16px, 2.2vw, 28px) clamp(12px, 1.8vh, 18px);
            text-align: center;
            box-shadow: 0 16px 34px rgba(0,0,0,.45);
            pointer-events: auto;
        }
        .card::after {
            content: ''; position: absolute; inset: 4px;
            border: 1.5px solid var(--gold); border-radius: 6px; pointer-events: none;
        }
        .card .who {
            font-family: 'Cinzel', serif; font-weight: 600;
            font-size: clamp(.62rem, .9vw, .74rem);
            letter-spacing: .14em; text-transform: uppercase;
            color: var(--ink-soft);
        }
        .card .time {
            font-family: 'Cinzel', serif; font-weight: 700;
            font-size: clamp(2.3rem, 5vw, 4rem);
            line-height: 1.1;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
            margin: 2px 0 0;
        }
        .card .best {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.45rem, 2.4vw, 2rem);
            line-height: 1.05;
            color: #7a5410;
        }
        .card .also {
            font-style: italic;
            font-size: clamp(.92rem, 1.25vw, 1.06rem);
            color: var(--ink-soft);
            margin-top: 2px;
        }
        .card .also b { font-style: normal; font-weight: 500; color: #8f2a14; }
        .card .doctrine {
            margin-top: clamp(6px, 1vh, 10px);
            padding-top: clamp(6px, 1vh, 9px);
            border-top: 1px solid rgba(201,154,46,.5);
            font-size: clamp(.95rem, 1.3vw, 1.1rem);
            color: var(--ink);
        }
        .card .doctrine span { display: block; font-style: italic; font-size: .85em; color: var(--ink-soft); }

        .caption {
            width: clamp(260px, 30vw, 400px);
            background: rgba(251,246,233,.93);
            border-left: 4px solid #a2321c;
            border-radius: 4px;
            padding: 10px 14px 11px;
            box-shadow: 0 10px 24px rgba(0,0,0,.35);
            pointer-events: auto;
        }
        .caption .ch {
            font-family: 'Cinzel', serif; font-weight: 600;
            font-size: clamp(.62rem, .85vw, .72rem);
            letter-spacing: .1em; text-transform: uppercase;
            color: #8f2a14;
        }
        .caption .place {
            font-family: 'Cinzel', serif; font-weight: 700;
            font-size: clamp(1.05rem, 1.6vw, 1.35rem);
            color: var(--ink); line-height: 1.15; margin: 1px 0 4px;
        }
        .caption .ev { font-size: clamp(.92rem, 1.15vw, 1.02rem); line-height: 1.3; color: var(--ink); }
        .caption .q { margin-top: 6px; font-size: clamp(.95rem, 1.2vw, 1.06rem); line-height: 1.3; color: #3b2b1a; }
        .caption .q i { display: block; font-size: .88em; color: var(--ink-soft); }
        .caption .next {
            margin-top: 6px; font-size: .82rem; color: var(--ink-soft);
            font-variant-numeric: tabular-nums;
        }

        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        @media (max-width: 980px) {
            .route .lbl { display: none; }
            .route li.now .lbl {
                display: block; position: absolute; top: calc(var(--route-h) * .34 + 8px);
                max-width: none; overflow: visible; font-size: 11px;
            }
            .route li.now:first-child .lbl { left: 0; }
            .route li.now:last-child .lbl { right: 0; }
            .hud { flex-direction: column; align-items: center; gap: 10px; }
            .card { width: min(100%, 420px); }
            .caption { width: min(100%, 420px); }
        }
        @media (max-width: 980px) and (min-height: 700px) {
            :root { --scene-h: min(34vh, 62vw); }
        }
        @media (max-width: 700px) {
            :root { --scene-h: min(30vh, 62vw); }
            .scene { aspect-ratio: 520 / 340; }
            .card .doctrine span, .caption .q i { font-size: .82em; }
            .caption { padding: 8px 12px 9px; }
            .caption .next { display: none; }
        }
        @media (max-height: 620px) {
            .caption .q { display: none; }
            .card .doctrine { display: none; }
        }

        /* The disasters are decoration: with reduced motion they hold one telling pose. */
        @media (prefers-reduced-motion: reduce) {
            #world *, #world *::before, #world *::after, .shaking { animation: none !important; }
            .fx-flash { opacity: 0; }
            .route .marker { transition: none; }
        }
    </style>
</head>

        /* ------------------------------------------------------------------
           Sky colour through the day
           ------------------------------------------------------------------ */
        const SKY = [
            [0, '#0b1026', '#1d2a50'], [300, '#141c3c', '#2a3462'], [370, '#47507e', '#e59a7a'],
            [430, '#7fa9d6', '#f4d0a4'], [540, '#6fb0e2', '#cfe7f5'], [960, '#78b2df', '#d9ecf5'],
            [1080, '#5f7fb8', '#f2b07a'], [1140, '#3c3f78', '#e47f5c'], [1200, '#1f2552', '#5a4a7a'],
            [1290, '#0d1330', '#202a52'], [1440, '#0b1026', '#1d2a50']
        ];
        const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
        const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
        function skyAt(m) {
            for (let i = 0; i < SKY.length - 1; i++) {
                const [t0, a0, b0] = SKY[i], [t1, a1, b1] = SKY[i + 1];
                if (m >= t0 && m < t1) { const t = (m - t0) / (t1 - t0); return [mix(a0, a1, t), mix(b0, b1, t)]; }
            }
            return [SKY[0][1], SKY[0][2]];
        }
        function nightness(m) {
            if (m < 330 || m >= 1230) return 1;
            if (m < 420) return 1 - (m - 330) / 90;
            if (m >= 1140) return (m - 1140) / 90;
            return 0;
        }

        /* ------------------------------------------------------------------
           DOM setup
           ------------------------------------------------------------------ */
        const $ = id => document.getElementById(id);
        const root = document.documentElement;
        const world = $('world'), tint = $('tint'), stars = $('stars');
        const routeList = $('routeList'), marker = $('marker');
        const timeEl = $('time'), alsoEl = $('also'), doctrineEl = $('doctrine');
        const capCh = $('capCh'), capPlace = $('capPlace'), capEv = $('capEv'), capQ = $('capQ'), capNext = $('capNext');
        const motto = $('motto');

        routeList.innerHTML = STATIONS.map(s => `<li title="${s.label}, from ${fmt(s.start)}"><span class="dot"></span><span class="lbl">${s.label}</span></li>`).join('');
        const routeItems = Array.from(routeList.children);

        (function makeStars() {
            let seed = 30;
            const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
            let html = '';
            for (let i = 0; i < 90; i++) html += `<i style="left:${(r() * 100).toFixed(2)}%;top:${(r() * 70).toFixed(2)}%;opacity:${(.3 + r() * .7).toFixed(2)}"></i>`;

        })();

        function fmt(mins) {
            const h = Math.floor(mins / 60) % 24, m = Math.floor(mins % 60);
            return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
        }
        const pad = n => String(n).padStart(2, '0');

        function stationIndex(m) {
            for (let i = STATIONS.length - 1; i >= 0; i--) if (m >= STATIONS[i].start) return i;
            return 0;
        }

        let currentKey = null;
        let narrow = null;
        function buildScene(s) {
            const fx = (FX[s.key] || []).map(c => `<div class="fx ${c}"></div>`).join('');
            const ground = s.ground ? `<div class="ground-band" style="background:${s.ground}"></div>` : '';
            world.innerHTML = `${fx}${ground}<svg class="scene" viewBox="${narrow ? '240 60 520 340' : '0 0 1000 400'}" preserveAspectRatio="xMidYMax meet">${SCENES[s.key]()}</svg>`;
            if (s.sea) root.style.setProperty('--sea', s.sea);
            tint.style.background = TINT[s.key] || 'none';
        }

        function setText(el, html) { if (el.innerHTML !== html) el.innerHTML = html; }

        function updateStation(i, m) {
            const s = STATIONS[i];
            const wasNarrow = narrow;
            narrow = window.innerWidth <= 700;
            if (s.key !== currentKey || wasNarrow !== narrow) {
                currentKey = s.key;
                buildScene(s);
                capCh.textContent = s.ch;
                capPlace.textContent = s.place;
                capEv.textContent = s.ev;
                capQ.innerHTML = s.q ? `${s.q}<i>${s.gl}</i>` : '';
                capQ.style.display = s.q ? '' : 'none';
                alsoEl.innerHTML = `and the best of all possible <b>${s.best}</b>`;
                if (s.key === 'jardin') {
                    doctrineEl.innerHTML = '« Tous les événements sont enchaînés dans le meilleur des mondes possibles »<span>all events are linked in the best of all possible worlds</span>';
                } else {
                    doctrineEl.innerHTML = '« tout est au mieux »<span>all is for the best</span>';
                }
                routeItems.forEach((li, k) => {
                    li.classList.toggle('past', k < i);
                    li.classList.toggle('now', k === i);
                    if (k === i) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
                });
            }
            const nxt = STATIONS[i + 1];
            setText(capNext, nxt ? `Next: ${nxt.label} at ${fmt(nxt.start)}` : 'Until midnight, when Westphalie begins again');
            // from this stop's dot towards the next; the garden only edges a little way on
            const frac = (m - s.start) / (s.end - s.start);
            const x = (i + 0.5 + frac * (nxt ? 1 : 0.4)) / STATIONS.length;
            marker.style.left = `calc(var(--route-pad) + (100% - 2 * var(--route-pad)) * ${x.toFixed(5)})`;
        }

        /* ------------------------------------------------------------------
           The garden: seeded so the same plant always sprouts at the same
           minute. It fills slowly through the day and comes into its own
           once the travels are over at 18:30.
           ------------------------------------------------------------------ */
        const canvas = $('garden');
        const ctx = canvas.getContext('2d');
        let W = 0, GH = 0, CH = 0, VH = 0;
        let plants = [], trees = [];

        function gardenHeightFor(m) {
            const day = Math.min(1, m / GARDEN_DONE);
            const evening = Math.max(0, Math.min(1, (m - GARDEN_DONE) / 150));
            const frac = 0.10 + 0.14 * day + (W < 700 ? 0.07 : 0.12) * evening;
            return Math.round(Math.max(70, VH * frac));
        }

        function rng(seed) {
            return function () {
                seed |= 0; seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function seedGarden() {
            const r = rng(1759);
            plants = [];
            const unit = Math.max(26, Math.min(44, W / 34));
            const ROWS = 4;
            for (let row = 0; row < ROWS; row++) {
                const scale = 0.62 + row * 0.16;
                const step = unit * scale;
                const n = Math.ceil(W / step) + 1;
                const off = r() * step;
                for (let i = 0; i < n; i++) {
                    const tr = r();
                    const type = tr < .3 ? 'chou' : tr < .5 ? 'salade' : tr < .7 ? 'fleur' : tr < .85 ? 'ble' : 'haricot';
                    plants.push({
                        row, scale, type,
                        x: off + i * step + (r() - .5) * step * .3,
                        sprout: r() * (GARDEN_DONE - 140),
                        hue: Math.floor(r() * 5),
                        phase: r() * Math.PI * 2
                    });
                }
            }
            trees = [];
            const nt = Math.max(3, Math.round(W / 220));
            const kinds = ['orange', 'citron', 'pistache'];
            for (let i = 0; i < nt; i++) {
                trees.push({
                    x: (i + .5) * W / nt + (r() - .5) * 40,
                    kind: kinds[i % 3],
                    sprout: GARDEN_DONE + (i / nt) * 160,
                    phase: r() * Math.PI * 2
                });
            }
        }

        function resize() {
            VH = window.innerHeight;
            W = window.innerWidth;
            seedGarden();
            sizeGarden(nowMinutes());
            currentKey = null;      // rebuild the scene (viewBox may change)
            tick();
        }

        function sizeGarden(m) {
            const gh = gardenHeightFor(m);
            if (gh === GH && canvas.width) return;
            GH = gh;
            CH = Math.round(GH * 1.6);           // headroom above the soil for tall plants and trees
            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = W + 'px';
            canvas.style.height = CH + 'px';
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(CH * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            root.style.setProperty('--garden-h', (GH - 2) + 'px');
        }

        const FLOWERS = ['#e8506a', '#f4a62a', '#f6e04a', '#9a5ad0', '#ff7a4a'];

        function drawGarden(m, t) {
            const soilTop = CH - GH;
            ctx.clearRect(0, 0, W, CH);

            // soil
            const g = ctx.createLinearGradient(0, soilTop, 0, CH);
            g.addColorStop(0, '#5b4128'); g.addColorStop(1, '#2e2014');
            ctx.fillStyle = g;
            ctx.fillRect(0, soilTop, W, GH);
            // grass lip
            ctx.fillStyle = '#4f6b2a';
            ctx.fillRect(0, soilTop - 3, W, 6);

            const rowY = row => soilTop + GH * (0.16 + row * 0.15);
            // furrows
            ctx.strokeStyle = 'rgba(30,18,8,.55)';
            for (let row = 0; row < 4; row++) {
                ctx.lineWidth = 2 + row;
                ctx.beginPath(); ctx.moveTo(0, rowY(row) + 3); ctx.lineTo(W, rowY(row) + 3); ctx.stroke();
            }

            const sway = reduceMotion.matches ? 0 : 1;

            // trees behind, in the evening
            trees.forEach(tr => {
                const gr = Math.max(0, Math.min(1, (m - tr.sprout) / 120));
                if (gr <= 0) return;
                const base = rowY(0) - 2;
                const h = GH * 0.95 * gr;
                const lean = sway * Math.sin(t / 1800 + tr.phase) * 2 * gr;
                ctx.strokeStyle = '#4a3020'; ctx.lineWidth = 3 + 4 * gr;
                ctx.beginPath(); ctx.moveTo(tr.x, base); ctx.lineTo(tr.x + lean, base - h); ctx.stroke();
                const rad = GH * 0.32 * gr;
                ctx.fillStyle = tr.kind === 'pistache' ? '#6a8a3a' : '#2f6a2a';
                ctx.beginPath(); ctx.arc(tr.x + lean, base - h, rad, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,.08)';
                ctx.beginPath(); ctx.arc(tr.x + lean - rad * .3, base - h - rad * .3, rad * .55, 0, Math.PI * 2); ctx.fill();
                if (gr > .6) {
                    ctx.fillStyle = tr.kind === 'orange' ? '#f39a1e' : tr.kind === 'citron' ? '#f3e04a' : '#b9c86a';
                    for (let k = 0; k < 7; k++) {
                        const a = tr.phase + k * 2.4, rr = rad * (.35 + (k % 3) * .2);
                        ctx.beginPath(); ctx.arc(tr.x + lean + Math.cos(a) * rr, base - h + Math.sin(a) * rr, Math.max(2, rad * .12), 0, Math.PI * 2); ctx.fill();
                    }
                }
            });

            // rows, far to near
            const unitH = GH * 0.22;
            for (let row = 0; row < 4; row++) {
                const y = rowY(row);
                for (const p of plants) {
                    if (p.row !== row) continue;
                    const gr = Math.max(0, Math.min(1, (m - p.sprout) / 140));
                    if (gr <= 0) continue;
                    const s = unitH * p.scale * (0.25 + 0.75 * gr);
                    const wob = sway * Math.sin(t / 900 + p.phase) * 0.08 * gr;
                    drawPlant(p, p.x, y, s, gr, wob);
                }
            }
        }

        function drawPlant(p, x, y, s, gr, wob) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(wob);
            switch (p.type) {
                case 'chou': {
                    ctx.fillStyle = '#5f9a4a';
                    ctx.beginPath(); ctx.ellipse(0, -s * .32, s * .55, s * .36, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#8cc46a';
                    ctx.beginPath(); ctx.ellipse(0, -s * .38, s * .32, s * .22, 0, 0, Math.PI * 2); ctx.fill();
                    break;
                }
                case 'salade': {
                    ctx.fillStyle = '#9ad05a';
                    for (let k = -2; k <= 2; k++) {
                        ctx.beginPath(); ctx.ellipse(k * s * .14, -s * .3, s * .14, s * .32, k * .35, 0, Math.PI * 2); ctx.fill();
                    }
                    break;
                }
                case 'fleur': {
                    ctx.strokeStyle = '#4a7a2a'; ctx.lineWidth = Math.max(1.2, s * .07);
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -s * 1.1); ctx.stroke();
                    ctx.fillStyle = '#5a8a3a';
                    ctx.beginPath(); ctx.ellipse(s * .14, -s * .45, s * .16, s * .07, -.5, 0, Math.PI * 2); ctx.fill();
                    if (gr > .55) {
                        ctx.fillStyle = FLOWERS[p.hue];
                        const pr = s * .17 * Math.min(1, (gr - .55) / .3);
                        for (let k = 0; k < 5; k++) {
                            const a = k / 5 * Math.PI * 2;
                            ctx.beginPath(); ctx.arc(Math.cos(a) * pr, -s * 1.1 + Math.sin(a) * pr, pr * .8, 0, Math.PI * 2); ctx.fill();
                        }
                        ctx.fillStyle = '#fff2b0';
                        ctx.beginPath(); ctx.arc(0, -s * 1.1, pr * .5, 0, Math.PI * 2); ctx.fill();
                    }
                    break;
                }
                case 'ble': {
                    ctx.strokeStyle = gr > .8 ? '#d8b04a' : '#8ab04a'; ctx.lineWidth = Math.max(1, s * .05);
                    for (let k = -2; k <= 2; k++) {
                        ctx.beginPath(); ctx.moveTo(k * s * .05, 0); ctx.quadraticCurveTo(k * s * .1, -s * .6, k * s * .18, -s * 1.15); ctx.stroke();
                    }
                    break;
                }
                case 'haricot': {
                    ctx.strokeStyle = '#7a5a3a'; ctx.lineWidth = Math.max(1.2, s * .06);
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -s * 1.5); ctx.stroke();
                    ctx.fillStyle = '#4f8a3a';
                    const n = Math.floor(2 + gr * 5);
                    for (let k = 0; k < n; k++) {
                        const yy = -s * (.15 + k * .22);
                        ctx.beginPath(); ctx.ellipse((k % 2 ? 1 : -1) * s * .14, yy, s * .14, s * .08, (k % 2 ? -.4 : .4), 0, Math.PI * 2); ctx.fill();
                    }
                    break;
                }
            }
            ctx.restore();
        }

        /* the garden line, earned letter by letter through the day */
        const MOTTO = 'il faut cultiver notre jardin';
        function updateMotto(m) {
            if (m >= GARDEN_DONE) {
                setText(motto, `<span class="done">« Cela est bien dit, répondit Candide, mais il faut cultiver notre jardin. »</span><span class="gloss">That is well said, answered Candide, but we must cultivate our garden.</span>`);
                return;
            }
            const n = Math.floor(MOTTO.length * m / GARDEN_DONE);
            setText(motto, `<span class="done">${MOTTO.slice(0, n)}</span><span class="todo">${MOTTO.slice(n)}</span><span class="gloss">we must cultivate our garden, a few letters at a time until 18:30</span>`);
        }

        /* ------------------------------------------------------------------
           Clock
           ------------------------------------------------------------------ */
        function nowMinutes() {
            const d = new Date();
            return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
        }

        function tick() {
            const d = new Date();
            const m = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
            timeEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            const i = stationIndex(m);
            updateStation(i, m);
            const [s1, s2] = skyAt(m);
            root.style.setProperty('--sky1', s1);
            root.style.setProperty('--sky2', s2);
            stars.style.opacity = nightness(m).toFixed(2);
            sizeGarden(m);
            updateMotto(m);
            if (reduceMotion.matches || !animating) drawGarden(m, 0);
        }

        let animating = false;
        function frame(t) {
            if (reduceMotion.matches) { animating = false; tick(); return; }
            drawGarden(nowMinutes(), t);
            requestAnimationFrame(frame);
        }
        function startLoop() {
            if (!reduceMotion.matches && !animating) { animating = true; requestAnimationFrame(frame); }
        }

        window.addEventListener('resize', resize);
        if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', () => { tick(); startLoop(); });

        resize();
        setInterval(tick, 1000);
        startLoop();
    })();
    </script>
</body>
</html>
