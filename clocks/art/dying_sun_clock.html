<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dying Sun</title>
    <meta name="description" content="After Jack Vance's Dying Earth: a huge, dim red sun crosses a dark-blue sky to tell the hour, faltering at intervals, with a tally of today's falterings.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ground: #05060b;
            --ink: #f0dccb;
            --ink-soft: #cdbfb4;
            --ink-dim: #a6a3b8;
            --ember: #e0654f;
            --rule: rgba(224, 101, 79, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--ground);
        }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: var(--ink);
            overflow: hidden;
            min-height: 100vh;
            min-height: 100svh;
        }

        #sky {
            position: fixed;
            inset: 0;
            display: block;
            z-index: 0;
        }

        .panel {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            padding: clamp(0.9rem, 2.6vh, 1.8rem) 16px clamp(0.7rem, 2vh, 1.3rem);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(0.25rem, 1vh, 0.55rem);
        }

        .phase {
            font-size: clamp(1.05rem, 2.4vw, 1.45rem);
            font-style: italic;
            color: var(--ink-soft);
            min-height: 1.3em;
            transition: color 0.6s ease;
        }

        .phase.faltering { color: var(--ember); }

        .time {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(2.6rem, 8vw, 4.8rem);
            line-height: 1;
            letter-spacing: 0.06em;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        .time .sec {
            font-size: 0.42em;
            color: var(--ink-dim);
            margin-left: 0.25em;
            letter-spacing: 0.04em;
        }

        .date {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.78rem, 1.6vw, 0.95rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-dim);
        }

        .rule {
            width: min(320px, 70vw);
            height: 1px;
            background: linear-gradient(to right, transparent, var(--rule), transparent);
            margin: clamp(0.15rem, 0.8vh, 0.4rem) 0;
        }

        .count {
            font-size: clamp(1.05rem, 2.3vw, 1.35rem);
            color: var(--ink);
        }

        .count strong {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            color: var(--ember);
            font-size: 1.15em;
        }

        .last {
            font-size: clamp(0.95rem, 2vw, 1.12rem);
            color: var(--ink-soft);
            min-height: 1.2em;
        }

        .tally {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 12px;
            max-width: min(720px, 100%);
            min-height: 18px;
        }

        .tally .grp {
            position: relative;
            display: inline-flex;
            gap: 3px;
            height: 16px;
            align-items: stretch;
        }

        .tally .m {
            width: 2px;
            background: var(--ink-dim);
            border-radius: 1px;
        }

        .tally .m.grave { background: var(--ember); }

        .tally .grp.full::after {
            content: "";
            position: absolute;
            left: -3px;
            right: -3px;
            top: 50%;
            height: 2px;
            background: var(--ink-dim);
            transform: rotate(-28deg);
            border-radius: 1px;
        }

        .tally .grp.full.grave::after { background: var(--ember); }

        .tally .none {
            font-style: italic;
            color: var(--ink-dim);
            font-size: 0.95rem;
        }

        .foot {
            margin-top: clamp(0.2rem, 1vh, 0.6rem);
            font-size: clamp(0.85rem, 1.6vw, 0.98rem);
            color: var(--ink-dim);
            max-width: 46rem;
            line-height: 1.35;
        }

        .foot em { color: var(--ink-soft); }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        @media (max-height: 560px) {
            .foot, .tally { display: none; }
        }
    </style>
</head>

<body>
    <canvas id="sky" role="img" aria-label="A huge dim red sun crossing a dark blue sky; its place on the arc tells the hour"></canvas>

    <main class="panel" id="panel">
        <div class="phase" id="phase"></div>
        <div class="time" id="time" role="timer" aria-label="Current time">--:--<span class="sec">--</span></div>
        <div class="date" id="date"></div>
        <div class="rule" aria-hidden="true"></div>
        <div class="count" id="count"></div>
        <div class="tally" id="tally" aria-hidden="true"></div>
        <div class="last" id="last"></div>
        <p class="foot">After Jack Vance, <em>The Dying Earth</em> and its sequels, where the sun is old and red and everyone wonders whether it will last the day. Here it rises at six and sets at six; its place on the arc is the hour. At irregular intervals it falters, and the clock keeps count.</p>
        <div class="sr" id="announce" aria-live="polite"></div>
    </main>

    <script>
        const canvas = document.getElementById('sky');
        const ctx = canvas.getContext('2d');
        const panel = document.getElementById('panel');
        const phaseEl = document.getElementById('phase');
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');
        const countEl = document.getElementById('count');
        const tallyEl = document.getElementById('tally');
        const lastEl = document.getElementById('last');
        const announceEl = document.getElementById('announce');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        // ---------- seeded randomness ----------
        function mulberry32(a) {
            return function () {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        // ---------- the day's falterings ----------
        // A deterministic schedule per calendar day: gaps of 8 to 36 minutes,
        // each falter lasting a few seconds, and one long, deep falter per day.
        let schedule = null;
        function buildSchedule(d) {
            const key = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
            const rnd = mulberry32(key * 2654435761);
            const ev = [];
            let t = 0;
            while (true) {
                t += 480 + rnd() * 1680;
                if (t >= 86390) break;
                ev.push({ t: Math.floor(t), dur: 2.5 + rnd() * 4.5, sev: 0.35 + rnd() * 0.5, seed: rnd() * 1000, grave: false });
            }
            // the long falter always comes by daylight, when it can be seen
            const lit = ev.map((e, i) => i).filter(i => ev[i].t > 8 * 3600 && ev[i].t < 17 * 3600);
            const g = lit[Math.floor(rnd() * lit.length)];
            ev[g].grave = true; ev[g].dur = 14; ev[g].sev = 0.97;
            return { key, ev };
        }

        // ---------- layout ----------
        let W = 0, H = 0, horizon = 0, R = 0, cx = 0, Ax = 0, Ay = 0, topPad = 0;
        let skyline = [];
        let stars = [];

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            horizon = Math.round(panel.getBoundingClientRect().top);
            if (horizon < H * 0.4) horizon = Math.round(H * 0.4);
            const skyH = horizon;
            R = Math.max(40, Math.min(W * 0.2, skyH * 0.27));
            topPad = Math.max(34, skyH * 0.1);
            cx = W / 2;
            Ax = W / 2 - R * 0.35;
            Ay = horizon - topPad - R;

            // ruined skyline along the horizon, regenerated for each width
            const rnd = mulberry32(1950);
            skyline = [];
            let x = -10;
            const base = Math.min(H * 0.03, 26);
            while (x < W + 20) {
                const roll = rnd();
                if (roll < 0.07) {
                    // a broken tower
                    const tw = 8 + rnd() * 16, th = base * (1.6 + rnd() * 2.4);
                    skyline.push([x, horizon - base * 0.3]);
                    skyline.push([x, horizon - th]);
                    skyline.push([x + tw * 0.4, horizon - th * (0.85 + rnd() * 0.25)]);
                    skyline.push([x + tw, horizon - th * (0.7 + rnd() * 0.2)]);
                    skyline.push([x + tw, horizon - base * 0.3]);
                    x += tw;
                } else {
                    x += 10 + rnd() * 26;
                    skyline.push([x, horizon - base * (0.1 + rnd() * 0.7)]);
                }
            }

            const sr = mulberry32(1966);
            stars = [];
            const n = Math.round(W * horizon / 5200);
            for (let i = 0; i < n; i++) {
                stars.push({ x: sr() * W, y: sr() * horizon * 0.95, r: 0.4 + sr() * 1.1, a: 0.3 + sr() * 0.7, p: sr() * 6.28 });
            }
            draw(performance.now());
        }

        // ---------- colour helpers ----------
        function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
        function rgb(c, al) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al === undefined ? 1 : al})`; }
        const clamp01 = v => Math.max(0, Math.min(1, v));

        // ---------- state ----------
        function secondsOfDay(d) {
            return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
        }

        function currentFalter(s) {
            for (const e of schedule.ev) {
                if (e.t > s) break;
                if (s < e.t + e.dur) return e;
            }
            return null;
        }

        // brightness of the sun right now: 1 is its usual dim self
        function brightness(s, smooth) {
            const e = currentFalter(s);
            if (!e) return { b: 1, e: null };
            const u = (s - e.t) / e.dur;
            // drop fast, hang, recover slowly
            const env = u < 0.12 ? u / 0.12 : u > 0.6 ? (1 - u) / 0.4 : 1;
            let flick = 1;
            if (!smooth) {
                const k = s * 9 + e.seed;
                flick = 0.55 + 0.45 * Math.abs(Math.sin(k) * Math.sin(k * 2.71 + 1.3) + 0.3 * Math.sin(k * 7.3));
                flick = clamp01(flick);
            }
            return { b: clamp01(1 - e.sev * env * flick), e };
        }

        // ---------- drawing ----------
        function draw(nowMs) {
            if (!W) return;
            const d = new Date();
            if (!schedule || schedule.key !== d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) schedule = buildSchedule(d);
            const s = secondsOfDay(d);
            const { b } = brightness(s, reduceMotion.matches);

            const day = s >= 21600 && s < 64800;
            let sx, sy, alt, nightMarker = null;
            const fs = Math.max(11, Math.min(15, W / 70));
            if (day) {
                const th = (s - 21600) / 43200 * Math.PI;
                sx = cx - Math.cos(th) * Ax;
                sy = horizon - Math.sin(th) * Ay;
                alt = Math.sin(th);
            } else {
                const p = ((s - 64800 + 86400) % 86400) / 43200; // 0 at dusk, 1 at dawn
                sx = cx + Math.cos(Math.PI * p) * Ax;
                sy = horizon + R * 1.2;
                alt = -Math.sin(Math.PI * p);
            }
            const lit = clamp01(day ? 0.35 + 0.65 * Math.sqrt(alt) : 0.3 * (1 + alt * 1.0) ** 3) * (0.25 + 0.75 * b);

            // sky
            const nightTop = [3, 5, 14], dayTop = [14, 26, 64];
            const nightLow = [7, 10, 26], dayLow = [34, 38, 86];
            const haze = [92, 26, 34];
            const lowT = day ? (1 - alt) ** 2 : clamp01(1 + alt * 1.6);
            const top = mix(nightTop, dayTop, lit);
            let low = mix(nightLow, dayLow, lit);
            low = mix(low, haze, lowT * 0.55 * (0.3 + 0.7 * lit));
            const g = ctx.createLinearGradient(0, 0, 0, horizon);
            g.addColorStop(0, rgb(top));
            g.addColorStop(1, rgb(low));
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, horizon + 2);

            // stars: faint even by day under this sun
            const starA = clamp01(1 - lit * 1.1) * 0.85 + 0.12;
            const tw = reduceMotion.matches ? 0 : nowMs / 1000;
            for (const st of stars) {
                const dist = Math.hypot(st.x - sx, st.y - sy);
                const near = day ? clamp01((dist - R * 1.2) / (R * 2)) : 1;
                const a = st.a * starA * near * (0.75 + 0.25 * Math.sin(tw * 1.3 + st.p)) * (1.15 - 0.15 * b);
                if (a < 0.02) continue;
                ctx.fillStyle = `rgba(220,226,255,${a})`;
                ctx.beginPath();
                ctx.arc(st.x, st.y, st.r, 0, 6.283);
                ctx.fill();
            }

            // the sun's path, with a dot for every hour
            ctx.save();
            ctx.setLineDash([2, 7]);
            ctx.strokeStyle = 'rgba(170,180,220,0.22)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(cx, horizon, Ax, Ay, 0, Math.PI, 2 * Math.PI);
            ctx.stroke();
            ctx.restore();
            for (let h = 6; h <= 18; h++) {
                const th = (h - 6) / 12 * Math.PI;
                const px = cx - Math.cos(th) * Ax, py = horizon - Math.sin(th) * Ay;
                const major = h % 3 === 0;
                ctx.fillStyle = major ? 'rgba(190,198,232,0.55)' : 'rgba(170,180,220,0.3)';
                ctx.beginPath();
                ctx.arc(px, py, major ? 2.2 : 1.4, 0, 6.283);
                ctx.fill();
            }

            if (day) {
                // light of the sun on the sky
                const glowR = R * 4.2;
                const gl = ctx.createRadialGradient(sx, sy, R * 0.8, sx, sy, glowR);
                gl.addColorStop(0, `rgba(170,40,40,${0.42 * b})`);
                gl.addColorStop(0.35, `rgba(120,28,44,${0.18 * b})`);
                gl.addColorStop(1, 'rgba(60,20,50,0)');
                ctx.fillStyle = gl;
                ctx.fillRect(0, 0, W, horizon);
                drawSun(sx, sy, R, b, s);
            } else {
                // under the earth, the sun's glow shows where it lies
                const strength = clamp01((1 + alt) ** 2.2);
                const gx = sx;
                const eg = ctx.createRadialGradient(gx, horizon, 0, gx, horizon, R * 4);
                eg.addColorStop(0, `rgba(150,36,36,${(0.08 + 0.5 * strength) * (0.3 + 0.7 * b)})`);
                eg.addColorStop(1, 'rgba(60,15,30,0)');
                ctx.fillStyle = eg;
                ctx.fillRect(0, 0, W, horizon);
                nightMarker = gx;
                if (strength > 0.85) drawSun(sx, horizon + R * (1 - (strength - 0.85) / 0.15 * 0.25), R, b, s);
            }

            // ground and ruins, lit along their edge by the sun
            ctx.fillStyle = '#05060b';
            ctx.beginPath();
            ctx.moveTo(-10, H + 10);
            ctx.lineTo(-10, horizon);
            for (const [x, y] of skyline) ctx.lineTo(x, y);
            ctx.lineTo(W + 20, horizon);
            ctx.lineTo(W + 20, H + 10);
            ctx.closePath();
            ctx.fill();
            const rim = 0.08 + 0.35 * lit;
            const rg = ctx.createLinearGradient(0, horizon - 4, 0, horizon + 60);
            rg.addColorStop(0, `rgba(120,30,34,${rim * 0.5})`);
            rg.addColorStop(1, 'rgba(5,6,11,0)');
            ctx.fillStyle = rg;
            ctx.fillRect(0, horizon, W, 60);
            ctx.strokeStyle = `rgba(200,70,60,${rim})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-10, horizon);
            for (const [x, y] of skyline) ctx.lineTo(x, y);
            ctx.lineTo(W + 20, horizon);
            ctx.stroke();

            // hour labels last, with a dark halo, so the disc never hides them
            ctx.font = `600 ${fs}px Cinzel, serif`;
            ctx.textBaseline = 'middle';
            ctx.lineJoin = 'round';
            for (let h = 6; h <= 18; h += 3) {
                const th = (h - 6) / 12 * Math.PI;
                const label = String(h).padStart(2, '0') + ':00';
                let lx, ly;
                if (h === 6 || h === 18) {
                    ly = horizon - fs * 2.2;
                    ctx.textAlign = h === 6 ? 'left' : 'right';
                    lx = h === 6 ? 10 : W - 10;
                } else {
                    // set outside the sun's track
                    const ox = -Math.cos(th) * (Ax + R + fs * 1.4), oy = -Math.sin(th) * (Ay + R + fs * 1.1);
                    lx = Math.max(30, Math.min(W - 30, cx + ox));
                    ly = Math.max(fs, horizon + oy);
                    ctx.textAlign = 'center';
                }
                ctx.strokeStyle = 'rgba(4,6,16,0.75)';
                ctx.lineWidth = 4;
                ctx.strokeText(label, lx, ly);
                ctx.fillStyle = 'rgba(200,208,238,0.85)';
                ctx.fillText(label, lx, ly);
            }

            if (nightMarker !== null) {
                const gx = nightMarker;
                // a marker on the rim: the sun's place beneath the earth
                ctx.fillStyle = `rgba(224,101,79,${0.55 + 0.35 * b})`;
                ctx.beginPath();
                ctx.moveTo(gx, horizon - 3);
                ctx.lineTo(gx - 6, horizon - 13);
                ctx.lineTo(gx + 6, horizon - 13);
                ctx.closePath();
                ctx.fill();
                ctx.font = `italic 500 ${fs + 2}px 'Cormorant Garamond', serif`;
                ctx.textAlign = gx < 90 ? 'left' : gx > W - 90 ? 'right' : 'center';
                ctx.fillStyle = 'rgba(224,170,150,0.85)';
                ctx.fillText('the sun, beneath', Math.max(8, Math.min(W - 8, gx)), horizon - 13 - fs * 3.8);
            }

            // the whole world dims a little with the sun
            if (b < 1) {
                ctx.fillStyle = `rgba(0,0,6,${(1 - b) * 0.35})`;
                ctx.fillRect(0, 0, W, horizon);
            }
        }

        function drawSun(x, y, r, b, s) {
            ctx.save();
            // corona
            const co = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 1.6);
            co.addColorStop(0, `rgba(190,50,40,${0.35 * b})`);
            co.addColorStop(1, 'rgba(120,20,30,0)');
            ctx.fillStyle = co;
            ctx.beginPath();
            ctx.arc(x, y, r * 1.6, 0, 6.283);
            ctx.fill();

            // disc, limb-darkened, never bright
            const core = mix([60, 10, 16], [178, 48, 36], b);
            const mid = mix([40, 6, 12], [138, 26, 30], b);
            const limb = mix([22, 4, 10], [78, 12, 22], b);
            const dg = ctx.createRadialGradient(x - r * 0.15, y - r * 0.15, r * 0.05, x, y, r);
            dg.addColorStop(0, rgb(core));
            dg.addColorStop(0.6, rgb(mid));
            dg.addColorStop(1, rgb(limb));
            ctx.fillStyle = dg;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, 6.283);
            ctx.fill();

            // spots, turning slowly with the day
            ctx.clip();
            const rot = s / 86400 * 6.283 * 2;
            const rnd = mulberry32(42);
            for (let i = 0; i < 9; i++) {
                const a0 = rnd() * 6.283 + rot * (0.6 + rnd() * 0.4);
                const lat = (rnd() - 0.5) * 1.2;
                const px = x + Math.cos(a0) * r * 0.85;
                const py = y + lat * r;
                const vis = Math.sin(a0 + 1.57);
                const sr = r * (0.05 + rnd() * 0.11);
                const sg = ctx.createRadialGradient(px, py, 0, px, py, sr);
                sg.addColorStop(0, `rgba(24,3,8,${0.5 + 0.2 * Math.abs(vis)})`);
                sg.addColorStop(0.55, 'rgba(40,6,12,0.35)');
                sg.addColorStop(1, 'rgba(40,6,12,0)');
                ctx.fillStyle = sg;
                ctx.beginPath();
                ctx.ellipse(px, py, sr * (0.45 + 0.55 * Math.abs(Math.sin(a0))), sr, 0, 0, 6.283);
                ctx.fill();
            }
            ctx.restore();
        }

        // ---------- text, once a second ----------
        let lastFalterKey = null;
        function hm(t) {
            const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60);
            return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
        }

        function phaseText(s) {
            const h = s / 3600;
            if (h >= 6 && h < 6.5) return 'The sun drags itself over the eastern rim';
            if (h >= 6.5 && h < 9) return 'The sun hangs low in the east';
            if (h >= 9 && h < 11.5) return 'The sun climbs, slowly, as if it were tired';
            if (h >= 11.5 && h < 12.5) return 'The sun is at its height, such as it is';
            if (h >= 12.5 && h < 15) return 'The sun begins its long decline';
            if (h >= 15 && h < 17.5) return 'The sun leans toward the west';
            if (h >= 17.5 && h < 18) return 'The sun sinks into the western ruins';
            if (h >= 18 && h < 21) return 'The sun is down; its glow lingers in the west';
            if (h >= 21 || h < 3) return 'The sun is under the earth. Will it come back?';
            return 'A first glow in the east, so the sun still lives';
        }

        function updateText() {
            const d = new Date();
            if (!schedule || schedule.key !== d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) schedule = buildSchedule(d);
            const s = secondsOfDay(d);
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');
            timeEl.innerHTML = `${hh}:${mm}<span class="sec">${ss}</span>`;
            dateEl.textContent = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;

            const past = schedule.ev.filter(e => e.t <= s);
            const n = past.length;
            const cur = currentFalter(s);

            if (cur) {
                phaseEl.textContent = cur.grave ? 'The sun gutters almost to nothing…' : 'The sun falters…';
                phaseEl.classList.add('faltering');
                if (lastFalterKey !== cur.t) {
                    lastFalterKey = cur.t;
                    announceEl.textContent = cur.grave ? 'The sun has nearly gone out.' : 'The sun is faltering.';
                }
            } else {
                phaseEl.textContent = phaseText(s);
                phaseEl.classList.remove('faltering');
            }

            countEl.innerHTML = n === 0
                ? 'The sun has not yet faltered today'
                : `The sun has faltered <strong>${n}</strong> ${n === 1 ? 'time' : 'times'} since midnight`;

            // tally marks, in fives
            const graveIdx = past.findIndex(e => e.grave);
            const key = n + ':' + graveIdx;
            if (tallyEl.dataset.key !== key) {
                tallyEl.dataset.key = key;
                let html = '';
                for (let i = 0; i < n; i += 5) {
                    const k = Math.min(5, n - i);
                    let marks = '';
                    for (let j = 0; j < Math.min(k, 4); j++) marks += `<span class="m${graveIdx === i + j ? ' grave' : ''}"></span>`;
                    html += `<span class="grp${k === 5 ? ' full' : ''}${k === 5 && graveIdx === i + 4 ? ' grave' : ''}">${marks}</span>`;
                }
                tallyEl.innerHTML = html;
            }

            if (n === 0) {
                lastEl.textContent = 'It may come at any moment.';
            } else {
                const last = past[n - 1];
                const ago = Math.floor((s - last.t) / 60);
                let txt = cur ? `Faltering now, since ${hm(last.t)}.` : `Last at ${hm(last.t)}, ${ago < 1 ? 'moments' : ago === 1 ? 'a minute' : ago + ' minutes'} ago.`;
                const grave = past.find(e => e.grave);
                if (grave && !(cur && cur.grave)) txt += ` It all but went out at ${hm(grave.t)}.`;
                lastEl.textContent = txt;
            }

            const prevTop = horizon;
            const top = Math.round(panel.getBoundingClientRect().top);
            if (Math.abs(top - prevTop) > 1 && top >= H * 0.4) resize();
            if (reduceMotion.matches) draw(performance.now());
        }

        function loop(t) {
            draw(t);
            if (!reduceMotion.matches) requestAnimationFrame(loop);
        }

        reduceMotion.addEventListener('change', () => { if (!reduceMotion.matches) requestAnimationFrame(loop); });
        window.addEventListener('resize', resize);
        updateText();
        resize();
        setInterval(updateText, 1000);
        requestAnimationFrame(loop);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    </script>
</body>

</html>
