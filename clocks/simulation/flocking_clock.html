<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flocking Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .overlay {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        #digitalTime {
            top: clamp(12px, 2.5vh, 24px);
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(1.1rem, 4vw, 1.6rem);
            letter-spacing: 0.06em;
            opacity: 0.75;
        }

        .modes {
            bottom: clamp(12px, 3vh, 28px);
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .modes button {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.65rem, 2.2vw, 0.78rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            padding: 7px 14px;
            cursor: pointer;
            transition: color 0.15s, background 0.15s, border-color 0.15s;
        }

        .modes button:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }

        .modes button.active {
            color: #000;
            background: #fff;
            border-color: #fff;
        }

        .hint {
            bottom: clamp(52px, 9vh, 74px);
            font-size: clamp(0.6rem, 2vw, 0.72rem);
            color: rgba(255, 255, 255, 0.35);
            max-width: 90vw;
        }

        @media (prefers-reduced-motion: reduce) {
            .modes button {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="flockingCanvas" aria-hidden="true"></canvas>
    <div class="overlay" id="digitalTime" role="timer" aria-label="Current time"></div>
    <div class="overlay hint" id="hint"></div>
    <nav class="overlay modes" id="modes" aria-label="Simulation mode"></nav>

    <script>
        function Grad(x, y, z, w) { this.x = x; this.y = y; this.z = z || 0; this.w = w || 0; }
        var SimplexNoise = function() {
            var grad3 = [new Grad(1,1,0),new Grad(-1,1,0),new Grad(1,-1,0),new Grad(-1,-1,0), new Grad(1,0,1),new Grad(-1,0,1),new Grad(1,0,-1),new Grad(-1,0,-1), new Grad(0,1,1),new Grad(0,-1,1),new Grad(0,1,-1),new Grad(0,-1,-1)];
            var p = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190, 6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168, 68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54, 65,25,63,161, 1,216,80,73,209,76,132,187,208, 89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186, 3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152, 2,44,154,163, 70,221,153,101,155,167, 43,172,9,129,22,39,253, 19,98,108,110,79,113,224,232,178,185, 112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241, 81,51,145,235,249,14,239,107,49,192,214, 31,181,199,106,157,184, 84,204,176,115,121,50,45,127, 4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
            var perm = new Array(512), gradP = new Array(512);
            for(var i=0; i<512; i++) { perm[i] = p[i & 255]; gradP[i] = grad3[perm[i] % 12]; }
            var F3 = 1.0/3.0, G3 = 1.0/6.0;
            function fastfloor(x) { return (x>0 ? ~~x : ~~x - 1); }
            function dot3(g, x, y, z) { return g.x*x + g.y*y + g.z*z; }
            this.noise3D = function(xin, yin, zin) {
                var n0, n1, n2, n3;
                var s = (xin+yin+zin)*F3;
                var i = fastfloor(xin+s), j = fastfloor(yin+s), k = fastfloor(zin+s);
                var t = (i+j+k)*G3;
                var X0 = i-t, Y0 = j-t, Z0 = k-t;
                var x0 = xin-X0, y0 = yin-Y0, z0 = zin-Z0;
                var i1, j1, k1, i2, j2, k2;
                if(x0>=y0) { if(y0>=z0) { i1=1; j1=0; k1=0; i2=1; j2=1; k2=0; } else if(x0>=z0) { i1=1; j1=0; k1=0; i2=1; j2=0; k2=1; } else { i1=0; j1=0; k1=1; i2=1; j2=0; k2=1; } }
                else { if(y0<z0) { i1=0; j1=0; k1=1; i2=0; j2=1; k2=1; } else if(x0<z0) { i1=0; j1=1; k1=0; i2=0; j2=1; k2=1; } else { i1=0; j1=1; k1=0; i2=1; j2=1; k2=0; } }
                var x1 = x0 - i1 + G3, y1 = y0 - j1 + G3, z1 = z0 - k1 + G3;
                var x2 = x0 - i2 + 2.0*G3, y2 = y0 - j2 + 2.0*G3, z2 = z0 - k2 + 2.0*G3;
                var x3 = x0 - 1.0 + 3.0*G3, y3 = y0 - 1.0 + 3.0*G3, z3 = z0 - 1.0 + 3.0*G3;
                var ii = i & 255, jj = j & 255, kk = k & 255;
                var t0 = 0.6 - x0*x0 - y0*y0 - z0*z0;
                if(t0<0) n0 = 0.0; else { t0 *= t0; n0 = t0 * t0 * dot3(gradP[ii+perm[jj+perm[kk]]], x0, y0, z0); }
                var t1 = 0.6 - x1*x1 - y1*y1 - z1*z1;
                if(t1<0) n1 = 0.0; else { t1 *= t1; n1 = t1 * t1 * dot3(gradP[ii+i1+perm[jj+j1+perm[kk+k1]]], x1, y1, z1); }
                var t2 = 0.6 - x2*x2 - y2*y2 - z2*z2;
                if(t2<0) n2 = 0.0; else { t2 *= t2; n2 = t2 * t2 * dot3(gradP[ii+i2+perm[jj+j2+perm[kk+k2]]], x2, y2, z2); }
                var t3 = 0.6 - x3*x3 - y3*y3 - z3*z3;
                if(t3<0) n3 = 0.0; else { t3 *= t3; n3 = t3 * t3 * dot3(gradP[ii+1+perm[jj+1+perm[kk+1]]], x3, y3, z3); }
                return 32.0 * (n0 + n1 + n2 + n3);
            };
        };

        const noise = new SimplexNoise();

        // One flock, four ways of disturbing it. Each mode keeps the time mapping
        // it had when these were four separate files; the shared boid code, the
        // noise field and the dial are defined once here.
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        const canvas = document.getElementById('flockingCanvas');
        const ctx = canvas.getContext('2d');
        const digitalTimeElement = document.getElementById('digitalTime');
        const hintElement = document.getElementById('hint');
        const modesElement = document.getElementById('modes');

        let width, height;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Vector {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }
            add(v) { this.x += v.x; this.y += v.y; return this; }
            sub(v) { this.x -= v.x; this.y -= v.y; return this; }
            mult(s) { this.x *= s; this.y *= s; return this; }
            div(s) { this.x /= s; this.y /= s; return this; }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            normalize() { const mag = this.mag(); if (mag > 0) this.div(mag); return this; }
            limit(max) { if (this.mag() > max) this.normalize().mult(max); return this; }
            static sub(v1, v2) { return new Vector(v1.x - v2.x, v1.y - v2.y); }
        }

        class Boid {
            constructor() {
                this.reset();
                this.acceleration = new Vector(0, 0);
            }

            reset() {
                this.position = new Vector(Math.random() * width, Math.random() * height);
                this.velocity = new Vector(Math.random() * 2 - 1, Math.random() * 2 - 1);
            }

            applyForce(force) {
                this.acceleration.add(force);
            }

            flock(boids, cohesionFactor, maxSpeed) {
                let separation = new Vector(0, 0);
                let alignment = new Vector(0, 0);
                let cohesion = new Vector(0, 0);
                const perceptionRadius = 50;
                const separationRadius = 25;
                let total = 0;

                for (const other of boids) {
                    if (other === this) continue;
                    const d = Vector.sub(this.position, other.position).mag();
                    if (d > 0 && d < perceptionRadius) {
                        alignment.add(other.velocity);
                        cohesion.add(other.position);
                        if (d < separationRadius) {
                            const diff = Vector.sub(this.position, other.position);
                            diff.div(d * d); // Weight by distance
                            separation.add(diff);
                        }
                        total++;
                    }
                }

                if (total > 0) {
                    alignment.div(total).normalize().mult(maxSpeed);
                    alignment.sub(this.velocity).limit(0.2);

                    cohesion.div(total);
                    cohesion.sub(this.position).normalize().mult(maxSpeed);
                    cohesion.sub(this.velocity).limit(0.1 * cohesionFactor);

                    separation.div(total).normalize().mult(maxSpeed);
                    separation.sub(this.velocity).limit(0.3);
                }

                this.applyForce(separation);
                this.applyForce(alignment);
                this.applyForce(cohesion);
            }

            seek(target) {
                const desired = Vector.sub(target, this.position).normalize().mult(5);
                const steer = Vector.sub(desired, this.velocity).limit(0.05);
                this.applyForce(steer);
            }

            // Ride the noise field; the hour sets how hard it pulls.
            follow(time, hourStrength) {
                const noiseAngle = noise.noise3D(this.position.x * 0.001, this.position.y * 0.001, time) * Math.PI * 2;
                const desired = new Vector(Math.cos(noiseAngle), Math.sin(noiseAngle));
                desired.mult(5 * hourStrength);
                const steer = Vector.sub(desired, this.velocity).limit(0.1);
                this.applyForce(steer);
            }

            avoid(obstacles) {
                const steer = new Vector(0, 0);
                let count = 0;
                for (const obs of obstacles) {
                    const d = Vector.sub(this.position, obs.position).mag();
                    if (d < obs.radius + 50) {
                        const diff = Vector.sub(this.position, obs.position);
                        diff.normalize().div(d);
                        steer.add(diff);
                        count++;
                    }
                }
                if (count > 0) {
                    steer.div(count).normalize().mult(5).sub(this.velocity).limit(0.5);
                }
                return steer;
            }

            flee(target, maxSpeed) {
                const d = Vector.sub(this.position, target.position).mag();
                if (d < 100) {
                    const desired = Vector.sub(this.position, target.position).normalize().mult(maxSpeed);
                    return Vector.sub(desired, this.velocity).limit(0.5);
                }
                return new Vector(0, 0);
            }

            update(maxSpeed) {
                this.velocity.add(this.acceleration);
                this.velocity.limit(maxSpeed);
                this.position.add(this.velocity);
                this.acceleration.mult(0); // Reset acceleration
                this.edges();
            }

            edges() {
                if (this.position.x > width) this.position.x = 0;
                else if (this.position.x < 0) this.position.x = width;
                if (this.position.y > height) this.position.y = 0;
                else if (this.position.y < 0) this.position.y = height;
            }

            draw() {
                ctx.save();
                ctx.translate(this.position.x, this.position.y);
                ctx.rotate(Math.atan2(this.velocity.y, this.velocity.x));
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(-5, -5);
                ctx.lineTo(-5, 5);
                ctx.closePath();
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.restore();
            }
        }

        class Predator {
            constructor() {
                this.position = new Vector(Math.random() * width, Math.random() * height);
                this.velocity = new Vector(Math.random() * 2 - 1, Math.random() * 2 - 1);
                this.acceleration = new Vector(0, 0);
                this.target = null;
                this.maxSpeed = 2;
            }

            applyForce(force) { this.acceleration.add(force); }

            findTarget(flock) {
                let closestDist = Infinity;
                for (const boid of flock) {
                    const d = Vector.sub(this.position, boid.position).mag();
                    if (d < closestDist) {
                        closestDist = d;
                        this.target = boid;
                    }
                }
            }

            seek() {
                if (!this.target) return;
                const desired = Vector.sub(this.target.position, this.position).normalize().mult(this.maxSpeed);
                this.applyForce(Vector.sub(desired, this.velocity).limit(0.1));
            }

            update(maxSpeed, flock, particles, particleCount) {
                this.maxSpeed = maxSpeed;
                if (!this.target) this.findTarget(flock);

                this.seek();
                this.velocity.add(this.acceleration);
                this.velocity.limit(this.maxSpeed);
                this.position.add(this.velocity);
                this.acceleration.mult(0);
                this.edges();

                if (this.target && Vector.sub(this.position, this.target.position).mag() < 10) {
                    for (let i = 0; i < particleCount; i++) {
                        particles.push(new Particle(this.target.position.x, this.target.position.y, 'white'));
                    }
                    this.target.reset();
                    this.position = new Vector(Math.random() * width, Math.random() * height);
                    this.target = null;
                }
            }

            edges() {
                if (this.position.x > width) this.position.x = 0;
                else if (this.position.x < 0) this.position.x = width;
                if (this.position.y > height) this.position.y = 0;
                else if (this.position.y < 0) this.position.y = height;
            }

            draw(color) {
                ctx.save();
                ctx.translate(this.position.x, this.position.y);
                ctx.rotate(Math.atan2(this.velocity.y, this.velocity.x));
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-7, -7);
                ctx.lineTo(-7, 7);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Obstacle {
            constructor(radius, noiseOffset) {
                this.position = new Vector(Math.random() * width, Math.random() * height);
                this.radius = radius;
                this.noiseOffset = noiseOffset; // To give each obstacle a different path
            }

            update(time) {
                const angle = noise.noise3D(this.position.x * 0.001, this.position.y * 0.001, time + this.noiseOffset) * Math.PI * 2;
                this.position.add(new Vector(Math.cos(angle), Math.sin(angle)));

                if (this.position.x > width + this.radius) this.position.x = -this.radius;
                if (this.position.x < -this.radius) this.position.x = width + this.radius;
                if (this.position.y > height + this.radius) this.position.y = -this.radius;
                if (this.position.y < -this.radius) this.position.y = height + this.radius;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.position.x, this.position.y, this.radius, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255, 100, 100, 0.7)';
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.position = new Vector(x, y);
                this.velocity = new Vector(Math.random() * 4 - 2, Math.random() * 4 - 2);
                this.lifespan = 1.0;
                this.color = color;
            }
            update() {
                this.position.add(this.velocity);
                this.lifespan -= 0.02;
            }
            draw() {
                ctx.globalAlpha = this.lifespan;
                ctx.beginPath();
                ctx.arc(this.position.x, this.position.y, 2, 0, 2 * Math.PI);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        const flock = [];
        for (let i = 0; i < 150; i++) flock.push(new Boid());
        const predator = new Predator();
        const particles = [];
        const obstacles = [new Obstacle(40, 0), new Obstacle(60, 1000)];

        // The dial is what makes this a clock rather than a screensaver: the ring
        // marks the 12 hours, the filled arc is how far through the hour we are,
        // and in Flock mode the boids chase the marker sitting on the hour hand.
        function hourAngle(now) {
            return ((now.getHours() % 12) + now.getMinutes() / 60) / 12 * 2 * Math.PI - Math.PI / 2;
        }

        function dialRadius() {
            return Math.min(width, height) * 0.36;
        }

        function drawDial(now, target) {
            const cx = width / 2;
            const cy = height / 2;
            const r = dialRadius();
            const angle = hourAngle(now);
            const minuteFraction = (now.getMinutes() + now.getSeconds() / 60) / 60;

            ctx.save();
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.stroke();

            // Hour ticks
            for (let i = 0; i < 12; i++) {
                const a = (i / 12) * 2 * Math.PI - Math.PI / 2;
                const inner = i % 3 === 0 ? r - 14 : r - 7;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
                ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
                ctx.strokeStyle = i % 3 === 0 ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.13)';
                ctx.stroke();
            }

            // Minute arc, sweeping from the hour mark
            ctx.beginPath();
            ctx.arc(cx, cy, r, angle, angle + minuteFraction * 2 * Math.PI / 12);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Hour hand
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // The hour marker the flock is drawn to
            ctx.beginPath();
            ctx.arc(target.x, target.y, 20, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.10)';
            ctx.fill();
            ctx.restore();
        }

        // Each mode keeps the time mapping it had as a standalone clock.
        const MODES = {
            flock: {
                label: 'Flock',
                hint: 'The flock chases the hour hand; the swarm tightens as the hour fills.',
                step(now) {
                    const s = now.getSeconds();
                    const ms = now.getMilliseconds();
                    const angle = hourAngle(now);
                    const target = new Vector(
                        width / 2 + dialRadius() * Math.cos(angle),
                        height / 2 + dialRadius() * Math.sin(angle)
                    );
                    const cohesionFactor = (now.getMinutes() + s / 60) / 60; // 0 to 1 over the hour
                    const maxSpeed = 2 + 2 * Math.sin((s + ms / 1000) * 2 * Math.PI / 10);
                    drawDial(now, target);
                    for (const boid of flock) {
                        boid.flock(flock, cohesionFactor, maxSpeed);
                        boid.seek(target);
                        boid.update(maxSpeed);
                        boid.draw();
                    }
                }
            },
            noise: {
                label: 'Noise',
                hint: 'A Perlin field the minutes rewrite, pulling harder as the hours pass.',
                step(now) {
                    const timeForNoise = now.getTime() * 0.00005;
                    const cohesionFactor = (now.getMinutes() % 10) / 10;
                    const maxSpeed = 2 + 2 * Math.sin((now.getSeconds() + now.getMilliseconds() / 1000) * 2 * Math.PI / 5);
                    const hourStrength = (now.getHours() % 12) / 11; // 0 to 1 over 12 hours
                    drawDial(now, markerFor(now));
                    for (const boid of flock) {
                        boid.flock(flock, cohesionFactor, maxSpeed);
                        boid.follow(timeForNoise, hourStrength);
                        boid.update(maxSpeed);
                        boid.draw();
                    }
                }
            },
            predator: {
                label: 'Predator',
                hint: 'The hunter runs faster as the hours pass and takes its colour from the minute.',
                step(now) {
                    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
                    const predatorMaxSpeed = 1.5 + (h % 12) / 11 * 2;
                    const boidMaxSpeed = Math.max(0.5, predatorMaxSpeed - 0.5);
                    const predatorColor = `hsl(${m * 6}, 100%, 50%)`;
                    const particleCount = s % 10 + 5;

                    drawDial(now, markerFor(now));
                    predator.update(predatorMaxSpeed, flock, particles, particleCount);

                    for (const boid of flock) {
                        boid.applyForce(boid.flee(predator, boidMaxSpeed).mult(5));
                        boid.flock(flock, 1, boidMaxSpeed);
                        boid.update(boidMaxSpeed);
                        boid.draw();
                    }
                    predator.draw(predatorColor);

                    for (let i = particles.length - 1; i >= 0; i--) {
                        particles[i].update();
                        particles[i].draw();
                        if (particles[i].lifespan <= 0) particles.splice(i, 1);
                    }
                }
            },
            obstacles: {
                label: 'Obstacles',
                hint: 'The same field, now threaded between drifting obstacles.',
                step(now) {
                    const time = now.getTime() * 0.0001;
                    const cohesionFactor = (now.getMinutes() % 10) / 10;
                    const maxSpeed = 2 + 2 * Math.sin((now.getSeconds() + now.getMilliseconds() / 1000) * 2 * Math.PI / 10);

                    drawDial(now, markerFor(now));
                    for (const obs of obstacles) {
                        obs.update(time);
                        obs.draw();
                    }
                    for (const boid of flock) {
                        boid.applyForce(boid.avoid(obstacles).mult(5)); // High priority
                        boid.flock(flock, cohesionFactor, maxSpeed);
                        boid.update(maxSpeed);
                        boid.draw();
                    }
                }
            }
        };

        // Where the hour marker sits, for the modes that don't steer toward it.
        function markerFor(now) {
            const angle = hourAngle(now);
            return new Vector(
                width / 2 + dialRadius() * Math.cos(angle),
                height / 2 + dialRadius() * Math.sin(angle)
            );
        }

        let mode = 'flock';

        function buildModeButtons() {
            for (const [key, def] of Object.entries(MODES)) {
                const btn = document.createElement('button');
                btn.textContent = def.label;
                btn.dataset.mode = key;
                btn.setAttribute('aria-pressed', String(key === mode));
                btn.addEventListener('click', () => setMode(key));
                modesElement.appendChild(btn);
            }
        }

        function setMode(key) {
            mode = key;
            for (const btn of modesElement.children) {
                const on = btn.dataset.mode === key;
                btn.classList.toggle('active', on);
                btn.setAttribute('aria-pressed', String(on));
            }
            hintElement.textContent = MODES[key].hint;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            if (reduceMotion.matches) draw(); // Held still, so repaint the new mode once.
        }

        function draw() {
            const now = new Date();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, width, height);

            MODES[mode].step(now);

            digitalTimeElement.textContent = now.toLocaleTimeString();
        }

        function animate() {
            draw();
            if (!reduceMotion.matches) requestAnimationFrame(animate);
        }

        buildModeButtons();
        setMode(mode);
        animate();

        // The readout is written from inside the loop, so when the flock is held
        // still the time still has to keep ticking.
        if (reduceMotion.matches) {
            setInterval(() => {
                digitalTimeElement.textContent = new Date().toLocaleTimeString();
            }, 1000);
        }
    </script>
</body>
</html>
